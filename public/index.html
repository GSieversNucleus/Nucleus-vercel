/* ---- Milestone dates: quarter/halfway/three-quarter/completion are moving targets —
   left blank until the PM/Foreman actually reach that point in the job, then filled
   in. Once set, they're used to auto-split the "General / ongoing" AAR notes into
   before/after windows so the team can see what was logged ahead of each milestone
   vs. after it, without having to hand-tag every note. ---- */
function aarMilestoneDatesFor(job){
  const d = (job && job.aarMilestoneDates) || {};
  return AAR_MILESTONES.map((label,i)=>({ label, key: AAR_MILESTONE_KEYS[i], date: d[AAR_MILESTONE_KEYS[i]] || '' }));
}
function updateAARMilestoneDate(jobId, key, value){
  const job = getJob(jobId);
  if(!job) return;
  const dates = Object.assign({}, job.aarMilestoneDates||{});
  dates[key] = value || '';
  commit({type:'updateJob', id:jobId, patch:{aarMilestoneDates: dates}});
}
function renderAARMilestoneDates(job){
  const dates = aarMilestoneDatesFor(job);
  return `
    <div class="co-summary" style="margin-bottom:14px;">
      <div class="section-title" style="margin-top:0;">Milestone dates</div>
      <div class="issue-meta" style="margin-bottom:8px;">These are moving targets — leave one blank until you actually reach it, then plug in the date. General notes below automatically group into before/after that date.</div>
      <div class="field-row" style="flex-wrap:wrap;">
        ${dates.map(m=>`<div class="field" style="min-width:150px;"><label>${esc(m.label)}</label><input type="date" value="${m.date}" ${disabledAttr()} onchange="updateAARMilestoneDate('${job.id}','${m.key}',this.value||'')"></div>`).join('')}
      </div>
    </div>`;
}
function groupGeneralAARByDate(entries, job){
  const ms = aarMilestoneDatesFor(job).filter(m=>m.date);
  if(ms.length===0) return [{ label:'General / ongoing', entries }];
  const sorted = entries.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const groups = [];
  for(let i=0;i<ms.length;i++){
    const label = i===0 ? `Notes through ${ms[i].label} (by ${ms[i].date})` : `Notes: ${ms[i-1].label} → ${ms[i].label} (by ${ms[i].date})`;
    const items = sorted.filter(e => e.date && e.date<=ms[i].date && (i===0 || e.date>ms[i-1].date));
    groups.push({label, entries: items});
  }
  const lastDate = ms[ms.length-1].date;
  const afterItems = sorted.filter(e=> !e.date || e.date>lastDate);
  groups.push({label:`Notes since ${ms[ms.length-1].label}`, entries: afterItems});
  return groups;
}
/* ---- Ties an AAR entry back to the Elevation tracker's own numbers — manpower/
   equipment plan vs. actual, and predecessor delay — so a note like "manpower
   overage" or "predecessor delay" can show the underlying data right where it's
   discussed instead of making someone go look it up. ---- */
function elevationAggregateVarianceHTML(el){
  const items = (el && el.items) || [];
  let goalMD=0, actMD=0;
  items.forEach(i=>{
    const gm=Number(i.goalManpower)||0, gd=Number(i.goalDays)||0, am=Number(i.actualManpower)||0, ad=Number(i.actualDays)||0;
    goalMD += gm*gd; actMD += am*ad;
  });
  if(!goalMD || !actMD) return '';
  const diff = actMD-goalMD;
  const pct = Math.round((diff/goalMD)*100);
  const cls = diff>0?'over':(diff<0?'ok':'warn');
  const label = diff===0 ? 'On target vs. bid man-days' : diff>0 ? `+${diff} man-day${diff===1?'':'s'} over bid (+${pct}%)` : `${diff} man-day${diff===-1?'':'s'} vs. bid (${pct}%)`;
  return `<span class="hrs-pct ${cls}">${label}</span>`;
}
function aarLinkedElevationHTML(elevationId){
  if(!elevationId) return '';
  const el = state.elevations.find(x=>x.id===elevationId);
  if(!el) return '';
  const delay = elevationDelayDays(el);
  const parts = [];
  if(el.predecessorReq) parts.push(`Predecessor: ${esc(el.predecessorReq)}`);
  if(el.plannedEquipment) parts.push(`Equipment: ${esc(el.plannedEquipment)}`);
  if(delay!==0) parts.push(`<span class="${delay>0?'hrs-pct over':'hrs-pct ok'}">${delay>0?delay+'d late vs. scheduled start':Math.abs(delay)+'d early'}</span>`);
  const variance = elevationAggregateVarianceHTML(el);
  if(variance) parts.push(variance);
  return `<div class="issue-meta" style="margin-top:6px; padding-top:6px; border-top:1px dashed var(--line);">${icon('buildingSkyscraper')} Linked elevation — <b>${esc(el.name||el.id)}</b>${parts.length?' · '+parts.join(' · '):''}</div>`;
}
function aarSectionHTML(label, entries){

  return `

    ${entries.length===0 ? `<div class="issue-meta" style="padding:2px 0 8px;">Nothing logged yet.</div>` : rows}`;
}

function submitAAR(jobId){

  rememberName(author);

  };

}

/* ---- Photo handling ---- */
let pendingPhotoDataUrl = null;
function handlePhotoSelect(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 900;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      pendingPhotoDataUrl = canvas.toDataURL('image/jpeg', 0.62);
      const prev = document.getElementById('issue-photo-preview');
      prev.src = pendingPhotoDataUrl;
      prev.style.display = 'block';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

let rowSeq = 0;
function buildLineRow(prefill){
  rowSeq++;

  const pQty = prefill && prefill.qty!=null ? prefill.qty : '';

    <td><input type="number" class="li-qty num" placeholder="0" value="${pQty}" oninput="recalcCO()"></td>
    <td><input type="text" class="li-unit" placeholder="ea" value="${pUnit}"></td>
    <td><input type="number" class="li-price num" placeholder="0.00" step="0.01" value="${pPrice}" oninput="recalcCO()"></td>

function addRow(sectionBodyId){

function removeRow(rid){

// Shared by submitCOFillable (creating a detailed CO) and saveCOLineItems
// (editing one after the fact) — reads one line-item table's rows straight
// from the DOM, same "what's actually typed in right now" source of truth
// both places.
function sectionTotal(bodyId){
  let sum = 0;
  document.querySelectorAll('#'+bodyId+' tr').forEach(tr=>{
    const qty = parseFloat(tr.querySelector('.li-qty').value) || 0;
    const price = parseFloat(tr.querySelector('.li-price').value) || 0;
    const ext = qty * price;
    const extCell = tr.querySelector('.li-ext');
    if(extCell) extCell.textContent = fmtMoney(ext);
    sum += ext;
  });
  return sum;
}
function recalcCO(){
  const matSub = sectionTotal('mat-rows');
  const engSub = sectionTotal('eng-rows');
  const equipSub = sectionTotal('equip-rows');
  const laborSub = sectionTotal('labor-rows');
  const taxPct = parseFloat(document.getElementById('co-tax').value) || 0;
  const freight = parseFloat(document.getElementById('co-freight').value) || 0;
  const ohpPct = parseFloat(document.getElementById('co-ohp').value) || 0;
  const tax = matSub * (taxPct/100);
  const totalMaterial = matSub + tax + freight;
  const totalBeforeOH = totalMaterial + engSub + equipSub + laborSub;
  const ohAmt = totalBeforeOH * (ohpPct/100);
  const totalRequest = totalBeforeOH + ohAmt;
  const set = (id,val)=>{ const el=document.getElementById(id); if(el) el.textContent = fmtMoney(val); };
  set('sum-matsub', matSub); set('sum-tax', tax); set('sum-freight', freight);
  set('sum-totalmat', totalMaterial); set('sum-eng', engSub); set('sum-equip', equipSub);
  set('sum-labor', laborSub); set('sum-beforeoh', totalBeforeOH); set('sum-oh', ohAmt); set('sum-total', totalRequest);
  return {matSub, tax, freight, totalMaterial, engSub, equipSub, laborSub, totalBeforeOH, ohAmt, totalRequest, taxPct, ohpPct};
}

function readFileAsDataURL(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (ev)=> resolve(ev.target.result);
    reader.readAsDataURL(file);
  });
}
async function handlePdfSelect(e, listId){
  const files = Array.from(e.target.files);
  for(const file of files){
    if(file.type !== 'application/pdf') continue;
    const dataUrl = await readFileAsDataURL(file);
    const draftSize = draftAttachments.reduce((n,a)=>n+a.dataUrl.length,0);
    if(stateBytes(state) + draftSize + dataUrl.length > MAX_STATE_BYTES){
      alert(`"${file.name}" would push this job's stored data over the limit. Try a smaller PDF.`);
      continue;
    }
    draftAttachments.push({name:file.name, dataUrl, size:file.size});
  }
  e.target.value = '';
  renderAttachList(listId, draftAttachments, true);
}
async function handleAnyFileSelect(e, listId){

// Feature K: CO "number" is a separate, user-editable field from the CO's
// internal `id` — `id` is the immutable primary key every other record's
// foreign key points at (issue.coId, log text, etc.) and is never edited;
// `number` is what's actually displayed as the change order's number
// everywhere (coNumber() below) and defaults to the auto-generated id
// string at creation. Validated for uniqueness against every other CO's
// number on the SAME job before it's ever committed to state, so two COs
// on one job can never show the same number — a duplicate is rejected
// inline (co-detail-numerr) and the input reverts rather than silently
// saving or silently overwriting the other CO.
function coNumber(co){ return (co && (co.number || co.id)) || ''; }
function updateCONumber(coId, value){
  const co = state.cos.find(c=>c.id===coId);
  if(!co) return;
  const trimmed = (value||'').trim();
  const errEl = document.getElementById('co-detail-numerr');
  const inputEl = document.getElementById('co-detail-number');
  const revert = (msg)=>{
    if(errEl) errEl.textContent = msg;
    if(inputEl) inputEl.value = coNumber(co);
  };
  if(!trimmed) return revert("Change order number can't be blank.");
  const dup = state.cos.some(c=>c.jobId===co.jobId && c.id!==co.id && coNumber(c).toLowerCase()===trimmed.toLowerCase());
  if(dup) return revert(`"${trimmed}" is already used by another change order on this job — enter a different number.`);
  if(errEl) errEl.textContent = '';
  commit({type:'updateCoFields', coId, number: trimmed});
}
async function handleDetailPdfSelect(e, coId){

    if(stateBytes(state) + newAttachments.reduce((n,a)=>n+a.dataUrl.length,0) + dataUrl.length > MAX_STATE_BYTES){

function submitInvoice(){
  const code = document.getElementById('f-code').value;
  if(!code) return showErr('Select a cost code.');
  const amount = document.getElementById('f-amount').value;
  if(amount==='' || isNaN(Number(amount))) return showErr('Enter a valid amount.');
  const entry = {
    id: nextId('invoices', ui.jobId, 'INV'), jobId: ui.jobId,
    costCode: code,
    vendor: document.getElementById('f-vendor').value.trim(),
    invoiceNumber: document.getElementById('f-invnum').value.trim(),
    amount: Number(amount),
    date: document.getElementById('f-date').value || todayStr(),
    status: document.getElementById('f-status').value,
    attachments: draftAttachments.slice()
  };
  draftAttachments = [];
  commit({type:'addInvoice', entry});
  closeModal();
}
function submitTask(){
  const name = document.getElementById('f-name').value.trim();
  if(!name) return showErr('Enter a task / activity name.');
  const duration = document.getElementById('f-duration').value;
  if(duration==='' || isNaN(Number(duration)) || Number(duration)<1) return showErr('Enter a valid duration in days.');
  const start = document.getElementById('f-start').value || todayStr();
  const entry = {
    id: nextId('schedule', ui.jobId, 'TSK'), jobId: ui.jobId,
    name,
    trade: document.getElementById('f-trade').value.trim(),
    manpower: Number(document.getElementById('f-manpower').value) || 0,
    duration: Number(duration),
    originalStart: start, currentStart: start, actualStart: '',
    status: 'Not Started', delayReason: '', linkedIssueId: '',
    priority: document.getElementById('f-priority').value || 'Medium',
    dueDate: document.getElementById('f-duedate').value || '',
    notes: [], attachments: []
  };
  commit({type:'addTask', entry});
  closeModal();
}

/* ---- Import schedule from Excel ---- */
function openScheduleImportModal(){
  scheduleImportState = null;
  openModal('schedule-import');
}
function guessScheduleColumnMap(headers){
  const used = new Set();
  const pick = (regex)=>{
    for(let i=0;i<headers.length;i++){
      if(used.has(i)) continue;
      if(regex.test(headers[i])){ used.add(i); return i; }
    }
    return '';
  };
  return {
    name: pick(/task|activity|description|scope|item/i),
    trade: pick(/trade|crew\b|sub(contractor)?\b/i),
    manpower: pick(/manpower|crew size|headcount|#?\s*of\s*(men|workers|crew)|workers/i),
    duration: pick(/duration|days?\b/i),
    start: pick(/start|begin/i),
    due: pick(/due|finish|end|complete/i),
    priority: pick(/priority/i)
  };
}
async function handleScheduleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  if(typeof XLSX==='undefined'){
    showErr("Couldn't load the spreadsheet reader (no internet connection?). Try again once you're back online.");
    return;
  }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const grid = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
    if(!grid.length){ showErr('That workbook looks empty.'); return; }
    const headers = grid[0].map((h,i)=> String(h||'').trim() || `Column ${String.fromCharCode(65+i)}`);
    const rows = grid.slice(1).filter(r=> r.some(c=> String(c==null?'':c).trim()!==''));
    if(!rows.length){ showErr('Found a header row but no data rows underneath it.'); return; }
    scheduleImportState = { fileName: file.name, headers, rows, mapping: guessScheduleColumnMap(headers) };
    openModal('schedule-import');
  }catch(err){
    showErr("Couldn't read that file — make sure it's a real .xlsx/.xls/.xlsm workbook.");
  }
}
function scheduleImportFieldSelect(field, label, required){
  const headers = scheduleImportState.headers;
  const sel = scheduleImportState.mapping[field];
  const opts = [`<option value="">${required?'— choose a column —':'— none / skip —'}</option>`]
    .concat(headers.map((h,i)=>`<option value="${i}" ${sel===i?'selected':''}>${esc(h)}</option>`));
  return `<div class="field"><label>${esc(label)}${required?' *':''}</label><select onchange="updateScheduleImportMapping('${field}', this.value)">${opts.join('')}</select></div>`;
}
function updateScheduleImportMapping(field, value){

}

function parseIntSafeLoose(v){
  if(v==null || v==='') return null;
  const n = Number(String(v).replace(/[^0-9.\-]/g,''));
  return isFinite(n) ? Math.round(n) : null;
}
function parseExcelDateCell(v){
  if(v==null || v==='') return '';
  const pad = (n)=> String(n).padStart(2,'0');
  if(v instanceof Date && !isNaN(v)){
    return `${v.getUTCFullYear()}-${pad(v.getUTCMonth()+1)}-${pad(v.getUTCDate())}`;
  }
  if(typeof v==='number' && isFinite(v)){
    const ms = Math.round((v - 25569) * 86400 * 1000);
    const d = new Date(ms);
    if(!isNaN(d)) return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
    return '';
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){
    let [,mo,da,yr] = m;
    if(yr.length===2) yr = (Number(yr)<50?'20':'19')+yr;
    return `${yr}-${pad(mo)}-${pad(da)}`;
  }
  const d = new Date(s);
  if(!isNaN(d)) return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  return '';
}
function normalizeImportedPriority(v){
  const s = String(v||'').trim().toLowerCase();
  if(s.startsWith('h')) return 'High';
  if(s.startsWith('l')) return 'Low';
  if(s.startsWith('m')) return 'Medium';
  return 'Medium';
}
function computeScheduleImportPreview(){
  const {rows, mapping} = scheduleImportState;
  const get = (row, field)=> mapping[field]!==''? row[mapping[field]] : '';
  return rows.map(row=>{
    const name = String(get(row,'name')||'').trim();
    const trade = String(get(row,'trade')||'').trim();
    const manpower = parseIntSafeLoose(get(row,'manpower'));
    const duration = parseIntSafeLoose(get(row,'duration'));
    const start = parseExcelDateCell(get(row,'start'));
    const due = parseExcelDateCell(get(row,'due'));
    const priorityRaw = get(row,'priority');
    const priority = priorityRaw!==''? normalizeImportedPriority(priorityRaw) : 'Medium';
    return { name, trade, manpower, duration, start, due, priority, valid: !!name };
  });
}
function submitScheduleImport(){
  if(!scheduleImportState) return;
  const valid = computeScheduleImportPreview().filter(r=>r.valid);
  if(!valid.length) return showErr('No rows matched — make sure "Task name" is mapped to a column that has data in it.');
  const startCount = state.schedule.filter(x=>x.jobId===ui.jobId).length;
  const entries = valid.map((r,i)=>({
    id: `${ui.jobId}-TSK-${String(startCount+i+1).padStart(3,'0')}`, jobId: ui.jobId,
    name: r.name, trade: r.trade||'', manpower: r.manpower||0,
    duration: (r.duration && r.duration>=1) ? r.duration : 1,
    originalStart: r.start||todayStr(), currentStart: r.start||todayStr(), actualStart: '',
    status: 'Not Started', delayReason: '', linkedIssueId: '',
    priority: r.priority||'Medium', dueDate: r.due||'',

  }));
  commit({type:'addTasks', entries});
  scheduleImportState = null;
  closeModal();
  alert(`Imported ${entries.length} task${entries.length===1?'':'s'} from the spreadsheet.`);
}

    const val = input ? input.value : '';

      if(input) input.style.borderColor = 'var(--safety)';
      return;
    }
    commit({type:'setIssueCost', issueId, cost:Number(val)});
  }
  convertToCO(issueId);
}

async function boot(){
  await checkAuthMode();
  if(!getAuthToken()){ showLoginGate(); return; }
  document.getElementById('app').innerHTML = `<div class="empty">${icon('loader2','spin')}Loading job data…</div>`;
  readOnly = false;
  let loaded = null;
  let authFailed = false;
  // Re-confirms identity fresh from the server on every boot (not just right
  // after a fresh sign-in) — this is what makes the "You" dropdown lock to
  // the real signed-in person even on a tab that was just reopened, not only
  // immediately after typing a password or completing Microsoft sign-in.
  try{
    const meRes = await authFetch('/api/me', {cache:'no-store'});
    if(meRes.status === 401){ authFailed = true; }
    else if(meRes.ok){
      const meData = await meRes.json();
      verifiedIdentity = meData.identity || null;
    }
  }catch(e){ /* offline — keep whatever verifiedIdentity is already set, if any */ }
  if(!authFailed){
    try{
      const res = await authFetch(STATE_FILE, {cache:'no-store'});
      if(res.status === 401){ authFailed = true; }
      else if(res.ok){
        loaded = await res.json();
        stateVersion = Number(res.headers.get('X-State-Version')) || 0;
      }
    }catch(e){ /* offline — fall back to whatever's in this tab already, if anything */ }
  }
  if(authFailed){
    setAuthToken('');
    showLoginGate();
    return;
  }
  state = migratePostitTypes(migrateAssignedPMs(Object.assign(defaultState(), loaded || {})));
  const projectedCostsMigrated = migrateProjectedCosts();
  if(verifiedIdentity && verifiedIdentity.matched && verifiedIdentity.teamMemberId){
    // Real, verified identity replaces the self-picked "You" dropdown.
    currentTeamMemberId = verifiedIdentity.teamMemberId;
    try{ localStorage.setItem(TEAM_ID_STORAGE_KEY, currentTeamMemberId); }catch(e){}
  }
  if(pendingQueue.length){ pendingQueue.forEach(op => applyOp(op)); }
  render();
  if(loaded === null){
    setSavePill('offline', "Couldn't reach the server — changes stay in this tab until it's back");
  } else if(pendingQueue.length || projectedCostsMigrated){
    doPersist();
  } else {
    setSavePill('saved', 'All changes saved');
  }
  startPolling();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/sw.js').catch(e => console.warn('service worker registration failed', e));
  }
  handleOpenJobFromUrl();
  initPushSupport();
}

/* Flush any unsaved edit immediately when the tab is closed, backgrounded, or
   navigated away from, instead of waiting out the normal ~1.2s typing-debounce.
   Every change is applied to `state` and queued in sessionStorage the instant
   it happens (see commit()), so nothing is ever lost from memory — this just
   closes the small window where a change could still be sitting unsent to the
   server if the tab disappears before the debounce timer fires. If the save
   truly can't finish in time (e.g. no network), the change stays in
   sessionStorage's pending queue and is retried automatically the next time
   this tab reopens to Nucleus (see boot() above) — it is not silently dropped
   unless the browser itself clears session storage for the tab. */
function flushPendingSaveNow(){
  if(pendingQueue.length && !saveInFlight){
    clearTimeout(saveTimer);
    doPersist();
  }
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden') flushPendingSaveNow();
});
window.addEventListener('pagehide', flushPendingSaveNow);

/* ===================== DRAG & DROP FOR EVERY UPLOAD ZONE =====================
   Every upload area in the app is a `.photo-drop` div whose onclick opens the
   file input it's paired with (`document.getElementById('some-input').click()`).
   Rather than touch each of the 30+ upload areas individually, this reads that
   same onclick attribute to find the paired input, then drives it exactly the
   way a real file-picker selection would: assign the dropped files to the
   input via a DataTransfer, then dispatch a 'change' event so every existing
   handler (attachments, photos, Green Sheet parsing, the Excel schedule
   importer, etc.) fires completely unchanged. */
(function(){
  function dropZoneInput(zone){
    const oc = zone.getAttribute('onclick') || '';
    const m = oc.match(/getElementById\(['"]([^'"]+)['"]\)/);
    return m ? document.getElementById(m[1]) : null;
  }
  document.addEventListener('dragenter', (e)=>{
    const zone = e.target.closest && e.target.closest('.photo-drop');
    if(zone){ e.preventDefault(); zone.classList.add('drag-over'); }
  });
  document.addEventListener('dragover', (e)=>{
    // Always preventDefault, even outside a drop zone — otherwise the browser
    // navigates away to show the dropped file instead of doing nothing.
    e.preventDefault();
  });
  document.addEventListener('dragleave', (e)=>{
    const zone = e.target.closest && e.target.closest('.photo-drop');
    if(zone && (!e.relatedTarget || !zone.contains(e.relatedTarget))) zone.classList.remove('drag-over');
  });
  document.addEventListener('drop', (e)=>{
    e.preventDefault();
    const zone = e.target.closest && e.target.closest('.photo-drop');
    if(!zone) return;
    zone.classList.remove('drag-over');
    const input = dropZoneInput(zone);
    const files = e.dataTransfer && e.dataTransfer.files;
    if(!input || !files || !files.length) return;
    try{
      const dt = new DataTransfer();
      Array.from(files).forEach(f=>dt.items.add(f));
      input.files = dt.files;
      input.dispatchEvent(new Event('change', {bubbles:true}));
    }catch(err){ /* very old browser without DataTransfer construction — click-to-upload still works */ }
  });
})();

boot();

function addJobPM(jobId, pmId){
  if(!pmId) return;
  const job = getJob(jobId);
  if(!job) return;
  const current = job.assignedPMs || [];
  if(current.includes(pmId)) return;
  commit({type:'updateJob', id: jobId, patch:{assignedPMs: [...current, pmId]}});
}
function removeJobPM(jobId, pmId){
  const job = getJob(jobId);
  if(!job) return;
  const current = job.assignedPMs || [];
  commit({type:'updateJob', id: jobId, patch:{assignedPMs: current.filter(id=>id!==pmId)}});
}
function addJobForeman(jobId, foremanId){
  if(!foremanId) return;
  const job = getJob(jobId);
  if(!job) return;
  const current = job.assignedForemen || [];
  if(current.includes(foremanId)) return;
  commit({type:'updateJob', id: jobId, patch:{assignedForemen: [...current, foremanId]}});
}

function collectJobLogEntries(jobId, hideFieldLogs){
  const out = [];

    state.logs.filter(l=>l.jobId===jobId).forEach(l=>{
      out.push({ id:l.id, date:l.date||'', author:l.author||'', text:l.note||'', bucket:'Field Logs', sourceLabel:'Field Logs' });
    });
  }
  // Feature G: category travels with each Notes entry so the Log & Notes
  // page can offer it as an additional, purely additive filter — see
  // ui.jobLogCategory / setJobLogCategoryFilter / renderAllLogsPage below.
  // Entries from every other bucket simply have no category, same as today.
  state.notes.filter(n=>n.jobId===jobId).forEach(n=>{
    out.push({ id:n.id, date:n.date||'', author:n.author||'', text:n.text||'', bucket:'Notes', sourceLabel:'Notes', category:n.category||'' });
  });
  state.schedule.filter(t=>t.jobId===jobId).forEach(t=>{
    (t.notes||[]).forEach(n=>{
      out.push({ id:n.id, date:n.date||'', author:n.author||'', text:n.text||'', bucket:'Schedule', sourceLabel:`Schedule — task: ${t.name}` });
    });
  });
  state.scheduleFieldNotes.filter(n=>n.jobId===jobId).forEach(n=>{
    out.push({ id:n.id, date:n.date||'', author:n.author||'', text:n.text||'', bucket:'Schedule', sourceLabel:'Schedule — field coordination note' });
  });
  state.gcCommLog.filter(n=>n.jobId===jobId).forEach(n=>{
    out.push({ id:n.id, date:n.date||'', author:n.author||'', text:n.text||'', bucket:'Schedule', sourceLabel:'Schedule — GC coordination'+(n.category?' ('+n.category+')':'') });
  });
  state.requests.filter(r=>r.jobId===jobId).forEach(r=>{
    (r.fieldNotes||[]).forEach(n=>{
      out.push({ id:n.id, date:n.date||'', author:n.author||'', text:n.text||'', bucket:'PM Requests', sourceLabel:`PM Request — ${r.title}` });
    });
  });
  state.elevations.filter(e=>e.jobId===jobId).forEach(e=>{
    (e.foremanNotes||[]).forEach(n=>{
      out.push({ id:n.id, date:n.date||'', author:n.author||'', text:n.text||'', bucket:'Elevations', sourceLabel:`Elevation — ${e.name}` });
    });
  });
  state.engineering.filter(en=>en.jobId===jobId).forEach(en=>{
    (en.comments||[]).forEach(c=>{
      out.push({ id:c.id, date:c.date||'', author:c.author||'', text:c.text||'', bucket:'Engineering', sourceLabel:`Engineering — ${en.title}` });
    });
  });
  state.aar.filter(a=>a.jobId===jobId).forEach(a=>{
    out.push({ id:a.id, date:a.date||'', author:a.author||'', text:a.text||'', bucket:'AAR', sourceLabel:'AAR'+(a.milestone?' — '+a.milestone:' — General')+(a.category?' · '+a.category:'') });
  });
  state.dailyReports.filter(d=>d.jobId===jobId).forEach(d=>{
    out.push({ id:d.id, date:d.date||'', author:d.author||'', text:d.notes||'(no notes typed — see attachments)', bucket:'Daily Reports', sourceLabel:'Daily Reports'+(d.weather?' · '+d.weather:'') });

    });

function jobCardAssignHTML(job){
  const pms = state.team.filter(m=>m.role==='Project Manager').slice().sort((a,b)=>a.name.localeCompare(b.name));
  const assignedPmIds = job.assignedPMs || [];
  const pmChips = assignedPmIds.map(id=>{
    const m = state.team.find(t=>t.id===id);
    if(!m) return '';
    return `<span class="foreman-chip">${esc(m.name)}${readOnly ? '' : `<button type="button" title="Remove ${esc(m.name)}" onclick="event.stopPropagation(); removeJobPM('${job.id}','${id}')">${icon('x')}</button>`}</span>`;
  }).join('');
  const availablePms = pms.filter(m=>!assignedPmIds.includes(m.id));
  const addPmSelect = (!readOnly && availablePms.length)
    ? `<select onclick="event.stopPropagation()" onchange="event.stopPropagation(); addJobPM('${job.id}', this.value); this.value='';" ${disabledAttr()}>
        <option value="">+ Add PM</option>${availablePms.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}
      </select>`
    : '';
  const noPms = pms.length===0;
  const foremen = state.team.filter(m=>m.role==='Foreman').slice().sort((a,b)=>a.name.localeCompare(b.name));
  const assignedIds = job.assignedForemen || [];
  const chips = assignedIds.map(id=>{
    const m = state.team.find(t=>t.id===id);
    if(!m) return '';
    return `<span class="foreman-chip">${esc(m.name)}${readOnly ? '' : `<button type="button" title="Remove ${esc(m.name)}" onclick="event.stopPropagation(); removeJobForeman('${job.id}','${id}')">${icon('x')}</button>`}</span>`;
  }).join('');
  const available = foremen.filter(m=>!assignedIds.includes(m.id));
  const addSelect = (!readOnly && available.length)
    ? `<select onclick="event.stopPropagation()" onchange="event.stopPropagation(); addJobForeman('${job.id}', this.value); this.value='';" ${disabledAttr()}>
        <option value="">+ Add foreman</option>${available.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}
      </select>`
    : '';
  const noForemen = state.team.filter(m=>m.role==='Foreman').length===0;
  return `<div class="job-card-assign" onclick="event.stopPropagation()">
    <div class="job-card-assign-row">
      <span class="l">PM</span>
      <div class="chip-row">${pmChips}${addPmSelect}${!pmChips && noPms ? '<span class="job-card-assign-empty">Add PMs on the Team section below</span>' : ''}</div>
    </div>
    <div class="job-card-assign-row">
      <span class="l">Foremen</span>
      <div class="chip-row">${chips}${addSelect}${!chips && noForemen ? '<span class="job-card-assign-empty">Add Foremen on the Team section below</span>' : ''}</div>
    </div>
  </div>`;
}

function needsOrderingSoon(p){
  if(!p.neededBy || p.status!=='Not Ordered') return false;
  return daysBetweenStr(todayStr(), p.neededBy) <= PROCUREMENT_ORDER_BUFFER_DAYS;
}

function openMaterialReminderModal(job, items){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  const sorted = items.slice().sort((a,b)=>(a.neededBy||'').localeCompare(b.neededBy||''));
  const rows = sorted.map(p=>{
    const days = daysBetweenStr(todayStr(), p.neededBy);
    const whenLabel = days<0 ? `${Math.abs(days)}d overdue` : (days===0 ? 'Needed today' : `Needed in ${days}d`);
    return `
    <div class="log-entry">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
        <div style="flex:1; min-width:0;">
          <div style="font-weight:700; font-size:13.5px;">${esc(p.item)}</div>
          <div class="issue-meta">${p.vendor?esc(p.vendor)+' · ':''}Needed ${p.neededBy}${p.costCode?' · '+esc(p.costCode):''}</div>
        </div>
        <span class="badge ${days<0?'pending':'cat-ineff'}" style="flex-shrink:0;">${whenLabel}</span>
      </div>
    </div>`;
  }).join('');
  overlay.innerHTML = `<div class="modal">
    <h3>${icon('alertTriangle')} Material ordering reminder</h3>
    <p class="sub">${job.id} — ${esc(job.name)}. ${sorted.length} material${sorted.length>1?'s':''} still marked Not Ordered, needed within ${PROCUREMENT_ORDER_BUFFER_DAYS} days — order soon to avoid delaying the schedule.</p>
    ${rows}
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Dismiss</button>
      <button class="btn safety" onclick="closeModal(); setTab('procurement');">${icon('truck')} Go to Procurement</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
}

function readCOSection(bodyId){
  return Array.from(document.querySelectorAll('#'+bodyId+' tr')).map(tr=>{
    const desc = tr.querySelector('.li-desc').value.trim();
    const qty = parseFloat(tr.querySelector('.li-qty').value) || 0;

function renderRoleCalendarSection(opts){
  const jobs = state.jobs.slice().sort((a,b)=>a.id.localeCompare(b.id));

  const job = opts.jobId ? getJob(opts.jobId) : null;

  const mode = opts.mode || 'field';
  const month = opts.month || currentMonthStr();

  const today = todayStr();
  const dayHeaders = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dowhead">${d}</div>`).join('');
  const cellsHtml = cells.map(dateStr=>{
    if(!dateStr) return `<div class="cal-cell empty-cell"></div>`;
    const dnum = Number(dateStr.slice(8,10));
    let chips = '', crewBadge = '';
    if(mode==='field'){
      const dayTasks = state.schedule.filter(t=> (allJobs || t.jobId===job.id) && t.status!=='Complete' && t.currentStart && dateStr >= t.currentStart && dateStr <= addDaysStr(t.currentStart, Math.max(1,t.duration||1)-1));
      if(allJobs){
        const totalCrew = dayTasks.reduce((s,t)=>s+(Number(t.manpower)||0),0);
        if(totalCrew>0) crewBadge = `<div class="cal-daycount" title="Total crew scheduled across all jobs">${totalCrew}</div>`;
        chips = dayTasks.map(t=>{
          const j = getJob(t.jobId);
          const label = `${j?j.id+': ':''}${t.name}`;
          return `<div class="cal-chip click-only job-chip status-${(t.status||'').replace(/\s+/g,'-').toLowerCase()}" onclick="openJob('${t.jobId}','schedule'); openTaskDetail('${t.id}')" title="${esc(label)} — ${t.manpower||0} crew, ${t.duration||0}d"><span class="cal-jobdot" style="background:${jobColor(t.jobId)};"></span>${esc(label)}${t.manpower?' · '+t.manpower:''}</div>`;

/* =====================================================================
   Jobs Map — every job's location pinned on one map, so it's easy to see
   at a glance how spread out the company's active jobs are. Same
   "standalone top-bar page" pattern as Standards/Post-it Board above.

   Only real here, not on the Claude Artifact master: a real map needs real
   map tiles (images fetched from a tile server) and a real geocoding call
   (turning a typed address into coordinates) — an Artifact page runs inside
   a locked-down sandbox that can't do either. This build is just a normal
   website with a normal server, so both work fine. Greg confirmed this
   trade-off directly: a real interactive map on nucleus-pwa/nucleus-vercel,
   nothing added to the Artifact link.

   Uses Leaflet + OpenStreetMap tiles (both free, no API key/account needed
   from Greg) and colored circle markers built from each job's own
   jobColor() — no external marker-icon image files to fetch, consistent
   with this project's "no silently-broken external icon" lesson from
   early on (see "Icons were broken" in the project notes).
   ===================================================================== */
function openMapPage(){ ui.view='map'; render(); }

function jobsNeedingLocation(){
  return state.jobs.filter(j => (j.address||'').trim() && (
    j.lat==null || j.lng==null || j.geocodedAddress !== j.address
  ));
}

function renderMapPage(){
  const app = document.getElementById('app');
  const banner = readOnly ? `<div class="readonly-banner">${icon('helpCircle')} You have a read-only view of this command center — changes here won't be saved.</div>` : '';
  const noAddress = state.jobs.filter(j => !(j.address||'').trim());
  const needsLocating = jobsNeedingLocation();
  app.innerHTML = `
    ${banner}
    <span class="breadcrumb" onclick="goHome()">${icon('arrowLeft')} All jobs</span>
    <div class="panel-head"><h3>Job locations</h3>
      ${needsLocating.length ? `<button class="btn sm" onclick="refreshAllJobLocations()" id="map-refresh-btn">${icon('refreshCw')} Locate ${needsLocating.length} job${needsLocating.length===1?'':'s'}</button>` : ''}
    </div>
    <div id="jobs-map-status" class="issue-meta" style="margin-bottom:6px;"></div>
    <div id="jobs-map" style="height:60vh; min-height:360px; border:1px solid var(--line); border-radius:var(--radius);"></div>
    ${noAddress.length ? `<div class="issue-meta" style="margin-top:10px;">${icon('helpCircle')} No address on file yet, so not shown on the map: ${noAddress.map(j=>esc(j.id+' — '+j.name)).join(', ')}. Add an address from that job's Job settings.</div>` : ''}
  `;
  initJobsMap();
}

function initJobsMap(){
  const mapEl = document.getElementById('jobs-map');
  if(!mapEl) return;
  if(typeof L === 'undefined'){
    mapEl.outerHTML = `<div class="issue-meta">${icon('helpCircle')} The map library didn't load — check your internet connection and reload this page. (Everything else in Nucleus still works normally.)</div>`;
    return;
  }
  // Re-rendering this page tears down and rebuilds the DOM node Leaflet was
  // attached to; Leaflet itself needs an explicit teardown first or it
  // throws "Map container is already initialized" on the next createMap.
  if(window._jobsMapInstance){ try{ window._jobsMapInstance.remove(); }catch(e){} window._jobsMapInstance = null; }

  const map = L.map('jobs-map');
  window._jobsMapInstance = map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
  }).addTo(map);

  const pins = state.jobs.filter(j => typeof j.lat==='number' && typeof j.lng==='number');
  if(pins.length===0){
    map.setView([39.5, -98.35], 4); // continental-US default view until something's pinned
    return;
  }
  const bounds = [];
  pins.forEach(j=>{
    const color = jobColor(j.id);
    const marker = L.circleMarker([j.lat, j.lng], {
      radius: 10, color: '#fff', weight: 2, fillColor: color, fillOpacity: 0.9
    }).addTo(map);
    marker.bindPopup(`
      <div style="font:13px var(--sans,sans-serif); min-width:160px;">
        <div style="font-weight:700; margin-bottom:2px;">${esc(j.id)} — ${esc(j.name)}</div>
        ${j.gc ? `<div>${esc(j.gc)}</div>` : ''}
        <div style="color:#666; margin:2px 0 6px;">${esc(j.address||'')}</div>
        <button type="button" onclick="openJob('${j.id}')" style="font:inherit; padding:4px 8px; cursor:pointer;">Open job →</button>
      </div>
    `);
    bounds.push([j.lat, j.lng]);
  });
  if(bounds.length===1) map.setView(bounds[0], 12);
  else map.fitBounds(bounds, {padding:[30,30]});
}

// Turns one job's address into map coordinates via the server's /api/geocode
// route (OpenStreetMap's free Nominatim service — see server/geocode.js).
// Called automatically in the background right after an address is
// saved/changed (see submitBudget below), and offered as a manual retry on
// the Map page for anything that's missing or failed. pushApiFetch is the
// same authFetch-with-a-plain-fetch-fallback helper the push-notification
// code already uses — nothing push-specific about it, it just lives there.
async function geocodeJobAddress(jobId){
  const job = getJob(jobId);
  if(!job || !(job.address||'').trim()) return;
  const address = job.address.trim();
  try{
    const res = await pushApiFetch('/api/geocode?address='+encodeURIComponent(address));
    if(res.status===200){
      const data = await res.json();
      commit({type:'updateJob', id: jobId, patch:{
        lat: data.lat, lng: data.lng, geocodedAddress: address, geocodeStatus: 'ok', geocodedAt: Date.now()
      }});
    } else if(res.status===404){
      commit({type:'updateJob', id: jobId, patch:{geocodedAddress: address, geocodeStatus: 'failed'}});
    }
    // Any other status (401/502/network hiccup): leave existing lat/lng
    // alone and don't mark it as a confirmed failure — worth retrying later
    // rather than recording a false "address not found."
  }catch(e){ /* offline or the request itself failed — silently retryable */ }
}

async function refreshAllJobLocations(){
  const btn = document.getElementById('map-refresh-btn');
  const statusEl = document.getElementById('jobs-map-status');
  const jobs = jobsNeedingLocation();
  for(let i=0;i<jobs.length;i++){
    if(btn) btn.textContent = `Locating ${i+1} of ${jobs.length}…`;
    if(statusEl) statusEl.textContent = `Locating ${jobs[i].id} — ${jobs[i].name}…`;
    await geocodeJobAddress(jobs[i].id);
  }
  if(statusEl) statusEl.textContent = '';
  if(ui.view==='map') renderMapPage();
}

/* ===================== PM NOTES OVERVIEW (Feature P) =====================
   Greg: "an overview of all job notes to help set reminders and easier
   search," plus (his words) "an AI Agent to help consolidate notes" —
   confirmed with him directly that a live AI summarizer needs an API key
   and per-use cost he hasn't set up, so this is the deterministic version
   instead: every Note AND Meeting Minutes item across every job this PM is
   assigned to, in one searchable/sortable list, with a rule-based
   "worth a look" section modeled on the existing PM Briefing's own
   "Needs attention" heuristics (renderBriefing above) — no external calls.
   Same "Project Manager only, View-As-aware" gate as renderPMCalendarSection
   right above it, and the same visibleJobs() PM-assignment scoping. */
// Deterministic follow-up heuristic, same spirit as renderBriefing's
// "Needs attention" (overdue items / pending cost impacts / behind-schedule
// elevations): a note is flagged if it's categorized "Delays", or its text
// contains obvious follow-up language. Any job with zero flagged notes still
// gets its single most recent note surfaced, so "worth a look" always has
// something for every job that has notes at all, not just the noisy ones.
const PM_NOTES_FOLLOWUP_RE = /follow[\s-]?up|reminder|urgent|asap|pending|need(?:s)? to|waiting on|to-?do|deadline/i;
function pmNotesIsFlagged(item){
  return item.category==='Delays' || PM_NOTES_FOLLOWUP_RE.test(item.text||'');
}
function collectPMNotesOverviewItems(jobs){
  const jobIds = new Set(jobs.map(j=>j.id));
  const out = [];
  state.notes.filter(n=>jobIds.has(n.jobId)).forEach(n=>{
    out.push({ id:n.id, jobId:n.jobId, date:n.date||'', author:n.author||'', category:n.category||'General', text:n.text||'', kind:'Note' });
  });
  // Meeting Minutes items don't carry a NOTE_CATEGORIES category of their
  // own — grouped under a "Meeting Minutes" pseudo-category (see
  // renderPMNotesOverviewSection's category grouping) rather than forcing
  // them into an unrelated Notes category.
  state.meetingMinutes.filter(m=>jobIds.has(m.jobId)).forEach(m=>{
    (m.items||[]).forEach(it=>{
      out.push({ id:it.id, jobId:m.jobId, date:m.date||'', author:m.attendees||'', category:'Meeting Minutes', text:it.text||'', kind:'Meeting Minutes' });
    });
  });
  return out;
}
function setPMNotesSearch(v){ ui.pmNotesSearch = v; render(); }
function setPMNotesSort(v){ ui.pmNotesSort = v; render(); }
function renderPMNotesOverviewSection(){
  const me = getEffectiveTeamMember();
  if(!me || me.role!=='Project Manager') return '';
  const jobs = visibleJobs();
  if(jobs.length===0) return '';
  const all = collectPMNotesOverviewItems(jobs);
  if(all.length===0) return '';
  const jobById = new Map(jobs.map(j=>[j.id,j]));
  const q = (ui.pmNotesSearch||'').trim().toLowerCase();
  const filtered = q ? all.filter(it=> (it.text||'').toLowerCase().includes(q) || (it.author||'').toLowerCase().includes(q)) : all;

  const flagged = all.filter(pmNotesIsFlagged);
  const flaggedJobIds = new Set(flagged.map(it=>it.jobId));
  jobs.forEach(j=>{
    if(flaggedJobIds.has(j.id)) return;
    const jItems = all.filter(it=>it.jobId===j.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    if(jItems.length) flagged.push(jItems[0]);
  });
  const flaggedSorted = flagged.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,10);
  const flaggedHtml = flaggedSorted.length ? flaggedSorted.map(it=>{
    const job = jobById.get(it.jobId);
    return `<div class="brief-line">${icon(pmNotesIsFlagged(it)?'helpCircle':'clock')}<span><b>${job?job.id:it.jobId}</b> — ${esc((it.text||'').slice(0,110))} <span class="issue-meta">(${esc(it.kind)}${it.date?', '+it.date:''})</span></span></div>`;
  }).join('') : `<div class="issue-meta">Nothing flagged right now.</div>`;

  const sortMode = ui.pmNotesSort || 'date';
  let sorted = filtered.slice();
  let groupsHtml = '';
  const rowHtml = (it) => {
    const job = jobById.get(it.jobId);
    return `<div class="log-entry">
      <div class="lmeta">${job?job.id:it.jobId}${job&&job.name?' — '+esc(job.name):''} · ${it.date||'—'} · ${esc(it.author||'—')} · ${esc(it.category)}${it.kind==='Meeting Minutes'?' · Meeting Minutes':''}</div>
      <div style="font-size:13.5px; margin-top:2px; white-space:pre-wrap;">${esc(it.text)}</div>
    </div>`;
  };
  if(sortMode==='job'){
    const byJob = {};
    sorted.forEach(it=>{ (byJob[it.jobId] = byJob[it.jobId]||[]).push(it); });
    groupsHtml = jobs.filter(j=>byJob[j.id]).map(j=>{
      const items = byJob[j.id].slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
      return `<div class="section-title">${j.id} — ${esc(j.name)}</div>${items.map(rowHtml).join('')}`;
    }).join('');
  } else if(sortMode==='category'){
    const cats = [...NOTE_CATEGORIES, 'Meeting Minutes'];
    const byCat = {};
    sorted.forEach(it=>{ (byCat[it.category] = byCat[it.category]||[]).push(it); });
    groupsHtml = cats.filter(c=>byCat[c] && byCat[c].length).map(c=>{
      const items = byCat[c].slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
      return `<div class="section-title">${esc(c)}</div>${items.map(rowHtml).join('')}`;
    }).join('');
  } else {
    sorted.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    groupsHtml = sorted.map(rowHtml).join('');
  }

  return `
    <div class="panel-head" style="margin-top:28px;"><h3>Notes overview — my jobs</h3></div>
    <div class="issue-meta" style="margin:-6px 0 12px;">Every Note and Meeting Minutes item across your assigned jobs, in one searchable place — not a live AI summary, just organized from what's already logged.</div>
    <div class="brief-card" style="margin-bottom:16px;"><div class="section-title" style="margin-top:0;">Worth a look</div>${flaggedHtml}</div>
    <div class="field-row" style="margin-bottom:12px;">
      <div class="field"><label>Search</label><input value="${esc(ui.pmNotesSearch||'')}" placeholder="Search note text or author" oninput="setPMNotesSearch(this.value)"></div>
      <div class="field"><label>Group / sort by</label>
        <select onchange="setPMNotesSort(this.value)">
          <option value="date" ${sortMode==='date'?'selected':''}>Date (newest first)</option>
          <option value="job" ${sortMode==='job'?'selected':''}>Job</option>
          <option value="category" ${sortMode==='category'?'selected':''}>Category</option>
        </select>
      </div>
    </div>
    ${filtered.length===0 ? emptyBlock('notebook','Nothing matches this search.') : groupsHtml}`;
}

/* ===================== NOTIFICATIONS (Feature O) =====================
   Greg originally asked for email/text alerts; that needs a paid
   SendGrid/Twilio-style account he hasn't set up, so — confirmed with him
   directly — this is in-app only: a bell in the top bar with an unread
   badge, same anchored-panel pattern as the Team dropdown above (see
   toggleTeamDropdown/openTeamDropdown/closeTeamDropdown, mirrored here).
   Judgment call: the bell always reflects the REAL signed-in identity
   (getCurrentTeamMember), never the "View As" preview — notifications are
   personal, and letting a preview swap whose inbox you're looking at would
   leak another person's notifications to whoever's previewing. Hidden
   entirely when nobody's signed in (nothing to be "your" notifications).
   Shape: state.notifications = [{id, recipientMemberId, type, message,
   jobId, refId, read, createdDate}]. type is 'pmRequest' or 'costImpact'
   (drives where clicking a notification navigates to). */
let notifSeq = 0;
function nextNotifId(){ notifSeq++; return `NOTIF-${Date.now().toString(36)}-${notifSeq}`; }
// Builds and commits one or more notifications in a single op. `recipientIds`
// may contain duplicates/blanks/the creator's own id — all filtered out here
// so every call site (submitRequest, submitIssue) can stay simple and just
// pass whatever's assigned on the job.
function notifyMembers(recipientIds, opts){
  const creatorId = opts.creatorId || null;
  const uniqueIds = Array.from(new Set((recipientIds||[]).filter(Boolean))).filter(id=>id!==creatorId);
  if(uniqueIds.length===0) return;
  const now = new Date().toISOString();
  const entries = uniqueIds.map(recipientMemberId => ({
    id: nextNotifId(), recipientMemberId, type: opts.type, message: opts.message,
    jobId: opts.jobId, refId: opts.refId || null, read: false, createdDate: now
  }));
  commit({type:'addNotifications', entries});
}
function myNotifications(){
  const me = getCurrentTeamMember();
  if(!me) return [];
  return state.notifications.filter(n=>n.recipientMemberId===me.id).slice().sort((a,b)=>(b.createdDate||'').localeCompare(a.createdDate||''));
}
function unreadNotifCount(){ return myNotifications().filter(n=>!n.read).length; }
function updateNotificationsControl(){
  const wrap = document.getElementById('notif-wrap');
  const me = getCurrentTeamMember();
  if(wrap) wrap.hidden = !me;
  const badge = document.getElementById('notif-badge');
  if(badge){
    const n = unreadNotifCount();
    badge.hidden = n===0;
    badge.textContent = n>99 ? '99+' : String(n);
  }
  const dd = document.getElementById('notif-dropdown');
  if(dd && !dd.hidden) renderNotificationsDropdownContent();
}
function toggleNotificationsDropdown(){
  const dd = document.getElementById('notif-dropdown');
  if(!dd) return;
  if(dd.hidden) openNotificationsDropdown(); else closeNotificationsDropdown();
}
function openNotificationsDropdown(){
  const dd = document.getElementById('notif-dropdown');
  if(!dd) return;
  dd.hidden = false;
  renderNotificationsDropdownContent();
  if(!document.getElementById('notif-dropdown-backdrop')){
    const backdrop = document.createElement('div');
    backdrop.id = 'notif-dropdown-backdrop';
    backdrop.className = 'team-dropdown-backdrop';
    backdrop.onclick = closeNotificationsDropdown;
    document.body.appendChild(backdrop);
  }
  document.addEventListener('keydown', notifDropdownEscHandler);
}
function closeNotificationsDropdown(){
  const dd = document.getElementById('notif-dropdown');
  if(dd) dd.hidden = true;
  const backdrop = document.getElementById('notif-dropdown-backdrop');
  if(backdrop) backdrop.remove();
  document.removeEventListener('keydown', notifDropdownEscHandler);
}
function notifDropdownEscHandler(e){ if(e.key==='Escape') closeNotificationsDropdown(); }
function notifTimeAgo(iso){
  if(!iso) return '';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins/60);
  if(hrs < 24) return `${hrs}h ago`;
  const days = Math.round(hrs/24);
  return `${days}d ago`;
}
function renderNotificationsDropdownContent(){
  const dd = document.getElementById('notif-dropdown');
  if(!dd) return;
  const items = myNotifications();
  const rows = items.map(n=>{
    const job = getJob(n.jobId);
    return `<div class="notif-item ${n.read?'':'unread'}" onclick="openNotification('${n.id}')">
      <div class="n-msg">${esc(n.message)}</div>
      <div class="n-meta">${job?esc(job.id):''}${job&&job.name?' — '+esc(job.name):''} · ${notifTimeAgo(n.createdDate)}</div>
    </div>`;
  }).join('');
  dd.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <div style="font-weight:800; font-size:13.5px;">Notifications</div>
      ${items.some(n=>!n.read) ? `<button class="btn sm secondary" onclick="markAllNotificationsRead()">Mark all read</button>` : ''}
    </div>
    ${pushSupported ? `<button class="btn sm secondary" style="width:100%; margin-bottom:8px;" id="push-toggle-btn" onclick="togglePushSubscription()">${pushSubscribed ? 'Turn off phone alerts for this device' : 'Get phone alerts on this device'}</button>` : ''}
    ${items.length===0 ? `<div class="issue-meta" style="padding:8px 2px;">Nothing yet.</div>` : rows}`;
}
function openNotification(notifId){
  const n = state.notifications.find(x=>x.id===notifId);
  if(!n) return;
  if(!n.read) commit({type:'markNotificationRead', id: notifId});
  closeNotificationsDropdown();
  const tab = n.type==='costImpact' ? 'costs' : 'requests';
  if(tab==='costs') ui.costSubTab = 'impacts';
  openJob(n.jobId, tab);
}
function markAllNotificationsRead(){
  const me = getCurrentTeamMember();
  if(!me) return;
  commit({type:'markAllNotificationsRead', recipientMemberId: me.id});
}

/* ===================== PUSH NOTIFICATIONS (client) =====================
   A real phone/tablet alert for a new notification (see NOTIFICATIONS/
   Feature O above) even with Nucleus closed — no paid SMS/email service,
   just the browser's own Push API talking to this server (see
   server/webpush.js — or lib/webpush.js on the Vercel build — for how the
   send itself works) via a service worker (sw.js's 'push'/'notificationclick'
   handlers). Per-device, not per-person: each device someone signs into
   subscribes (or not) on its own, same as a phone's own notification
   settings — turning it on/off on one tablet has no effect on their laptop.
   pushApiFetch falls back to plain fetch() when authFetch doesn't exist —
   harmless in a context with no real backend for these endpoints (they'll
   just 404 and pushSupported stays false), which is exactly what keeps this
   code safe to be identical everywhere Nucleus runs, including anywhere
   without a matching server. */
let pushSupported = false; // true only once a real backend confirms it has a VAPID key configured
let pushSubscribed = false;
let pushVapidPublicKey = null;
function pushApiFetch(url, opts){
  return (typeof authFetch === 'function') ? authFetch(url, opts) : fetch(url, opts);
}
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const out = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
  return out;
}
async function initPushSupport(){
  pushSupported = false;
  pushSubscribed = false;
  if(!('serviceWorker' in navigator) || !('PushManager' in window) || typeof Notification === 'undefined'){
    updateNotificationsControl();
    return;
  }
  try{
    const res = await pushApiFetch('/api/push/vapid-public-key', {cache:'no-store'});
    if(!res.ok) { updateNotificationsControl(); return; }
    const data = await res.json();
    if(!data || !data.publicKey){ updateNotificationsControl(); return; }
    pushVapidPublicKey = data.publicKey;
    pushSupported = true;
    const reg = await navigator.serviceWorker.register('/sw.js').catch(()=>null);
    if(reg){
      const existing = await reg.pushManager.getSubscription().catch(()=>null);
      pushSubscribed = !!existing;
    }
  }catch(e){ pushSupported = false; }
  updateNotificationsControl();
}
async function togglePushSubscription(){
  const btn = document.getElementById('push-toggle-btn');
  if(btn) btn.disabled = true;
  try{
    const reg = await navigator.serviceWorker.getRegistration('/sw.js') || await navigator.serviceWorker.register('/sw.js');
    if(pushSubscribed){
      const sub = await reg.pushManager.getSubscription();
      if(sub){
        try{ await pushApiFetch('/api/push/unsubscribe', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({endpoint: sub.endpoint})}); }catch(e){}
        await sub.unsubscribe();
      }
      pushSubscribed = false;
    } else {
      const permission = await Notification.requestPermission();
      if(permission !== 'granted'){
        alert('Notifications are blocked for this site — allow them in your browser or device settings, then try again.');
      } else {
        const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(pushVapidPublicKey) });
        await pushApiFetch('/api/push/subscribe', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({subscription: sub.toJSON(), userAgent: navigator.userAgent})});
        pushSubscribed = true;
      }
    }
  }catch(e){
    alert("Couldn't update push notifications for this device — try again in a moment.");
  }
  if(btn) btn.disabled = false;
  updateNotificationsControl();
}
// Tapping a push notification (see sw.js's 'notificationclick') focuses this
// tab if it's already open and posts here what to navigate to — the exact
// same navigation openNotification() already does for the in-app bell.
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', (event) => {
    const msg = event.data;
    if(!msg || msg.type !== 'nucleus-notification-click' || !msg.jobId) return;
    const tab = msg.notifType==='costImpact' ? 'costs' : 'requests';
    if(tab==='costs') ui.costSubTab = 'impacts';
    openJob(msg.jobId, tab);
  });
}
// Falls back to a plain URL when the service worker had to open a brand-new
// tab instead of focusing an existing one (see sw.js) — same navigation,
// just triggered from the query string this loads with instead of postMessage.
function handleOpenJobFromUrl(){
  try{
    const params = new URLSearchParams(location.search);
    const jobId = params.get('openJob');
    if(!jobId) return;
    const notifType = params.get('openJobType');
    const tab = notifType==='costImpact' ? 'costs' : 'requests';
    if(tab==='costs') ui.costSubTab = 'impacts';
    openJob(jobId, tab);
    history.replaceState(null, '', location.pathname);
  }catch(e){}
}

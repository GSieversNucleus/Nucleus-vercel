/* ---- Home: combined calendar across all jobs ---- */
function renderHomeCalendar(){
  // Operations Manager and Superintendent each get exactly one calendar on
  // their home screen now — their own consolidated all-jobs/single-job
  // calendar (renderRoleCalendarSection) — instead of this generic combined
  // one stacked on top of it. Engineering Manager's home screen is a
  // decluttered engineering-only page with its own engineering-dates-only
  // calendar instead (renderEngineeringCalendarSection) — this generic one
  // isn't engineering-relevant. Every other role is unchanged.
  const me = getEffectiveTeamMember();
  if(me && ['Operations Manager','Superintendent','Engineering Manager'].includes(me.role)) return '';
  if(state.schedule.length===0 && state.procurement.length===0 && state.requests.length===0) return '';
  const month = ui.homeMonth || currentMonthStr();
  const cells = buildMonthDays(month);
  const today = todayStr();
  const dayHeaders = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dowhead">${d}</div>`).join('');
  const cellsHtml = cells.map(dateStr=>{
    if(!dateStr) return `<div class="cal-cell empty-cell"></div>`;
    const dayTasks = state.schedule.filter(t=> isJobVisible(t.jobId) && t.status!=='Complete' && t.currentStart && dateStr >= t.currentStart && dateStr <= addDaysStr(t.currentStart, Math.max(1,t.duration||1)-1));
    const dayProc = state.procurement.filter(p=> isJobVisible(p.jobId) && p.status!=='Delivered' && p.neededBy===dateStr);
    const dayReq = state.requests.filter(r=> isJobVisible(r.jobId) && r.status!=='Closed' && r.dueDate===dateStr);
    const dnum = Number(dateStr.slice(8,10));
    const taskChips = dayTasks.map(t=>{
      const job = getJob(t.jobId);
      const label = `${job?job.id+': ':''}${t.name}${dateStr===t.currentStart?' (start)':''}`;
      return `<div class="cal-chip click-only status-${(t.status||'').replace(/\s+/g,'-').toLowerCase()}" style="border-left:4px solid ${jobColor(t.jobId)};" onclick="openJob('${t.jobId}','schedule')" title="${esc(label)}">${esc(label)}</div>`;
    }).join('');
    const procChips = dayProc.map(p=>{
      const job = getJob(p.jobId);
      const label = `${job?job.id+': ':''}${p.item}`;
      return `<div class="cal-chip click-only proc-chip" style="border-left:4px solid ${jobColor(p.jobId)};" onclick="openJob('${p.jobId}','procurement')" title="${esc(label)}">${icon('truck')}${esc(label)}</div>`;
    }).join('');
    const reqChips = dayReq.map(r=>{
      const job = getJob(r.jobId);
      const label = `${job?job.id+': ':''}${r.title}`;
      return `<div class="cal-chip click-only req-chip" style="border-left:4px solid ${jobColor(r.jobId)};" onclick="openJob('${r.jobId}','requests')" title="${esc(label)}">${icon('helpCircle')}${esc(label)}</div>`;
    }).join('');
    return `<div class="cal-cell${dateStr===today?' cal-today':''}">
      <div class="cal-daynum">${dnum}</div>
      ${taskChips}${procChips}${reqChips}
    </div>`;
  }).join('');
  return `
    <div class="panel-head" style="margin-top:28px;"><h3>Combined calendar — start dates, material dates &amp; requests, all jobs</h3>
      <div style="display:flex; gap:8px;">
        <button class="btn sm secondary" onclick="shiftHomeMonth(-1)">${icon('arrowLeft')}</button>
        <span style="align-self:center; font-family:var(--mono); font-size:12.5px; min-width:110px; text-align:center;">${monthLabel(month)}</span>
        <button class="btn sm secondary" onclick="shiftHomeMonth(1)">${icon('arrowRight')}</button>
      </div>
    </div>
    <div class="issue-meta" style="margin-bottom:6px;">Every job's calendar, merged into one. Each chip is striped in its job's color; tap a chip to jump straight to that job.</div>
    <div class="cal-grid">${dayHeaders}${cellsHtml}</div>
    ${renderCalendarLegend(visibleJobs().slice().sort((a,b)=>a.id.localeCompare(b.id)), {showRequest:true})}`;
}
function shiftHomeMonth(delta){
  const month = ui.homeMonth || currentMonthStr();
  const [y,m] = month.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  ui.homeMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}

/* ---- Home: PM briefing (auto-organized, not a live chat) ---- */
function renderBriefing(){
  // Superintendent: not PM-relevant, and their home screen has its own
  // consolidated calendar instead (see renderSuperintendentScheduleSection).
  // Engineering Manager: their home screen is a decluttered engineering-only
  // quick-access page (see renderHome's Engineering Manager section below) —
  // the PM briefing isn't engineering-relevant either. Operations Manager:
  // "the contract and cost person," not a PM-briefing audience — their home
  // screen gets renderOpsContractCostOverview() instead (see renderLookAhead's
  // matching gate and renderHome's call site).
  const me = getEffectiveTeamMember();
  if(me && (me.role==='Superintendent' || me.role==='Engineering Manager' || me.role==='Operations Manager')) return '';
  if(visibleJobs().length===0) return '';
  const today = todayStr();
  const lookAheadItems = collectLookAhead();
  const dueSoon = lookAheadItems.filter(it=> it.date && daysBetweenStr(today, it.date)>=0 && daysBetweenStr(today, it.date)<=7);
  const overdue = lookAheadItems.filter(it=> it.date && daysBetweenStr(today, it.date)<0);
  const pendingIssues = state.issues.filter(i=>i.status==='Pending Review' && isJobVisible(i.jobId));
  const behindElevations = state.elevations.filter(el=> isJobVisible(el.jobId) && (el.items||[]).length>0 && elevationPct(el)<50);

  const remindersHtml = dueSoon.length ? dueSoon.slice(0,12).map(it=>{
    const job = getJob(it.jobId);
    const days = daysBetweenStr(today, it.date);
    const when = days===0?'today':(days===1?'tomorrow':`in ${days}d`);
    return `<div class="brief-line">${icon('clock')}<span><b>${job?job.id:it.jobId}</b> — ${esc(it.label)} <span class="issue-meta">(${it.type}, due ${when})</span></span></div>`;
  }).join('') : `<div class="issue-meta">Nothing due in the next 7 days.</div>`;

  const attentionParts = [];
  overdue.slice(0,8).forEach(it=>{
    const job = getJob(it.jobId);
    attentionParts.push(`<div class="brief-line">${icon('helpCircle')}<span><b>${job?job.id:it.jobId}</b> — ${esc(it.label)} <span class="issue-meta">(${it.type}, overdue)</span></span></div>`);
  });
  if(pendingIssues.length){
    const byJob = {};
    pendingIssues.forEach(i=>{ byJob[i.jobId] = (byJob[i.jobId]||0) + 1; });
    Object.keys(byJob).forEach(jid=>{
      const job = getJob(jid);
      attentionParts.push(`<div class="brief-line">${icon('camera')}<span><b>${job?job.id:jid}</b> — ${byJob[jid]} cost impact${byJob[jid]>1?'s':''} awaiting pricing</span></div>`);
    });
  }
  behindElevations.forEach(el=>{
    const job = getJob(el.jobId);
    attentionParts.push(`<div class="brief-line">${icon('buildingSkyscraper')}<span><b>${job?job.id:el.jobId}</b> — ${esc(el.name)} is only ${elevationPct(el)}% complete</span></div>`);
  });
  const attentionHtml = attentionParts.length ? attentionParts.slice(0,12).join('') : `<div class="issue-meta">Nothing flagged right now.</div>`;

  const digestHtml = visibleJobs().map(job=>{
    const jNotes = state.notes.filter(n=>n.jobId===job.id).map(n=>({kind:'Note', when:n.date, text:n.text}));
    const combined = jNotes.slice().sort((a,b)=>(b.when||'').localeCompare(a.when||'')).slice(0,5);
    if(!combined.length) return '';
    const bullets = combined.map(x=>`<li>${esc((x.text||'').slice(0,140))} <span class="issue-meta">— ${x.kind}${x.when?', '+x.when:''}</span></li>`).join('');
    return `<div style="margin-bottom:12px;"><div class="section-title" style="margin:0 0 4px;">${job.id} — ${esc(job.name)}</div><ul class="brief-list">${bullets}</ul></div>`;
  }).join('');

  return `
    <div class="panel-head" style="margin-top:28px;"><h3>${icon('sparkle')} PM briefing</h3></div>
    <div class="issue-meta" style="margin:-6px 0 14px;">Auto-organized from what's already in the app — reminders, flags, and the latest notes per job. This updates automatically as data comes in; it isn't a live chat.</div>
    <div class="brief-grid">
      <div class="brief-card"><div class="section-title" style="margin-top:0;">Reminders — due within 7 days</div>${remindersHtml}</div>
      <div class="brief-card"><div class="section-title" style="margin-top:0;">Needs attention</div>${attentionHtml}</div>
    </div>
    ${digestHtml ? `<div class="section-title" style="margin-top:18px;">Notes — by job</div>${digestHtml}` : ''}`;
}

/* ---- Specifications & submittals ---- */
/* Standard submittal checklist: the typical set of submittal categories a
   glazing/curtain-wall spec section calls for. "Generate checklist" on a spec
   adds one Draft submittal per item below (skipping any whose description
   already exists for that spec, so it's safe to click again after deleting
   or renaming a few) instead of the PM re-typing each one by hand. */
const SUBMITTAL_CHECKLIST_ITEMS = [
  'Shop Drawings',
  'Product Data',
  'Samples',
  'Mock-Up',
  'Structural / Engineering Calculations',
  'Test Reports',
  'Warranty',
  'Closeout / O&M Manual'
];
/* C/S Erectors' standard transmittal form fields (from the company's actual
   transmittal template) — reused for both the "Add submittal" form and the
   submittal detail view, so a submittal *is* a fillable transmittal. */
const SUBMITTAL_SEND_OPTIONS = ['Attached', 'Under separate cover'];
const SUBMITTAL_VIA_OPTIONS = ['CAL OVERNIGHT', 'FED EX', 'UPS', 'MAIL', 'HAND DELIVER'];
const SUBMITTAL_ITEM_TYPES = ['Brochures', 'Prints', 'Shop Dwgs', 'Plans', 'Specs', 'Samples', 'Contract', 'Change Order', 'Letter/Copy', 'Maintenance and inspection procedures'];
/* 3-column "Transmitted as checked below" grid, in the same layout as the paper form (blank = no option in that cell). */
const SUBMITTAL_PURPOSE_GRID = [
  ['For your use', 'Approved as submitted', 'Resubmit copies for approval'],
  ['For approval', 'Returned for corrections', 'Submit copies for distribution'],
  ['As requested', 'For your review/comment', 'Prints returned after loan to us'],
  ['For bids due on', '', 'Return 1 sample approved or corrected']
];
/* Submittal IDs are organized as Job Code-Spec-Submittal #, matching the
   transmittal form's own title line "(Job Name) – (Spec)- (Submittal #)".
   Feature L: the Submittal # portion used to reset to 001 for each spec
   section, so two different specs on the same job both showed "-001" —
   which reads as a duplicate even though the full ID differs by spec
   section (Greg's "no duplicate numbers" complaint). It's now a single
   continuous counter per JOB — see nextSubmittalNumber below — so the
   very first submittal added anywhere on a job (any spec) gets 001, the
   next one added anywhere gets 002, and so on; numbers never repeat
   within a job no matter how many specs it has. */
function specSectionLabel(specId){
  const spec = state.specs.find(sp=>sp.id===specId);
  return (spec && spec.section && spec.section.trim()) ? spec.section.trim() : 'SPEC';
}
// Max existing submittal number anywhere on this job (across every spec),
// regardless of which spec section it's filed under — the ID's trailing
// digit run, e.g. "...-08 44 13-007" -> 7. +1 gives the next number.
function nextSubmittalNumber(jobId){
  let max = 0;
  state.submittals.filter(x=>x.jobId===jobId).forEach(x=>{
    const m = /-(\d+)$/.exec(x.id||'');
    if(m){ const v = parseInt(m[1],10); if(!isNaN(v) && v>max) max = v; }
  });
  return max + 1;
}
function nextSubmittalId(jobId, specId){
  const n = nextSubmittalNumber(jobId);
  return `${jobId}-${specSectionLabel(specId)}-${String(n).padStart(3,'0')}`;
}
// Shared by generateSubmittalChecklist (fixed generic list) and
// scanSpecForSubmittals (list read off the spec's own uploaded PDF) — both just
// need to turn a plain list of description strings into full submittal-log
// entries and bulk-commit them. De-dupes against what's already logged for this
// spec (case-insensitive, trimmed) so re-running either one is harmless, and
// draws from the same continuous per-job submittal-number counter as a single
// manually-added submittal (Feature L) — see nextSubmittalNumber. Returns the
// count actually added (0 if everything was already logged, or the list was
// empty) so callers can tell the user what happened.
function addSubmittalItemsToSpec(specId, items){
  const spec = state.specs.find(sp=>sp.id===specId);
  const secLabel = specSectionLabel(specId);
  const existing = new Set(state.submittals.filter(su=>su.specId===specId).map(su=>(su.description||'').trim().toLowerCase()));
  const toAdd = (items||[]).map(s=>(s||'').trim()).filter(Boolean).filter(item=>!existing.has(item.toLowerCase()));
  if(toAdd.length===0) return 0;
  const baseN = nextSubmittalNumber(ui.jobId) - 1;
  const job = getJob(ui.jobId);
  const entries = toAdd.map((item,i)=>({
    id: `${ui.jobId}-${secLabel}-${String(baseN+i+1).padStart(3,'0')}`, jobId: ui.jobId, specId,
    description: item, dateSubmitted: '', status: 'Draft', attachments: [],
    to: job ? (job.gc||'') : '', jobNo: ui.jobId, re: `${secLabel}${spec&&spec.title?' — '+spec.title:''}`, attn: '',
    sendMethod: [], viaMethod: [], itemTypes: [], lineItems: [{copies:'', date:'', no:'', description:item}],
    transmittedPurpose: [], bidsDueOn: '', remarks: '', sentBy: currentUserName || ''
  }));
  commit({type:'addSubmittalsBulk', entries});
  return toAdd.length;
}
function generateSubmittalChecklist(specId){
  const added = addSubmittalItemsToSpec(specId, SUBMITTAL_CHECKLIST_ITEMS);
  if(added===0) alert('All standard checklist items are already logged for this spec.');
}
/* ---- "Scan for submittals" (best-effort): reads the text of the spec's own
   uploaded PDF (see the spec-doc upload added to the spec form, and
   isPdfAttachment) with pdf.js and looks for a CSI-style "SUBMITTALS"
   subsection under Part 1 — General (e.g. "1.3 SUBMITTALS"), then pulls out
   its lettered/numbered list items ("A. Product Data...", "1. Shop
   drawings...") as draft submittal-log entries via addSubmittalItemsToSpec
   above — the same entry shape "Generate checklist" produces, just sourced
   from this spec's actual text instead of a fixed generic list. Greg asked
   for the app to read the uploaded spec directly rather than have him type a
   list by hand; this is that, with the tradeoff spelled out to him up front:
   spec formatting varies enough that this is a best-effort scan, not a
   guarantee, so everything it adds lands as Draft status exactly like the
   generic checklist does — reviewed, edited, or deleted like anything else
   before it means anything. Never throws: pdf.js failing to load (no
   internet, blocked CDN), the PDF having no machine-readable text (a flat
   scanned image), or no SUBMITTALS heading being found are all reported to
   the user with a plain alert() explaining what to do instead (add
   submittals manually), not a silent no-op or a broken page. */
async function extractPdfText(dataUrl){
  const resp = await fetch(dataUrl);
  const buf = await resp.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let text = '';
  for(let i=1; i<=pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    // pdf.js gives text as separate positioned fragments per line, not
    // paragraphs — join same-line fragments with a space and different lines
    // with a newline (heuristic: a text item ending a line has its own y
    // position; simplest reliable signal is just "join everything on this
    // page with newlines between getTextContent's own item boundaries" since
    // CSI spec text is already broken into short lines/list items, which is
    // exactly the granularity the regexes below expect).
    text += content.items.map(it=>it.str).join('\n') + '\n';
  }
  return text;
}
// Finds the first Part-1 subsection whose heading contains "SUBMITTAL" (matches
// "1.3 SUBMITTALS", "1.4 SUBMITTALS AND SAMPLES", etc.), then everything up to
// the next Part-1-style heading ("1.5 ...") or a "PART 2" line, whichever comes
// first. Returns '' if no such heading is found — callers treat that as "this
// PDF doesn't have a section this scan can recognize."
function extractSubmittalsSection(text){
  const headingRe = /^\s*\d+\.\d+\s+.*SUBMITTAL.*$/im;
  const start = headingRe.exec(text);
  if(!start) return '';
  const afterStart = text.slice(start.index + start[0].length);
  const nextHeadingRe = /^\s*(\d+\.\d+\s+[A-Z]|PART\s+2\b)/im;
  const next = nextHeadingRe.exec(afterStart);
  return next ? afterStart.slice(0, next.index) : afterStart;
}
// Pulls "A. ...", "B. ...", "1. ...", "1.3.1 ..." style list-item lines out of
// a section of spec text. Each match's captured text runs to the end of its
// line only (a real submittal item in a spec is usually one line or wraps
// without re-indenting far enough to matter for a first pass) — good enough
// to seed a draft list Greg reviews, not meant to reproduce the spec verbatim.
function extractListItems(sectionText){
  const itemRe = /^\s*(?:[A-Z]|\d+(?:\.\d+)*)[.)]\s+(.+)$/gm;
  const items = [];
  let m;
  while((m = itemRe.exec(sectionText))){
    const line = m[1].trim();
    // Skip bare cross-references and stray short fragments ("See Section
    // 08 44 13" or a lone page number) that aren't really submittal items.
    if(line.length >= 8 && !/^(see|refer to)\b/i.test(line)) items.push(line);
  }
  return items;
}
async function scanSpecForSubmittals(specId){
  const spec = state.specs.find(sp=>sp.id===specId);
  if(!spec) return;
  const pdfAtt = (spec.attachments||[]).find(a=>isPdfAttachment(a));
  if(!pdfAtt){ alert('Upload the spec PDF first (Add specification, or re-add it below), then Scan for submittals can read it.'); return; }
  if(typeof pdfjsLib==='undefined'){ alert("Couldn't scan the PDF right now (this needs an internet connection to load the PDF reader) — add submittals manually below, or try again once you're back online."); return; }
  let text;
  try{
    text = await extractPdfText(pdfAtt.dataUrl);
  }catch(e){
    console.error('spec PDF scan failed', e);
    alert("Couldn't read that PDF (it may be a scanned image with no selectable text) — add submittals manually below.");
    return;
  }
  const section = extractSubmittalsSection(text);
  if(!section){
    alert("Couldn't find a Submittals section in this PDF (looked for something like \"1.3 SUBMITTALS\") — add submittals manually below.");
    return;
  }
  const items = extractListItems(section);
  if(items.length===0){
    alert('Found a Submittals section, but no list items in it that this scan recognized — add submittals manually below.');
    return;
  }
  const added = addSubmittalItemsToSpec(specId, items);
  if(added===0) alert(`Found ${items.length} item${items.length>1?'s':''} in the spec's Submittals section, but all of them are already logged for this spec.`);
  else alert(`Found ${items.length} item${items.length>1?'s':''} in the spec's Submittals section — added ${added} new one${added>1?'s':''} as drafts below. Review, edit, or delete before sending.`);
}

// Builds a tel: link href from however someone typed a phone number in (with
// dashes, spaces, parens, an extension, etc.) — tel: links work fine with a
// leading + and digits only, so everything else gets stripped rather than
// risk a link that silently fails to dial. The number is still DISPLAYED
// exactly as typed (see renderContacts below); this only affects the href.
function telHref(phone){
  const digits = String(phone||'').replace(/[^\d+]/g,'');
  return 'tel:' + digits;
}

/* ---- Feature C: Hours by Elevation ----
   Elevation-level projectedHours/actualHours (entered on the Elevations tab
   detail modal — Foreman-editable there, since Elevations is Foreman-visible
   and Hours isn't) rolled up here as a job-health view. Reuses hoursGauge/
   hoursPctClass verbatim — the exact same green ok / amber warn (>=90% of
   projected) / red over (>100% of projected) thresholds the Field/Shop
   bid-vs-actual gauges above already use, so "on track" reads the same way
   everywhere on this tab instead of introducing new arbitrary cutoffs. */
function renderHoursByElevation(elevations){
  const tracked = elevations.filter(el=>el.projectedHours!=null || el.actualHours!=null);
  const totalProjected = elevations.reduce((s,el)=>s+(Number(el.projectedHours)||0),0);
  const totalActual = elevations.reduce((s,el)=>s+(Number(el.actualHours)||0),0);
  const variance = totalActual - totalProjected;
  const varianceCls = totalProjected ? hoursPctClass(totalActual, totalProjected) : '';
  const rows = elevations.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'', undefined, {numeric:true})).map(el=>{
    const proj = el.projectedHours, act = el.actualHours;
    const rowVariance = (proj!=null && act!=null) ? (act-proj) : null;
    const cls = (proj!=null && act!=null) ? hoursPctClass(act, proj) : '';
    return `
    <tr>
      <td data-label="Elevation" class="idcell">${esc(el.name||el.id)}</td>
      <td data-label="Projected hrs">${proj!=null?proj.toLocaleString():'—'}</td>
      <td data-label="Actual hrs">${act!=null?act.toLocaleString():'—'}</td>
      <td data-label="Variance">${rowVariance!=null?`<span class="hrs-pct ${cls}">${rowVariance>0?'+':''}${rowVariance.toLocaleString()}h</span>`:'—'}</td>
    </tr>`;
  }).join('');
  return `
    <div class="panel-head" style="margin-top:28px;"><h3>Hours by Elevation</h3></div>
    ${elevations.length===0 ? emptyBlock('buildingSkyscraper','No elevations on this job yet — add one on the Elevations tab.') : (tracked.length===0 ? emptyBlock('clock','No projected/actual hours entered yet — enter them on the Elevations tab (open an elevation, then Details).') : `
    <div class="hrs-summary" style="margin-bottom:14px;">
      ${hoursGauge('All elevations', totalActual, totalProjected)}
    </div>
    <div class="co-summary" style="margin-bottom:14px;"><div class="row total"><span>Tracking</span><span class="hrs-pct ${varianceCls}">${variance===0?'On track — 0h variance':(variance>0?Math.abs(variance).toLocaleString()+'h over projected':Math.abs(variance).toLocaleString()+'h under projected')}</span></div></div>
    <table><thead><tr><th>Elevation</th><th>Projected hrs</th><th>Actual hrs</th><th>Variance</th></tr></thead>
    <tbody>${rows}</tbody></table>`)}`;
}

function setCoView(v){ ui.coView = v; render(); }
function coLogAmountCols(c){
  // Maps the CO's single live cost + status onto the GC-style QUOTED / PENDING / APPROVED columns.
  const amt = c.cost!=null ? Number(c.cost) : null;
  const cols = { quoted:null, pending:null, approved:null };
  if(amt==null) return cols;
  if(c.status==='Draft' || c.status==='Submitted') cols.quoted = amt;
  else if(c.status==='Pending') cols.pending = amt;
  else if(c.status==='Approved' || c.status==='SCO' || c.status==='Closed') cols.approved = amt;
  else if(c.status==='Rejected') cols.quoted = amt; // last known ask, shown struck-through via Status column
  return cols;
}

/* ---- Costs (parent tab: cost impacts / invoices / change orders) ---- */
function renderCosts(job, issues, invoices, cos, isForeman){
  // A Foreman only ever gets the Cost Impacts sub-tab, with dollar amounts
  // stripped out (see renderIssues) — Invoices and Change orders stay fully
  // hidden, same as the rest of Costs was before "costs" was added to
  // FOREMAN_ALLOWED_TABS. Change orders was already Foreman-hidden as its
  // own top-level tab (Feature E just moved it in here) — this branch is
  // exactly what keeps it hidden now that it lives inside a tab a Foreman
  // can otherwise partially see.
  if(isForeman){
    if(ui.costSubTab && ui.costSubTab!=='impacts') ui.costSubTab = 'impacts';
    return renderIssues(job, issues, true);
  }
  const sub = ui.costSubTab || 'impacts';
  const subtabs = `
    <div class="subtabs">
      <div class="subtab ${sub==='impacts'?'active':''}" onclick="setCostSubTab('impacts')">Cost Impacts</div>
      <div class="subtab ${sub==='invoices'?'active':''}" onclick="setCostSubTab('invoices')">Invoices</div>
      <div class="subtab ${sub==='changeorders'?'active':''}" onclick="setCostSubTab('changeorders')">Change orders</div>
    </div>`;
  let body = '';
  if(sub==='impacts') body = renderIssues(job, issues, false);
  if(sub==='invoices') body = renderInvoices(job, invoices);
  if(sub==='changeorders') body = renderCos(job, cos);
  return subtabs + body;
}
function setCostSubTab(t){ ui.costSubTab = t; render(); }

/* ---- Invoices ---- */
function renderInvoices(job, invoices){
  const codes = Array.from(new Set(invoices.map(i=>i.costCode).filter(Boolean))).sort();
  const totalAll = invoices.reduce((s,i)=>s+Number(i.amount||0),0);
  const totalApproved = invoices.filter(i=>i.status==='Approved'||i.status==='Paid').reduce((s,i)=>s+Number(i.amount||0),0);
  const codeRows = codes.map(code=>{
    const list = invoices.filter(i=>i.costCode===code);
    const total = list.reduce((s,i)=>s+Number(i.amount||0),0);
    return `<tr><td data-label="Cost code" class="idcell">${esc(code)}</td><td data-label="Description">${esc(costCodeLabel(code)||'—')}</td><td data-label="Invoices">${list.length}</td><td data-label="Total">${fmtMoney(total)}</td></tr>`;
  }).join('');
  const rows = invoices.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(inv=>`
    <tr onclick="openInvoiceDetail('${inv.id}')" style="cursor:pointer;">
      <td data-label="Date">${inv.date||'—'}</td>
      <td data-label="Cost code" class="idcell">${esc(inv.costCode||'—')}</td>
      <td data-label="Vendor">${esc(inv.vendor||'—')}</td>
      <td data-label="Invoice #">${esc(inv.invoiceNumber||'—')}${inv.attachments&&inv.attachments.length?`<div class="issue-meta">${icon('paperclip')} attached</div>`:''}</td>
      <td data-label="Amount">${fmtMoney(inv.amount)}</td>
      <td data-label="Status">${badge(inv.status)}</td>
    </tr>`).join('');
  return `
    <div class="panel-head"><h3>Invoice log</h3><button class="btn sm safety" ${disabledAttr()} onclick="openModal('invoice')">${icon('plus')} Add invoice</button></div>
    <div class="co-summary" style="margin-bottom:16px;">

      <div class="row total"><span>Approved / paid</span><span>${fmtMoney(totalApproved)}</span></div>

   Operations Manager / Project Manager visibility (CONTRACT_TAB_ALLOWED_ROLES)
   on both halves. "Budget and Costs" gets everything that's actually about
   tracking dollars — Green Sheet documents, the budget-by-system/scope

// Rundown table for whatever Green Sheet workbooks parsed successfully (see
// parseGreenSheetWorkbook above) — a PDF or an unparseable workbook still
// shows up here with its parseError so it's clear why it's not contributing
// numbers, rather than silently vanishing from the list. Purely derived from
// job.contractDocs each render; nothing here is separately stored in state.
function renderGreenSheetRundown(job){
  const docs = (job.contractDocs||[]).filter(d=>d.docType==='Green Sheet');
  if(docs.length===0) return '';
  const parsed = docs.filter(d=>d.parseError==null && (d.systemNo || d.systemName || d.materialTotal!=null || d.shopHours!=null || d.fieldHours!=null));
  const totalMaterial = parsed.reduce((s,d)=>s+(Number(d.materialTotal)||0),0);
  const totalShop = parsed.reduce((s,d)=>s+(Number(d.shopHours)||0),0);
  const totalField = parsed.reduce((s,d)=>s+(Number(d.fieldHours)||0),0);
  const rows = docs.map(d=>{
    if(d.parseError){
      return `<tr><td data-label="System #">—</td><td data-label="System">${esc(d.name)}</td><td data-label="Material Total">—</td><td data-label="Shop Hours">—</td><td data-label="Field Hours">—</td><td data-label="Note" colspan="1" style="color:var(--text-muted); font-size:12px;">${esc(d.parseError)}</td></tr>`;
    }
    if(d.systemNo==null && d.systemName==null && d.materialTotal==null){
      // A PDF or other non-workbook Green Sheet upload — not an error, just
      // nothing this rundown can read cells out of.
      return `<tr><td data-label="System #">—</td><td data-label="System">${esc(d.name)}</td><td data-label="Material Total">—</td><td data-label="Shop Hours">—</td><td data-label="Field Hours">—</td><td style="color:var(--text-muted); font-size:12px;">PDF — upload the workbook (.xlsx) version to include it here</td></tr>`;
    }
    return `<tr>
      <td data-label="System #" class="idcell">${esc(d.systemNo||'—')}</td>
      <td data-label="System">${esc(d.systemName||'—')}</td>
      <td data-label="Material Total">${d.materialTotal!=null?fmtMoney(d.materialTotal):'—'}</td>
      <td data-label="Shop Hours">${d.shopHours!=null?d.shopHours.toLocaleString():'—'}</td>
      <td data-label="Field Hours">${d.fieldHours!=null?d.fieldHours.toLocaleString():'—'}</td>
      <td></td>
    </tr>`;
  }).join('');
  return `
    <div class="section-title" style="margin-top:22px;">Green Sheet rundown</div>
    <div class="issue-meta" style="margin-bottom:10px;">Read straight off each uploaded Green Sheet workbook — System # (D1), System (E1), Material Total (G49), Shop Hours (C22), Field Hours (C60). One row per uploaded file.</div>
    <div style="overflow-x:auto;">
    <table><thead><tr><th>System #</th><th>System</th><th>Material Total</th><th>Shop Hours</th><th>Field Hours</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
    ${parsed.length>0 ? `<tfoot><tr style="font-weight:700;"><td colspan="2">Total (${parsed.length} system${parsed.length>1?'s':''})</td><td>${fmtMoney(totalMaterial)}</td><td>${totalShop.toLocaleString()}</td><td>${totalField.toLocaleString()}</td><td></td></tr></tfoot>` : ''}
    </table>
    </div>
    ${(!readOnly && parsed.length>0) ? `<button class="btn sm safety" style="margin-top:10px;" onclick="applyGreenSheetHoursToJob('${job.id}', ${totalField}, ${totalShop})">${icon('clipboardList')} Apply totals to Bid Hours</button>` : ''}`;
}
// Deliberately a confirm-gated button click, not something that runs
// automatically on every render or every upload — this overwrites the job's
// existing Bid Hours (job.bidHoursField/bidHoursShop, the baseline the Hours
// tab's gauges compare actual monthly hours against), which may already hold
// a number Greg set by hand when the job was created. Reuses the existing
// updateJobBudget reducer verbatim (see "Job settings" modal) rather than a
// new one, since it sets exactly the same two fields.
function applyGreenSheetHoursToJob(jobId, totalField, totalShop){
  const job = getJob(jobId);
  if(!job) return;
  const current = `Field: ${job.bidHoursField!=null?job.bidHoursField:'—'}h / Shop: ${job.bidHoursShop!=null?job.bidHoursShop:'—'}h`;
  if(!confirm(`Set this job's Bid Hours to Field: ${totalField.toLocaleString()}h / Shop: ${totalShop.toLocaleString()}h from the Green Sheet rundown?\n\nThis replaces the current Bid Hours (${current}).`)) return;
  commit({type:'updateJobBudget', jobId, bidHoursField: totalField, bidHoursShop: totalShop});
}

/* ---- Green Sheet rundown (Budget and Costs): reads five fixed cells out of
   each uploaded Green Sheet WORKBOOK (not PDF — a PDF's cells aren't
   machine-readable the way a real .xlsx/.xls/.xlsm's are) via SheetJS —
   System # (D1), System (E1), Material Total (G49), Shop Hours (C22), Field
   Hours (C60), per Greg directly. Every Green Sheet C/S Erectors estimates
   with is assumed to follow that same fixed layout (one workbook per system);
   this does NOT attempt to auto-detect a different layout, so a workbook that
   doesn't match reads back a parseError instead of wrong numbers. Parsing
   happens once, right here at upload time, and the five values are stored
   directly on the doc object alongside name/dataUrl — see
   renderGreenSheetRundown below, which just reads them back synchronously;
   this keeps the rest of the render path exactly as synchronous as it always
   was, rather than threading an async spreadsheet-parse through render(). */
function cellValue(ws, ref){
  const cell = ws[ref];
  if(!cell) return undefined;
  return cell.v !== undefined ? cell.v : cell.w;
}
// A formula cell's computed result is normally cached in .v by Excel itself
// (SheetJS just reads that cache, it doesn't re-evaluate formulas), so this
// is mainly a safety net for the rarer case where only the formatted display
// text (.w) is available — e.g. "$45,000.00" — by stripping everything but
// digits/minus/decimal before parsing, rather than letting Number() choke on
// the currency symbol and commas and return NaN for a cell that clearly does
// have a value.
function cellNumber(ws, ref){
  const v = cellValue(ws, ref);
  if(typeof v === 'number') return v;
  if(typeof v === 'string') return Number(v.replace(/[^0-9.\-]/g,''));
  return NaN;
}
async function parseGreenSheetWorkbook(file){
  if(typeof XLSX==='undefined'){
    return { parseError: "Couldn't read this workbook right now (needs an internet connection to load the spreadsheet reader) — the rundown will skip it until it's re-uploaded with a connection available." };
  }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    if(!ws) return { parseError: 'This workbook has no sheets — check it uploaded correctly.' };
    const systemNo = cellValue(ws,'D1');
    const systemName = cellValue(ws,'E1');
    const materialTotal = cellNumber(ws,'G49');
    const shopHours = cellNumber(ws,'C22');
    const fieldHours = cellNumber(ws,'C60');
    if(systemNo===undefined && systemName===undefined && isNaN(materialTotal) && isNaN(shopHours) && isNaN(fieldHours)){
      return { parseError: "Couldn't find any of the expected cells (D1/E1/G49/C22/C60) — check this workbook matches the standard Green Sheet layout." };
    }
    return {
      systemNo: systemNo!=null ? String(systemNo) : '',
      systemName: systemName!=null ? String(systemName) : '',
      materialTotal: isNaN(materialTotal) ? null : materialTotal,
      shopHours: isNaN(shopHours) ? null : shopHours,
      fieldHours: isNaN(fieldHours) ? null : fieldHours,
      parseError: null
    };
  }catch(e){
    console.error('Green Sheet parse failed', e);
    return { parseError: "Couldn't read this workbook — check it's a real .xlsx/.xls file and matches the standard Green Sheet layout." };
  }
}

async function handleContractDocSelect(ev, jobId, docType){

    if(stateBytes(state) + newDocs.reduce((n,a)=>n+a.dataUrl.length,0) + dataUrl.length > MAX_STATE_BYTES){

      actionArea = `
        <div class="cost-inline">

function addDaysStr(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function daysBetweenStr(a, b){
  return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000);
}
/* ---- Material ordering reminder: flags a procurement item still marked "Not
   Ordered" whose needed-by date is within a fixed buffer (or already past) —
   a single buffer for every material, not a per-item lead time, so nothing
   new has to be filled in when logging an order. See checkMaterialOrderReminder
   below for where this triggers a pop-up on opening a job. ---- */
const PROCUREMENT_ORDER_BUFFER_DAYS = 14;
function computeDelayDays(t){
  if(!t.actualStart || !t.originalStart) return 0;
  return daysBetweenStr(t.originalStart, t.actualStart);
}
function jobScheduleDelay(job, tasks){
  // Worst-case delay of the CURRENT working plan vs. the saved baseline, across all tasks
  // that exist in both. Returns null when there's no baseline (or no matching tasks) to compare.
  if(!job.scheduleBaseline || !job.scheduleBaseline.tasks || !job.scheduleBaseline.tasks.length) return null;
  let maxDelay = null;
  tasks.forEach(t=>{
    const b = job.scheduleBaseline.tasks.find(x=>x.taskId===t.id);
    if(!b || !b.start || !t.currentStart) return;
    const d = daysBetweenStr(b.start, t.currentStart);
    if(maxDelay===null || d > maxDelay) maxDelay = d;
  });
  return maxDelay;
}
function scheduleStatusBadgeHTML(delay){
  if(delay===null) return `<span class="badge draft">No baseline set</span>`;
  if(delay<=0) return `<span class="hrs-pct ok">${delay===0?'On baseline':Math.abs(delay)+'d ahead of baseline'}</span>`;
  return `<span class="hrs-pct over">${delay}d behind baseline</span>`;
}
function saveScheduleBaseline(){
  const job = getJob(ui.jobId);
  if(!job) return;
  const tasks = state.schedule.filter(t=>t.jobId===ui.jobId);
  if(!tasks.length){ alert('Add schedule tasks before saving a baseline.'); return; }
  if(job.scheduleBaseline && !confirm("This job already has a saved baseline. Overwrite it with today's schedule? Delay comparisons will start being measured against this new baseline.")) return;
  const baseline = {
    savedAt: todayStr(),
    savedBy: currentUserName || '',
    tasks: tasks.map(t=>({ taskId: t.id, name: t.name, trade: t.trade, start: t.currentStart, duration: t.duration }))
  };
  commit({type:'setScheduleBaseline', jobId: ui.jobId, baseline});
}
function renderScheduleBaseline(job, tasks){
  const bl = job.scheduleBaseline;
  const btnLabel = (bl && bl.tasks && bl.tasks.length) ? 'Re-save baseline' : 'Save current schedule as baseline';
  const meta = (bl && bl.tasks && bl.tasks.length) ? `<div class="issue-meta" style="margin-bottom:8px;">Saved ${bl.savedAt}${bl.savedBy?' by '+esc(bl.savedBy):''} — ${bl.tasks.length} task${bl.tasks.length===1?'':'s'} locked in as the original plan.</div>` : '';
  let body;
  if(!bl || !bl.tasks || !bl.tasks.length){
    body = emptyBlock('clock','No baseline saved yet — once the initial schedule is set, save it here to start tracking delays against it.');
  } else {
    const rows = bl.tasks.slice().sort((a,b)=>(a.start||'').localeCompare(b.start||'')).map(bt=>{
      const finish = bt.start ? addDaysStr(bt.start, Math.max(1,bt.duration||1)-1) : '—';
      const live = tasks.find(t=>t.id===bt.taskId);
      const delta = (live && live.currentStart && bt.start) ? daysBetweenStr(bt.start, live.currentStart) : null;
      let vs;
      if(!live) vs = `<span class="issue-meta">Task removed</span>`;
      else if(delta===null) vs = '—';
      else if(delta===0) vs = `<span class="hrs-pct ok">On plan</span>`;
      else vs = `<span class="${delta>0?'hrs-pct over':'hrs-pct ok'}">${delta>0?delta+'d late':Math.abs(delta)+'d early'}</span>`;
      return `<tr>
        <td data-label="Task">${esc(bt.name)}${bt.trade?`<div class="issue-meta">${esc(bt.trade)}</div>`:''}</td>
        <td data-label="Baseline start">${bt.start||'—'}</td>
        <td data-label="Duration">${bt.duration||0}d</td>
        <td data-label="Baseline finish">${finish}</td>
        <td data-label="Vs. current plan">${vs}</td>
      </tr>`;
    }).join('');
    body = `<div style="overflow-x:auto;"><table><thead><tr><th>Task</th><th>Baseline start</th><th>Duration</th><th>Baseline finish</th><th>Vs. current plan</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  return `
    <div class="section-title" style="margin-top:0; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
      <span>Baseline schedule</span>
      ${readOnly ? '' : `<button class="btn sm secondary" onclick="saveScheduleBaseline()">${icon('clock')} ${btnLabel}</button>`}
    </div>
    <div class="issue-meta" style="margin-bottom:8px;">The originally approved schedule, locked in as the reference point every future update is measured against.</div>
    ${meta}
    ${body}`;
}

function submitScheduleUpdate(){
  const job = getJob(ui.jobId);
  if(!job) return;
  const tasks = state.schedule.filter(t=>t.jobId===ui.jobId);
  const loadedBy = document.getElementById('f-loadedby').value.trim();
  rememberName(loadedBy);
  const note = document.getElementById('f-loadnote').value.trim();
  const changes = [];
  tasks.forEach(t=>{
    const startEl = document.getElementById(`su-start-${t.id}`);
    const durEl = document.getElementById(`su-dur-${t.id}`);
    if(!startEl || !durEl) return;
    const newStart = startEl.value || t.currentStart;
    const newDuration = Number(durEl.value) || t.duration || 1;
    const prevDuration = t.duration || 1;
    if(newStart===t.currentStart && newDuration===prevDuration) return;
    const baselineEntry = (job.scheduleBaseline && job.scheduleBaseline.tasks) ? job.scheduleBaseline.tasks.find(b=>b.taskId===t.id) : null;
    changes.push({
      taskId: t.id, name: t.name,
      previousStart: t.currentStart, newStart,
      previousDuration: prevDuration, newDuration,
      deltaVsBaseline: (baselineEntry && baselineEntry.start && newStart) ? daysBetweenStr(baselineEntry.start, newStart) : null
    });
  });
  if(!changes.length){ showErr('No dates or durations were changed from the current plan.'); return; }
  const delaysVsBaseline = changes.map(c=>c.deltaVsBaseline).filter(d=>d!=null);
  const entry = {
    id: nextId('scheduleUpdates', ui.jobId, 'SCHU'), jobId: ui.jobId,
    date: todayStr(), loadedBy, note,
    changes,
    tasksChanged: changes.length,
    maxDelayVsBaseline: delaysVsBaseline.length ? Math.max(...delaysVsBaseline) : null
  };
  commit({type:'applyScheduleUpdate', entry});
  closeModal();
}
function buildMonthDays(monthStr){
  const [y,m] = monthStr.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  while(cells.length % 7 !== 0) cells.push(null);
  return cells;
}
function shiftScheduleMonth(delta){
  const month = ui.scheduleMonth || currentMonthStr();
  const [y,m] = month.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  ui.scheduleMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}

/* ---- Manpower loading: an overlapped-timeline view of how many field crew are
   needed on any given day, built by stacking every scheduled task's manpower
   across the days it spans — so a PM can see peak staffing across the whole
   job, not just one task at a time, and sanity-check it against the crew size
   implied by the job's bid field hours spread across the job's working span. ---- */
function dailyManpowerMap(tasks){
  const map = {};
  tasks.forEach(t=>{
    if(!t.currentStart) return;
    const dur = Math.max(1, t.duration||1);
    for(let i=0;i<dur;i++){
      const d = addDaysStr(t.currentStart, i);
      map[d] = (map[d]||0) + (Number(t.manpower)||0);
    }
  });
  return map;
}
function isoWeekStart(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const day = dt.getDay();
  const diff = day===0 ? -6 : 1-day;
  dt.setDate(dt.getDate()+diff);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function countWeekdays(startStr, endStr){
  let n = 0, cur = startStr;
  while(cur <= endStr){
    const [y,m,d] = cur.split('-').map(Number);
    const dow = new Date(y,m-1,d).getDay();
    if(dow!==0 && dow!==6) n++;
    cur = addDaysStr(cur, 1);
  }
  return n;
}
function setMpHoursPerDay(val){
  const n = Number(val);
  ui.mpHoursPerDay = (n>0 && n<=24) ? n : 8;
  render();
}
function renderManpowerLoading(job, tasks){
  const dated = tasks.filter(t=>t.currentStart);
  if(dated.length===0){
    return `
    <div class="panel-head"><h3>Manpower loading</h3></div>
    <div class="issue-meta" style="padding:6px 0;">Add tasks with a scheduled start date to see the crew needed across the job.</div>`;
  }
  const dayMap = dailyManpowerMap(dated);
  const dates = Object.keys(dayMap).sort();
  const minDate = dates[0], maxDate = dates[dates.length-1];
  const weeks = {};
  dates.forEach(d=>{
    const wk = isoWeekStart(d);
    weeks[wk] = Math.max(weeks[wk]||0, dayMap[d]);
  });
  const weekKeys = Object.keys(weeks).sort();
  const hoursPerDay = ui.mpHoursPerDay || 8;
  const workDays = countWeekdays(minDate, maxDate);
  const bidHours = Number(job.bidHoursField)||0;
  const bidAvgCrew = (bidHours>0 && workDays>0) ? (bidHours/(workDays*hoursPerDay)) : 0;
  const maxVal = Math.max(...weekKeys.map(w=>weeks[w]), bidAvgCrew, 1);
  const bidLinePct = bidAvgCrew>0 ? Math.min(100, Math.round((bidAvgCrew/maxVal)*100)) : null;
  const bars = weekKeys.map(wk=>{
    const val = weeks[wk];
    const pct = Math.max(2, Math.round((val/maxVal)*100));
    const wkDate = new Date(wk+'T00:00:00');
    const wkLabel = `${wkDate.getMonth()+1}/${wkDate.getDate()}`;
    return `<div class="mp-bar-col" title="Week of ${wk} — peak ${val} on site">
      <div class="mp-bar-val">${val}</div>
      <div class="mp-bar" style="height:${pct}%;"></div>
      <div class="mp-bar-label">${wkLabel}</div>
    </div>`;
  }).join('');
  return `
    <div class="panel-head"><h3>Manpower loading</h3>
      <div class="field" style="margin:0; min-width:150px;">
        <label style="font-size:10px;">Hours/day per worker</label>
        <input type="number" min="1" max="24" value="${hoursPerDay}" ${disabledAttr()} onchange="setMpHoursPerDay(this.value)">
      </div>
    </div>
    <div class="issue-meta" style="margin-bottom:6px;">Every scheduled task's manpower, stacked across the days it overlaps with others — peak crew needed each week, ${minDate} through ${maxDate}. ${bidAvgCrew>0?`The dashed line is the average crew size implied by this job's bid field hours (${bidHours}h ÷ ${workDays} working days ÷ ${hoursPerDay}h/day ≈ ${bidAvgCrew.toFixed(1)} people) — a rough sanity check against the base bid, not a hard target, since real crews ramp up and down.`:`Set bid field hours in Job settings to see a bid-implied average crew line here.`}</div>
    <div class="mp-chart">
      ${bidLinePct!=null ? `<div class="mp-bid-line" style="bottom:${bidLinePct}%;"><span>${bidAvgCrew.toFixed(1)} bid avg</span></div>` : ''}
      ${bars}
    </div>`;
}

async function handleTaskPhotoSelect(ev, taskId){

    const dataUrl = await compressImageFile(file);
    if(stateBytes(state) + newAttachments.reduce((n,a)=>n+a.dataUrl.length,0) + dataUrl.length > MAX_STATE_BYTES){
      alert('A photo would push this job\'s stored data over the limit. Try fewer or smaller photos.');
      continue;
    }
    newAttachments.push({name:file.name, dataUrl, size:dataUrl.length});
  }
  ev.target.value = '';

    commit({type:'addTaskAttachments', taskId, attachments:newAttachments});
    refreshTaskDetail(taskId);
  }

/* ---- Scan a handwritten note: for a Foreman (or anyone) who'd rather write in a
   physical notebook and snap a photo than type on a phone. Runs text recognition
   entirely in the browser (Tesseract.js, loaded on demand from a CDN so normal
   page loads don't pay for it) and drops the recognized text into the note field
   for review — it's OCR of a photo, not true handwriting recognition, so it works
   best on clear block printing and needs checking over before saving. Needs an
   internet connection to fetch the recognition engine the first time it's used. */
let tesseractLoadPromise = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    script.onload = ()=>resolve();
    script.onerror = ()=>{ tesseractLoadPromise = null; reject(new Error('Failed to load text recognition library')); };
    document.head.appendChild(script);
  });
  return tesseractLoadPromise;
}
async function handleNoteScan(ev){
  const file = ev.target.files[0];
  ev.target.value = '';
  if(!file) return;
  // Notes/Meeting Minutes (modal-based — only one on screen at a time) both
  // just use the shared f-text/note-scan-status ids, so they don't need to
  // say so explicitly. Daily Reports, Schedule Field Notes, and After Action
  // Report entries render inline in their own tab instead of a modal, so
  // more than one of THOSE could theoretically exist in the DOM across
  // different tabs — each one's hidden file input says which text field and
  // status line are its own via data-scan-target/data-scan-status (see
  // attachInlineNoteScanListeners below), so one shared function still works
  // for all of them without a fork of this logic.
  const statusEl = document.getElementById(ev.target.dataset.scanStatus || 'note-scan-status');
  const textEl = document.getElementById(ev.target.dataset.scanTarget || 'f-text');
  if(statusEl) statusEl.textContent = 'Loading text recognition…';
  try{
    await loadTesseract();
    const dataUrl = await readFileAsDataURL(file);
    if(statusEl) statusEl.textContent = 'Reading photo — this can take a few seconds…';
    const result = await window.Tesseract.recognize(dataUrl, 'eng');
    const recognized = ((result && result.data && result.data.text) || '').trim();
    if(!recognized){
      if(statusEl) statusEl.textContent = "Couldn't make out any text in that photo — try a clearer, well-lit shot, or type the note by hand.";
      return;
    }
    if(textEl){
      textEl.value = textEl.value.trim() ? textEl.value.trim() + '\n\n' + recognized : recognized;
    }
    if(statusEl) statusEl.textContent = 'Text pulled in below — check it over and fix anything it got wrong before saving.';
  }catch(e){
    console.error('note scan failed', e);
    if(statusEl) statusEl.textContent = "Couldn't read that photo automatically (needs an internet connection) — type the note by hand instead.";
  }
}
// Daily Reports (Field Tool Kit), Schedule Field Notes (Schedule tab), and
// After Action Report entries all render their "Scan a handwritten note"
// file input inline as part of the normal tab markup, not inside a modal —
// so, unlike Notes/Meeting Minutes (wired up once, from openModal/
// openMeetingMinutesDetail, when their overlay is created), these need their
// change listener re-attached every time render() replaces the tab's
// innerHTML. Harmless no-ops on any render where a given tab isn't showing —
// getElementById just returns null and each line is skipped.
function attachInlineNoteScanListeners(){
  ['dr-note-scan-input','sched-note-scan-input','aar-note-scan-input'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', handleNoteScan);
  });
}

/* ===================== MEETING MINUTES (Feature H) =====================
   Per-job tab, right next to Notes — same "quicker than typing on a phone"
   scan-to-text need as Notes, so it reuses that EXACT flow: loadTesseract()
   and handleNoteScan() above are called completely unchanged. The item's
   text field, its scan button, its status line, and its hidden file input
   are given the very same element ids Notes' own add-note form uses
   (f-text / note-scan-input / note-scan-status) — since only one such form
   is ever on screen at a time (this one lives inside the meeting detail
   overlay, and the modal system only ever has one modal open), handleNoteScan
   finds and fills the right field with no fork of its logic at all.
   Any item with a due date gets a "Convert to reminder" button that creates
   a real Schedule task from it — same idempotent-conversion pattern Cost
   Impact -> Change Order uses (issue.status/coId there; item.converted /
   item.convertedToScheduleTaskId here), so it can only ever be converted
   once and the button becomes a disabled "Reminder created" badge after. */

// Idempotent — mirrors convertToCO/createCOFromIssue: creates the Schedule

// two-commit shape as convertToCO (addCo, then convertIssue). Once
// item.converted is true the button in meetingMinutesDetailHTML is gone
// (replaced by the Converted badge), so this can't double-fire from the UI.
function convertMeetingItemToReminder(mtgId, itemId){
  const m = state.meetingMinutes.find(x=>x.id===mtgId);
  const item = m && (m.items||[]).find(x=>x.id===itemId);
  if(!item || item.converted) return;
  const start = item.dueDate || todayStr();
  const task = {
    id: nextId('schedule', m.jobId, 'TSK'), jobId: m.jobId,
    name: item.text.slice(0,120),
    trade: '', manpower: 0, duration: 1,
    originalStart: start, currentStart: start, actualStart: '',
    status: 'Not Started', delayReason: '', linkedIssueId: '',
    priority: 'Medium', dueDate: item.dueDate,
    notes: [], attachments: []
  };
  commit({type:'addTask', entry: task});

   The request itself is emailed from a separate application — Nucleus just tracks it. ---- */
function isImageAttachment(a){ return /^data:image\//.test((a && a.dataUrl) || ''); }
// Used by the Specs card (renderSpecs) to decide whether "Scan for submittals" has
// anything to work with — matches on the data URL's declared MIME type rather than
// the filename, same reasoning as isImageAttachment above.
function isPdfAttachment(a){ return /^data:application\/pdf/.test((a && a.dataUrl) || ''); }
function compressImageFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.62));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  const files = Array.from(ev.target.files);
  const newAttachments = [];
  for(const file of files){
    if(!file.type.startsWith('image/')) continue;
    const dataUrl = await compressImageFile(file);
    if(stateBytes(state) + newAttachments.reduce((n,a)=>n+a.dataUrl.length,0) + dataUrl.length > MAX_STATE_BYTES){
      alert('A photo would push this job\'s stored data over the limit. Try fewer or smaller photos.');
      continue;
    }
    newAttachments.push({name:file.name, dataUrl, size:dataUrl.length});
  }
  ev.target.value = '';
  if(newAttachments.length){
    commit({type:'addEngineeringAttachments', engId, attachments:newAttachments});
    refreshEngineeringDetail(engId);
  }
}
async function handleEngineeringFileSelect(ev, engId){
  const files = Array.from(ev.target.files);

      continue;
    }
    newAttachments.push({name:file.name, dataUrl, size:file.size});
  }
  ev.target.value = '';
  if(newAttachments.length){
    commit({type:'addEngineeringAttachments', engId, attachments:newAttachments});
    refreshEngineeringDetail(engId);
  }
}

/* ---- Elevation tracker ---- */
function elevationPct(el){
  const items = (el && el.items) || [];
  if(!items.length) return 0;
  return Math.round(items.filter(i=>i.done).length / items.length * 100);
}
function elevationPctClass(pct){
  return pct>=100 ? 'ok' : (pct>=50 ? 'warn' : 'over');
}
function elevationDelayDays(el){
  if(!el.actualStart || !el.scheduledStart) return 0;
  return daysBetweenStr(el.scheduledStart, el.actualStart);
}
function renderElevations(elevations){

    const itemRows = items.map(i=>`

        <div class="elev-item ${i.done?'done':''}">
          <label><input type="checkbox" ${i.done?'checked':''} ${disabledAttr()} onchange="toggleElevationItem('${el.id}','${i.id}')"><span>${esc(i.text)}</span></label>
          <button type="button" class="attach-remove" ${disabledAttr()} onclick="deleteElevationItem('${el.id}','${i.id}')" aria-label="Remove item">&times;</button>

          <span class="eig-x">×</span>
          <input type="number" min="0" class="eig-input" placeholder="days" value="${i.goalDays??''}" ${disabledAttr()} title="Goal days" onchange="updateElevItemField('${el.id}','${i.id}','goalDays',this.value)">
          <span class="eig-label" style="margin-left:6px;">Actual</span>

          <span class="eig-x">×</span>
          <input type="number" min="0" class="eig-input" placeholder="days" value="${i.actualDays??''}" ${disabledAttr()} title="Actual days" onchange="updateElevItemField('${el.id}','${i.id}','actualDays',this.value)">

          <div class="spec-title">${esc(el.name||'Untitled elevation')}</div>
          ${el.notes?`<div class="issue-meta">${esc(el.notes)}</div>`:''}
          <div class="issue-meta" style="margin-top:4px;">Scheduled start ${el.scheduledStart||'—'} · Actual start ${el.actualStart||'not started'}

          ${(el.projectedHours!=null || el.actualHours!=null)?`<div class="issue-meta">Hours: ${el.projectedHours!=null?el.projectedHours+'h projected':'no projection'}${el.actualHours!=null?' · '+el.actualHours+'h actual':''}</div>`:''}

function submitElevationItem(elevId){
  const input = document.getElementById('new-item-'+elevId);
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  const elev = state.elevations.find(x=>x.id===elevId);
  const n = (elev && elev.items ? elev.items.length : 0) + 1;
  const item = { id: `${elevId}-ITM-${String(n).padStart(2,'0')}`, text, done:false,
    goalManpower:null, goalDays:null, actualManpower:null, actualDays:null };
  commit({type:'addElevationItem', elevId, item});
}
function updateElevItemField(elevId, itemId, field, value){
  const v = value===''? null : Number(value);
  commit({type:'updateElevationItem', elevId, itemId, patch:{[field]: (v==null || isNaN(v)) ? null : v}});
}
/* Compares planned vs. actual effort (crew size × days = man-days) for one scope
   item — a more meaningful "did it take longer" measure than manpower or days alone. */
function elevItemVarianceHTML(i){
  const gm = Number(i.goalManpower)||0, gd = Number(i.goalDays)||0;
  const am = Number(i.actualManpower)||0, ad = Number(i.actualDays)||0;
  const goalMD = gm*gd, actMD = am*ad;
  if(!goalMD || !actMD) return '';
  const diff = actMD - goalMD;
  const pct = Math.round((diff/goalMD)*100);
  const cls = diff>0 ? 'over' : (diff<0 ? 'ok' : 'warn');
  const label = diff===0 ? 'On target'
    : diff>0 ? `+${diff} man-day${diff===1?'':'s'} (+${pct}%)`
    : `${diff} man-day${diff===-1?'':'s'} (${pct}%)`;
  return `<span class="hrs-pct ${cls}" style="margin-left:auto; font-weight:700;">${label}</span>`;
}
function toggleElevationItem(elevId, itemId){
  const elev = state.elevations.find(x=>x.id===elevId);
  const item = elev && elev.items && elev.items.find(i=>i.id===itemId);
  if(!item) return;
  commit({type:'toggleElevationItem', elevId, itemId, done: !item.done});
}
function deleteElevationItem(elevId, itemId){
  commit({type:'deleteElevationItem', elevId, itemId});
}
function deleteElevation(id){
  if(!confirm("Delete this elevation and its checklist? This can't be undone.")) return;
  commit({type:'deleteElevation', id});
}

// A dated before/after timeline for this elevation's progress photos —
// Greg's ask beyond the checklist-driven progress % and plain photo
// attachments that already existed: sorted oldest-first so scrolling it
// reads as a real progression, not just a pile of photos. Photos from
// before this feature existed simply have no `date` yet (sort to the
// front, oldest-unknown) and no `caption` — both are editable right here,
// not just at upload time, since the date a photo is UPLOADED and the date
// it was actually TAKEN often aren't the same day on a job site.

  const photos = (list||[]).map((a,i)=>({a,i})).filter(({a})=>isImageAttachment(a));
  if(photos.length===0) return `<div class="issue-meta">No progress photos yet — add one below to start a before/after timeline.</div>`;
  const sorted = photos.slice().sort((x,y)=>(x.a.date||'').localeCompare(y.a.date||''));

    <div class="elev-photo-entry">

async function handleElevationPhotoSelect(e, elevId){
  const files = Array.from(e.target.files);
  const dateEl = document.getElementById('elev-photo-date');
  const photoDate = (dateEl && dateEl.value) || todayStr();
  const newAttachments = [];
  for(const file of files){
    if(!file.type.startsWith('image/')) continue;
    const dataUrl = await compressImageFile(file);
    if(stateBytes(state) + newAttachments.reduce((n,a)=>n+a.dataUrl.length,0) + dataUrl.length > MAX_STATE_BYTES){
      alert('A photo would push this job\'s stored data over the limit. Try fewer or smaller photos.');
      continue;
    }
    // date/caption make this a timeline entry, not just a flat attachment —
    // see renderElevPhotoTimelineHTML. The whole batch shares whatever date
    // was picked above (one shoot, one date) — each can still be corrected
    // individually afterward, and a caption added, right in the timeline.
    newAttachments.push({name:file.name, dataUrl, size:dataUrl.length, date: photoDate, caption: ''});
  }
  e.target.value = '';
  if(newAttachments.length){
    commit({type:'addElevationAttachments', elevId, attachments:newAttachments});
    refreshElevationDetail(elevId);
  }
}

/* ---- Procurement ---- */
function procDueClass(item){
  if(item.status==='Delivered') return 'ok';
  if(!item.neededBy) return '';
  const days = daysBetweenStr(todayStr(), item.neededBy);
  if(days < 0) return 'over';
  if(days <= 7) return 'warn';
  return 'ok';
}
/* ---- Material ordering reminder pop-up — fires from openJob() (see NAV
   above) so it shows up whenever this job is opened, from anywhere in the
   app, regardless of which tab you land on (a Foreman never sees Overview,
   but they do see Procurement, and materials matter to whoever's on site). ---- */
function renderProcurement(job, items){
  const rows = items.slice().sort((a,b)=>(a.neededBy||'').localeCompare(b.neededBy||'')).map(p=>{
    const cls = procDueClass(p);
    const days = p.neededBy ? daysBetweenStr(todayStr(), p.neededBy) : null;
    const dueLabel = p.status==='Delivered' ? 'Delivered' : (days==null ? '—' : (days<0 ? `${Math.abs(days)}d overdue` : (days===0?'Due today':`${days}d out`)));
    const docCount = (p.attachments||[]).length;
    return `<tr>
      <td data-label="Item">${esc(p.item)}${p.notes?`<div class="issue-meta">${esc(p.notes)}</div>`:''}</td>
      <td data-label="Vendor">${esc(p.vendor||'—')}</td>
      <td data-label="Cost code">${p.costCode?`${esc(p.costCode)} — ${esc(costCodeLabel(p.costCode))}`:'—'}</td>
      <td data-label="Order date">${p.orderDate||'—'}</td>
      <td data-label="Needed by">${p.neededBy||'—'}</td>
      <td data-label="Status">
        <select ${disabledAttr()} onchange="updateProcurementStatus('${p.id}', this.value)">
          ${['Not Ordered','Ordered','Shipped','Delivered','Delayed'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td data-label="">${p.status==='Delivered' ? '' : `<span class="hrs-pct ${cls}">${esc(dueLabel)}</span>`}</td>
      <td data-label="Docs"><button class="btn sm secondary" onclick="openProcurementDetail('${p.id}')">${icon('paperclip')}${docCount?' '+docCount:''}</button></td>
      <td data-label=""><button class="btn sm secondary" ${disabledAttr()} onclick="deleteProcurement('${p.id}')">${icon('trash')}</button></td>
    </tr>`;
  }).join('');
  return `
    <div class="panel-head"><h3>Procurement — materials on order</h3><button class="btn sm safety" ${disabledAttr()} onclick="openModal('procurement')">${icon('truck')} Add material order</button></div>
    ${items.length===0 ? emptyBlock('truck','Nothing tracked yet — add a material order with its needed-by date to see it on the home calendar and look-ahead.') : `
    <table><thead><tr><th>Item</th><th>Vendor</th><th>Cost code</th><th>Order date</th><th>Needed by</th><th>Status</th><th></th><th>Docs</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`}
    ${renderProcurementCalendar(items)}`;
}
function updateProcurementStatus(id, status){
  commit({type:'updateProcurement', id, patch:{status}});
}
function deleteProcurement(id){
  if(!confirm('Remove this material order?')) return;
  commit({type:'deleteProcurement', id});
  closeModal();
}

/* ---- Feature F1: Procurement gets its own dedicated calendar, living
   inside the Procurement tab itself rather than only being reachable via
   the Field Install / Material Procurement toggle on Overview and the
   Ops Manager home screen ("so it doesn't congest the schedule calendar" —
   Greg). Same rendering/highlighting as the Material Procurement Schedule
   view in renderOverviewCalendar (14-day ordering-buffer highlight via
   needsOrderingSoon), kept at the compact size since it sits alongside the
   existing procurement table rather than replacing a full-page calendar. */
function shiftProcCalMonth(delta){
  const month = ui.procCalMonth || currentMonthStr();
  const [y,m] = month.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  ui.procCalMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}
function renderProcurementCalendar(procurement){
  const month = ui.procCalMonth || currentMonthStr();
  const cells = buildMonthDays(month);
  const today = todayStr();
  const dayHeaders = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dowhead">${d}</div>`).join('');
  const cellsHtml = cells.map(dateStr=>{
    if(!dateStr) return `<div class="cal-cell empty-cell"></div>`;
    const dnum = Number(dateStr.slice(8,10));
    const dayProc = procurement.filter(p=> p.status!=='Delivered' && p.neededBy===dateStr);
    const chips = dayProc.map(p=>`<div class="cal-chip click-only proc-chip${needsOrderingSoon(p)?' proc-chip-urgent':''}" onclick="openProcurementDetail('${p.id}')" title="${esc(p.item)} — needed ${dateStr}${p.vendor?' · '+esc(p.vendor):''} · ${esc(p.status)}">${icon('truck')}${esc(p.item)}</div>`).join('');
    return `<div class="cal-cell${dateStr===today?' cal-today':''}">
      <div class="cal-daynum">${dnum}</div>
      ${chips}
    </div>`;
  }).join('');
  return `
    <div class="panel-head" style="margin-top:28px;"><h3>Procurement calendar</h3>
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <button class="btn sm secondary" onclick="shiftProcCalMonth(-1)">${icon('arrowLeft')}</button>
        <span style="align-self:center; font-family:var(--mono); font-size:12.5px; min-width:110px; text-align:center;">${monthLabel(month)}</span>
        <button class="btn sm secondary" onclick="shiftProcCalMonth(1)">${icon('arrowRight')}</button>
      </div>
    </div>
    <div class="issue-meta" style="margin-bottom:6px;">${icon('alertTriangle')} Highlighted materials are still marked Not Ordered within ${PROCUREMENT_ORDER_BUFFER_DAYS} days of their needed-by date. Tap an item to open it.</div>
    <div class="cal-grid">${dayHeaders}${cellsHtml}</div>
  `;
}

/* ===================== FIELD TOOL KIT (Feature D) =====================
   A fast-navigation hub for the field team — Greg's own words: "For the
   Field Team, Foremen and Superintendants... I want to make it easy for the
   field to navigate to these items." Visible to Foreman and Superintendent
   (and, since nothing restricts it away from them, every other role too —
   see FOREMAN_ALLOWED_TABS above).
   Elevations and Cost Impacts are EMBEDDED directly, not linked — per Greg's
   later request ("Take away costs and elevations on the side bar for
   Foreman. They should have everything in their Field Tool Kit section."),
   'elevations' and 'costs' were removed from FOREMAN_ALLOWED_TABS, so a plain
   setTab('elevations')/setTab('costs') link from in here would now just
   bounce a Foreman straight back out to this same tab. Instead this calls
   the exact same render functions the standalone tabs used to use —
   renderElevations()/renderIssues() — and inlines their output here, so
   nothing about the Elevation tracker or Cost Impact reporting is lost; see
   fieldKitEmbedAllowed below for the one thing that still gates whether each
   section shows up (a per-person override, not the tab's own now-off-by-
   default role default).
   The JHA quick-add into Safety Docs and the Procurement shortcut are
   unchanged pure navigation shortcuts (setTab()) — Safety Docs and
   Procurement are still ordinary standalone tabs for a Foreman. The other
   two pieces of this tab — Equipment on-site tracking and Daily Reports —
   are new job-scoped state (state.equipmentLog / state.dailyReports) that
   live ONLY here, saved through the same generic full-state persistence path
   as everything else (no server-side change needed — see
   nucleus-pwa/server/roles.js: neither key is in ISSUES_KEYS, FINANCIAL_KEYS,
   or CONTRACT_KEYS, so both pass through unfiltered for every role, same as
   elevations/projectedHours in Feature C).
   Field Tool Kit is also FIRST in JOB_TAB_ORDER (see that comment above),
   which makes it the tab a Foreman lands on by default when opening a job —
   a deliberate choice, since fast field navigation is the entire point of
   this tab and a Foreman is exactly who needs it fastest. */
function quickAddJHA(){

// Elevations/Cost Impacts are embedded sections on this same page now (see
// the header comment above), so their quick-link cards scroll to them
// instead of navigating to a separate tab.
function scrollToFieldKitSection(id){

// See fieldKitEmbedAllowed's counterpart comment in the master build for the
// full reasoning — Field Tool Kit's own default for embedding Elevations/
// Cost Impacts is "always show it," independent of that tab key's
// now-off-by-default role default for Foreman, with a per-person override on
// that same key still winning either way.
function fieldKitEmbedAllowed(tabKey){
  const me = getEffectiveTeamMember();
  if(me && !me.__isPreview && me.tabOverrides && Object.prototype.hasOwnProperty.call(me.tabOverrides, tabKey)) return !!me.tabOverrides[tabKey];
  return true;
}

/* ---- Equipment on-site: simple add/edit/delete log, same interaction
   convention as Procurement's inline status control and delete button.
   takenOff stays null while the equipment is still on the job — the
   "Still on-site" badge and the on-site count above key off that. ---- */
function submitEquipmentLog(jobId){
  const nameEl = document.getElementById('eqp-name');
  const name = nameEl.value.trim();
  if(!name) return;
  const addedBy = document.getElementById('eqp-addedby').value.trim();
  rememberName(addedBy);
  const entry = {
    id: nextId('equipmentLog', jobId, 'EQP'), jobId,
    name,
    broughtOn: document.getElementById('eqp-brought').value || todayStr(),
    takenOff: null,
    notes: document.getElementById('eqp-notes').value.trim(),
    addedBy,
    addedDate: todayStr()
  };
  commit({type:'addEquipmentLog', entry});
  nameEl.value = '';
  document.getElementById('eqp-notes').value = '';
}
function markEquipmentOffSite(id){
  commit({type:'updateEquipmentLog', id, patch:{takenOff: todayStr()}});
}
function deleteEquipmentLog(id){
  if(!confirm('Remove this equipment entry?')) return;
  commit({type:'deleteEquipmentLog', id});
}

/* ---- Daily reports: typed in directly ("plug in themselves" — Greg) and/or
   a photo/PDF of a paper report attached after saving — same detail-modal +
   attachment pattern as Safety Docs (openSafetyDocDetail/
   handleSafetyDocSelect above), just renamed for dailyReports. ---- */
function submitDailyReport(jobId){
  const author = document.getElementById('dr-author').value.trim();
  rememberName(author);
  const manpowerVal = document.getElementById('dr-manpower').value;
  const entry = {
    id: nextId('dailyReports', jobId, 'DR'), jobId,
    date: document.getElementById('dr-date').value || todayStr(),
    author,
    weather: document.getElementById('dr-weather').value.trim(),
    notes: document.getElementById('dr-notes').value.trim(),
    manpower: manpowerVal===''?null:Number(manpowerVal),
    attachments: []
  };
  commit({type:'addDailyReport', entry});
}
function deleteDailyReport(id){
  if(!confirm("Delete this daily report? This can't be undone.")) return;
  commit({type:'deleteDailyReport', id});
  closeModal();
}
function openDailyReportDetail(id){
  const d = state.dailyReports.find(x=>x.id===id);
  if(!d) return;
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.dataset.drId = id;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  overlay.innerHTML = dailyReportDetailHTML(d);
  document.body.appendChild(overlay);
  const input = document.getElementById('dr-detail-doc-input');
  if(input) input.addEventListener('change', (e)=>handleDailyReportDocSelect(e, d.id));
}
function dailyReportDetailHTML(d){
  return `<div class="modal" style="max-width:600px;">
    <h3>Daily report — ${d.date||''}</h3><p class="sub">${esc(d.author||'—')}${d.weather?' · '+esc(d.weather):''}${(d.manpower!=null&&d.manpower!=='')?' · '+d.manpower+' crew':''}</p>
    ${d.notes?`<div class="log-entry" style="margin-bottom:14px; white-space:pre-wrap;">${esc(d.notes)}</div>`:''}
    <div class="field"><label>Documents / photos</label>
      <div id="dr-detail-attach-list">${(d.attachments&&d.attachments.length) ? d.attachments.map((a,i)=>`
        <div class="attach-chip"><a href="${a.dataUrl}" target="_blank" rel="noopener">${icon('fileTypePdf')} ${esc(a.name)}</a>
        <button type="button" class="attach-remove" onclick="removeDailyReportAttachment(event, ${i})" aria-label="Remove attachment">&times;</button></div>`).join('') : `<div class="issue-meta">No documents attached.</div>`}</div>
      ${readOnly ? '' : `<div class="photo-drop" onclick="document.getElementById('dr-detail-doc-input').click()" style="margin-top:8px;">${icon('fileUpload')}Attach a photo or PDF of the daily report</div>
      <input type="file" id="dr-detail-doc-input" multiple style="display:none;">`}
    </div>
    <div class="modal-actions">
      <button class="btn sm secondary" style="margin-right:auto;" ${disabledAttr()} onclick="deleteDailyReport('${d.id}')">${icon('trash')} Delete</button>
      <button class="btn secondary" onclick="closeModal()">Close</button>
    </div>
  </div>`;
}
function refreshDailyReportDetail(id){
  const d = state.dailyReports.find(x=>x.id===id);
  const overlay = document.querySelector('.modal-overlay');
  if(!overlay || !d) return;
  overlay.innerHTML = dailyReportDetailHTML(d);
  const input = document.getElementById('dr-detail-doc-input');
  if(input) input.addEventListener('change', (e)=>handleDailyReportDocSelect(e, d.id));
}
async function handleDailyReportDocSelect(e, id){
  const files = Array.from(e.target.files);
  const newAttachments = [];
  for(const file of files){
    const dataUrl = await readFileAsDataURL(file);
    if(stateBytes(state) + newAttachments.reduce((n,a)=>n+a.dataUrl.length,0) + dataUrl.length > MAX_STATE_BYTES){
      alert(`"${file.name}" would push this app's stored data over the limit. Try a smaller file.`);
      continue;
    }
    newAttachments.push({name:file.name, dataUrl, size:file.size});
  }
  e.target.value = '';
  if(newAttachments.length){
    commit({type:'addDailyReportAttachments', id, attachments:newAttachments});
    refreshDailyReportDetail(id);
  }
}
function removeDailyReportAttachment(event, idx){
  const overlay = document.querySelector('.modal-overlay');
  const id = overlay ? overlay.dataset.drId : null;
  if(!id) return;
  commit({type:'removeDailyReportAttachment', id, index: idx});
  refreshDailyReportDetail(id);
}

/* ---- Log & Notes: a single job-wide reference pulling together every

   note/log-style entry scattered across the job — Field Logs (this used to
   be its own "Logs" tab; Greg asked to pull it out as its own button and
   broaden it into a full reference), Notes, Schedule (task notes, field
   coordination notes, GC coordination log), PM Request field notes,
   Elevation foreman notes, Engineering comments, and After Action Report
   entries — filterable by who wrote it and by a broad "where it came from"
   category. Reached via its own button in the job header (see renderJob),
   not a tab, since it's meant as a fall-back reference across the whole
   job rather than a place to work day to day — adding a note tied to a
   specific task/elevation/request/drafting item still happens from that
   item directly; only general Field Log entries are addable here.
   Field Logs entries are left out of a Foreman's view of this page, same
   as the old Logs tab was never shown to Foreman — some Field Log entries
   are auto-generated when a change order is created and include dollar
   amounts, which Foreman never sees anywhere in the app. */
// 'Daily Reports' (Feature D) is the eighth bucket, 'Meeting Minutes'
// (Feature H) the ninth — both following the exact same pattern as the
// buckets before them.
const LOG_BUCKETS = ['Field Logs','Notes','Schedule','PM Requests','Elevations','Engineering','AAR','Daily Reports','Meeting Minutes'];
function emptyBlock(iconName, text){
  return `<div class="empty">${icon(iconName)}${text}</div>`;
}

/* ---- After Action Report — a shared, ongoing log for PM/Superintendent/
   Operations Manager/Foreman: notes, inefficiencies, hiccups, and delays as the
   job progresses, plus milestone tags so it doubles as prep material for the
   Quarter/Halfway/Three-Quarter/Completion after-action meetings. Available to
   Foreman (unlike Overview/Change orders/Costs/Hours/Engineering/Logs). ---- */
const AAR_MILESTONES = ['Quarter (25%)','Halfway (50%)','Three-Quarter (75%)','Completion'];
const AAR_MILESTONE_KEYS = ['quarter','half','threeQuarter','completion'];
const AAR_CATEGORIES = ['Note','Inefficiency','Hiccup / Issue','Delay','Manpower Overage','Equipment Change','Predecessor Delay','GC Coordination Issue'];
function aarCategoryClass(cat){
  if(cat==='Delay' || cat==='Predecessor Delay') return 'cat-delay';
  if(cat==='Hiccup / Issue') return 'cat-hiccup';
  if(cat==='Inefficiency' || cat==='Manpower Overage') return 'cat-ineff';
  if(cat==='Equipment Change') return 'cat-equip';
  if(cat==='GC Coordination Issue') return 'cat-coord';
  return 'cat-note';

function aarCategoryBadgeHTML(cat){

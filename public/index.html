let pendingQueue = loadQueue();

/* Every data mutation is expressed as an op so it can be replayed onto a
   freshly-reloaded version of state.json if this viewer's save loses a race
   with another viewer's (see doPersist -> 'conflict'). */
function applyOp(op, s){
  s = s || state;
  switch(op.type){
    case 'addJob': s.jobs.push(op.job); break;
    case 'deleteJob':
      s.jobs = s.jobs.filter(j=>j.id!==op.jobId);
      ['rfis','cos','issues','logs','hours','contacts','scope','specs','submittals','invoices','projectedCosts','schedule','notes','requests','elevations','procurement','ganttLogs','scheduleUpdates','engineering','scheduleFieldNotes','aar','gcCommLog','greenSheets','materials','greenSheetQuotes','equipmentLog','dailyReports','meetingMinutes','notifications'].forEach(k=>{ s[k] = s[k].filter(x=>x.jobId!==op.jobId); });
      // Per-person job-visibility overrides (see "Per-person job-visibility
      // overrides" near canManageTabOverrides) shouldn't accumulate stale
      // references to a job that no longer exists.
      s.team.forEach(m=>{ if(m.jobOverrides && Object.prototype.hasOwnProperty.call(m.jobOverrides, op.jobId)) delete m.jobOverrides[op.jobId]; });
      break;
    case 'updateJobBudget': {
      const j = s.jobs.find(x=>x.id===op.jobId);
      if(j){
        j.bidHoursField = op.bidHoursField; j.bidHoursShop = op.bidHoursShop;
      }
      break;
    }
    case 'updateJob': {
      const j = s.jobs.find(x=>x.id===op.id);
      if(j) Object.assign(j, op.patch);
      break;
    }
    case 'addTeamMember': s.team.push(op.member); break;
    case 'updateTeamMember': {
      const m = s.team.find(x=>x.id===op.id);
      if(m) Object.assign(m, op.patch);
      break;
    }
    case 'deleteTeamMember': {
      s.team = s.team.filter(m=>m.id!==op.id);
      s.jobs.forEach(j=>{
        if(j.assignedPMs && j.assignedPMs.includes(op.id)) j.assignedPMs = j.assignedPMs.filter(id=>id!==op.id);
        if(j.assignedForemen && j.assignedForemen.includes(op.id)) j.assignedForemen = j.assignedForemen.filter(id=>id!==op.id);
      });
      break;
    }
    case 'addAAR': s.aar.push(op.entry); break;
    case 'deleteAAR': s.aar = s.aar.filter(x=>x.id!==op.id); break;
    case 'addRfi': s.rfis.push(op.entry); break;
    case 'updateRfi': {
      const r = s.rfis.find(x=>x.id===op.id);
      if(r) Object.assign(r, op.patch);
      break;
    }
    case 'addRfiAttachments': {
      const r = s.rfis.find(x=>x.id===op.id);
      if(r){ r.attachments = r.attachments || []; r.attachments.push(...op.attachments); }
      break;
    }
    case 'removeRfiAttachment': {
      const r = s.rfis.find(x=>x.id===op.id);
      if(r && r.attachments) r.attachments.splice(op.index, 1);
      break;
    }
    case 'addCo': s.cos.push(op.entry); break;
    case 'addIssue': s.issues.push(op.entry); break;
    case 'addLog': s.logs.push(op.entry); break;
    case 'setIssueCost': {
      const i = s.issues.find(x=>x.id===op.issueId);
      if(i){ i.cost = op.cost; i.status = 'Costed'; }
      break;
    }
    case 'convertIssue': {
      const i = s.issues.find(x=>x.id===op.issueId);
      if(i){ i.status = 'Converted'; i.coId = op.co.id; }
      if(!s.cos.some(c=>c.id===op.co.id)) s.cos.push(op.co);
      break;
    }
    case 'updateCoStatus': {
      const c = s.cos.find(x=>x.id===op.coId);
      if(c) c.status = op.status;
      break;
    }
    case 'updateCoFields': {
      const c = s.cos.find(x=>x.id===op.coId);
      if(c){
        if('gcNumber' in op) c.gcNumber = op.gcNumber;
        if('date' in op) c.date = op.date;
        if('notes' in op) c.notes = op.notes;
        if('scoNumber' in op) c.scoNumber = op.scoNumber;
        if('number' in op) c.number = op.number;
        if('description' in op) c.description = op.description;
        if('cost' in op) c.cost = op.cost;
        if('scheduleImpact' in op) c.scheduleImpact = op.scheduleImpact;
      }
      break;
    }
    // A change order stays fully editable no matter its status (Draft
    // through Closed/SCO) — see coDetailHTML. Header is a nested object so
    // it gets its own op rather than overloading updateCoFields.
    case 'updateCoHeader': {
      const c = s.cos.find(x=>x.id===op.coId);
      if(c){ c.header = c.header || {}; c.header[op.field] = op.value; }
      break;
    }
    // Replaces a detailed CO's full itemized breakdown (all four line-item
    // sections, tax/freight/O&P, and the recomputed totals/cost) in one
    // shot — see saveCOLineItems, which mirrors submitCOFillable's own
    // read-the-form-and-recalculate logic so editing after creation works
    // exactly like creating it did.
    case 'updateCoLineItems': {
      const c = s.cos.find(x=>x.id===op.coId);
      if(c){
        c.materials = op.materials; c.engineering = op.engineering;
        c.equipment = op.equipment; c.labor = op.labor;
        c.taxPct = op.taxPct; c.freight = op.freight; c.ohpPct = op.ohpPct;
        c.totals = op.totals; c.cost = op.cost;
      }
      break;
    }
    case 'addCoAttachments': {
      const c = s.cos.find(x=>x.id===op.coId);
      if(c){ c.attachments = c.attachments || []; c.attachments.push(...op.attachments); }
      break;
    }
    case 'removeCoAttachment': {
      const c = s.cos.find(x=>x.id===op.coId);
      if(c && c.attachments) c.attachments.splice(op.index, 1);
      break;
    }
    case 'upsertHours': {
      const idx = s.hours.findIndex(h=>h.jobId===op.entry.jobId && h.month===op.entry.month);
      if(idx>=0) s.hours[idx] = op.entry; else s.hours.push(op.entry);
      break;
    }
    case 'deleteHours': s.hours = s.hours.filter(h=>h.id!==op.id); break;
    case 'addContact': s.contacts.push(op.entry); break;
    case 'deleteContact': s.contacts = s.contacts.filter(c=>c.id!==op.id); break;
    case 'addScope': s.scope.push(op.entry); break;
    case 'addMaterial': s.materials.push(op.entry); break;
    case 'deleteMaterial': s.materials = s.materials.filter(x=>x.id!==op.id); break;
    case 'deleteScope': s.scope = s.scope.filter(x=>x.id!==op.id); break;
    case 'addSpec': s.specs.push(op.entry); break;
    case 'deleteSpec':
      s.specs = s.specs.filter(sp=>sp.id!==op.specId);
      s.submittals = s.submittals.filter(su=>su.specId!==op.specId);
      break;
    case 'removeSpecAttachment': {
      const sp = s.specs.find(x=>x.id===op.specId);
      if(sp && sp.attachments) sp.attachments.splice(op.index, 1);
      break;
    }
    case 'addSubmittal': s.submittals.push(op.entry); break;
    case 'addSubmittalsBulk': s.submittals.push(...op.entries); break;
    case 'updateSubmittal': {
      const su = s.submittals.find(x=>x.id===op.subId);
      if(su) Object.assign(su, op.patch);
      break;
    }
    case 'addSubmittalAttachments': {
      const su = s.submittals.find(x=>x.id===op.subId);
      if(su){ su.attachments = su.attachments || []; su.attachments.push(...op.attachments); }
      break;
    }
    case 'removeSubmittalAttachment': {
      const su = s.submittals.find(x=>x.id===op.subId);
      if(su && su.attachments) su.attachments.splice(op.index, 1);
      break;
    }
    case 'addInvoice': s.invoices.push(op.entry); break;
    case 'updateInvoice': {
      const inv = s.invoices.find(x=>x.id===op.invId);
      if(inv) Object.assign(inv, op.patch);
      break;
    }
    case 'addInvoiceAttachments': {
      const inv = s.invoices.find(x=>x.id===op.invId);
      if(inv){ inv.attachments = inv.attachments || []; inv.attachments.push(...op.attachments); }
      break;
    }
    case 'removeInvoiceAttachment': {
      const inv = s.invoices.find(x=>x.id===op.invId);
      if(inv && inv.attachments) inv.attachments.splice(op.index, 1);
      break;
    }
    case 'deleteInvoice': s.invoices = s.invoices.filter(x=>x.id!==op.invId); break;
    case 'addTask': s.schedule.push(op.entry); break;
    case 'addTasks': s.schedule.push(...op.entries); break;
    case 'updateTask': {
      const t = s.schedule.find(x=>x.id===op.id);
      if(t) Object.assign(t, op.patch);
      break;
    }
    case 'deleteTask': s.schedule = s.schedule.filter(x=>x.id!==op.id); break;
    case 'addTaskAttachments': {
      const t = s.schedule.find(x=>x.id===op.taskId);
      if(t){ t.attachments = t.attachments || []; t.attachments.push(...op.attachments); }
      break;
    }
    case 'removeTaskAttachment': {
      const t = s.schedule.find(x=>x.id===op.taskId);
      if(t && t.attachments) t.attachments.splice(op.index, 1);
      break;
    }
    case 'addTaskNote': {
      const t = s.schedule.find(x=>x.id===op.taskId);
      if(t){ t.notes = t.notes || []; t.notes.push(op.note); }
      break;
    }
    case 'deleteTaskNote': {
      const t = s.schedule.find(x=>x.id===op.taskId);
      if(t && t.notes) t.notes = t.notes.filter(n=>n.id!==op.noteId);
      break;
    }
    case 'setScheduleBaseline': {
      const j = s.jobs.find(x=>x.id===op.jobId);
      if(j) j.scheduleBaseline = op.baseline;
      break;
    }
    case 'applyScheduleUpdate': {
      s.scheduleUpdates.push(op.entry);
      op.entry.changes.forEach(ch=>{
        const t = s.schedule.find(x=>x.id===ch.taskId);
        if(t){ t.currentStart = ch.newStart; t.duration = ch.newDuration; }
      });
      break;
    }
    case 'deleteScheduleUpdate': s.scheduleUpdates = s.scheduleUpdates.filter(x=>x.id!==op.id); break;
    case 'addNote': s.notes.push(op.entry); break;
    case 'deleteNote': s.notes = s.notes.filter(x=>x.id!==op.id); break;
    // Feature M: the date on an existing note is editable after the fact
    // (loading up notes written on a different day), not just at creation.
    case 'updateNoteDate': { const n = s.notes.find(x=>x.id===op.id); if(n) n.date = op.date; break; }
    // Feature H: Meeting Minutes
    case 'addMeetingMinutes': s.meetingMinutes.push(op.entry); break;
    case 'deleteMeetingMinutes': s.meetingMinutes = s.meetingMinutes.filter(x=>x.id!==op.id); break;
    case 'addMeetingMinutesItem': {
      const m = s.meetingMinutes.find(x=>x.id===op.mtgId);
      if(m){ m.items = m.items || []; m.items.push(op.item); }
      break;
    }
    case 'deleteMeetingMinutesItem': {
      const m = s.meetingMinutes.find(x=>x.id===op.mtgId);
      if(m) m.items = (m.items||[]).filter(x=>x.id!==op.itemId);
      break;
    }
    case 'convertMeetingMinutesItem': {
      const m = s.meetingMinutes.find(x=>x.id===op.mtgId);
      const item = m && (m.items||[]).find(x=>x.id===op.itemId);
      if(item){ item.converted = true; item.convertedToScheduleTaskId = op.taskId; }
      break;
    }
    // Feature O: in-app notifications
    case 'addNotifications': s.notifications.push(...op.entries); break;
    case 'markNotificationRead': { const n = s.notifications.find(x=>x.id===op.id); if(n) n.read = true; break; }
    case 'markAllNotificationsRead': {
      s.notifications.forEach(n=>{ if(n.recipientMemberId===op.recipientMemberId) n.read = true; });
      break;
    }
    case 'addRequest': s.requests.push(op.entry); break;
    case 'updateRequest': {
      const r = s.requests.find(x=>x.id===op.id);
      if(r) Object.assign(r, op.patch);
      break;
    }
    case 'deleteRequest': s.requests = s.requests.filter(x=>x.id!==op.id); break;
    case 'addRequestFieldNote': {
      const r = s.requests.find(x=>x.id===op.reqId);
      if(r){ r.fieldNotes = r.fieldNotes || []; r.fieldNotes.push(op.note); }
      break;
    }
    case 'deleteRequestFieldNote': {
      const r = s.requests.find(x=>x.id===op.reqId);
      if(r && r.fieldNotes) r.fieldNotes = r.fieldNotes.filter(n=>n.id!==op.noteId);
      break;
    }
    case 'addEngineering': s.engineering.push(op.entry); break;
    case 'updateEngineering': {
      const e = s.engineering.find(x=>x.id===op.id);
      if(e) Object.assign(e, op.patch);
      break;
    }
    case 'addEngineeringAttachments': {
      const e = s.engineering.find(x=>x.id===op.engId);
      if(e){ e.attachments = e.attachments || []; e.attachments.push(...op.attachments); }
      break;
    }
    case 'removeEngineeringAttachment': {
      const e = s.engineering.find(x=>x.id===op.engId);
      if(e && e.attachments) e.attachments.splice(op.index, 1);
      break;
    }
    case 'deleteEngineering': s.engineering = s.engineering.filter(x=>x.id!==op.id); break;
    case 'addEngineeringComment': {
      const e = s.engineering.find(x=>x.id===op.engId);
      if(e){ e.comments = e.comments || []; e.comments.push(op.comment); }
      break;
    }
    case 'deleteEngineeringComment': {
      const e = s.engineering.find(x=>x.id===op.engId);
      if(e && e.comments) e.comments = e.comments.filter(c=>c.id!==op.commentId);
      break;
    }
    case 'addElevation': s.elevations.push(op.entry); break;
    case 'deleteElevation': s.elevations = s.elevations.filter(x=>x.id!==op.id); break;
    case 'addElevationItem': {
      const el = s.elevations.find(x=>x.id===op.elevId);
      if(el){ el.items = el.items || []; el.items.push(op.item); }
      break;
    }
    case 'toggleElevationItem': {
      const el = s.elevations.find(x=>x.id===op.elevId);
      const it = el && el.items && el.items.find(i=>i.id===op.itemId);
      if(it) it.done = op.done;
      break;
    }
    case 'deleteElevationItem': {
      const el = s.elevations.find(x=>x.id===op.elevId);
      if(el && el.items) el.items = el.items.filter(i=>i.id!==op.itemId);
      break;
    }
    case 'updateElevationItem': {
      const el = s.elevations.find(x=>x.id===op.elevId);
      const it = el && el.items && el.items.find(i=>i.id===op.itemId);
      if(it) Object.assign(it, op.patch);
      break;
    }
    case 'updateElevation': {
      const el = s.elevations.find(x=>x.id===op.id);
      if(el) Object.assign(el, op.patch);
      break;
    }
    case 'addElevationAttachments': {
      const el = s.elevations.find(x=>x.id===op.elevId);
      if(el){ el.attachments = el.attachments || []; el.attachments.push(...op.attachments); }
      break;
    }
    case 'removeElevationAttachment': {
      const el = s.elevations.find(x=>x.id===op.elevId);
      if(el && el.attachments) el.attachments.splice(op.index, 1);
      break;
    }
    case 'updateElevationAttachment': {
      const el = s.elevations.find(x=>x.id===op.elevId);
      const a = el && el.attachments && el.attachments[op.index];
      if(a) Object.assign(a, op.patch);
      break;
    }
    case 'addElevationNote': {
      const el = s.elevations.find(x=>x.id===op.elevId);
      if(el){ el.foremanNotes = el.foremanNotes || []; el.foremanNotes.push(op.note); }
      break;
    }
    case 'deleteElevationNote': {
      const el = s.elevations.find(x=>x.id===op.elevId);
      if(el && el.foremanNotes) el.foremanNotes = el.foremanNotes.filter(n=>n.id!==op.noteId);
      break;
    }
    case 'addGanttLog': s.ganttLogs.push(op.entry); break;
    case 'deleteGanttLog': s.ganttLogs = s.ganttLogs.filter(x=>x.id!==op.id); break;
    case 'addScheduleFieldNote': s.scheduleFieldNotes.push(op.entry); break;
    case 'deleteScheduleFieldNote': s.scheduleFieldNotes = s.scheduleFieldNotes.filter(x=>x.id!==op.id); break;
    case 'addGcComm': s.gcCommLog.push(op.entry); break;
    case 'deleteGcComm': s.gcCommLog = s.gcCommLog.filter(x=>x.id!==op.id); break;
    case 'addJobDocs': {
      const jd = s.jobs.find(x=>x.id===op.jobId);
      if(jd){ jd.contractDocs = (jd.contractDocs||[]).concat(op.docs); }
      break;
    }
    case 'removeJobDoc': {
      const jr = s.jobs.find(x=>x.id===op.jobId);
      if(jr && jr.contractDocs) jr.contractDocs.splice(op.index, 1);
      break;
    }
    case 'addGreenSheet': s.greenSheets.push(op.entry); break;
    case 'deleteGreenSheet': s.greenSheets = s.greenSheets.filter(x=>x.id!==op.id); break;
    case 'addStandard': s.standards.push(op.entry); break;
    case 'deleteStandard': s.standards = s.standards.filter(x=>x.id!==op.id); break;
    // Feature I: Post it Board — each op lazily creates the owner's board
    // doc the first time it's actually needed (see renderPostitBoardSection
    // comment above), so opening the page never itself writes state.
    case 'addPostitColumn': {
      let b = s.postItBoards.find(x=>x.ownerId===op.ownerId);
      if(!b){ b = {ownerId: op.ownerId, columns: [], notes: []}; s.postItBoards.push(b); }
      b.columns.push(op.column);
      break;
    }
    case 'renamePostitColumn': {
      const b = s.postItBoards.find(x=>x.ownerId===op.ownerId);
      const c = b && b.columns.find(x=>x.id===op.colId);
      if(c) c.name = op.name;
      break;
    }
    case 'deletePostitColumn': {
      const b = s.postItBoards.find(x=>x.ownerId===op.ownerId);
      if(b){
        b.columns = b.columns.filter(x=>x.id!==op.colId);
        b.notes = b.notes.filter(x=>x.columnId!==op.colId);
      }
      break;
    }
    case 'addPostitNote': {
      let b = s.postItBoards.find(x=>x.ownerId===op.ownerId);
      if(!b){ b = {ownerId: op.ownerId, columns: [], notes: []}; s.postItBoards.push(b); }
      b.notes.push(op.note);
      break;
    }
    case 'updatePostitNote': {
      const b = s.postItBoards.find(x=>x.ownerId===op.ownerId);
      const n = b && b.notes.find(x=>x.id===op.noteId);
      if(n) Object.assign(n, op.patch);
      break;
    }
    case 'deletePostitNote': {
      const b = s.postItBoards.find(x=>x.ownerId===op.ownerId);
      if(b) b.notes = b.notes.filter(x=>x.id!==op.noteId);
      break;
    }
    case 'addStandardAttachments': {
      const st = s.standards.find(x=>x.id===op.id);
      if(st){ st.attachments = st.attachments || []; st.attachments.push(...op.attachments); }
      break;
    }
    case 'removeStandardAttachment': {
      const st = s.standards.find(x=>x.id===op.id);
      if(st && st.attachments) st.attachments.splice(op.index, 1);
      break;
    }
    case 'addSafetyDoc': s.safetyDocs.push(op.entry); break;
    case 'deleteSafetyDoc': s.safetyDocs = s.safetyDocs.filter(x=>x.id!==op.id); break;
    case 'addSafetyDocAttachments': {
      const sd = s.safetyDocs.find(x=>x.id===op.id);
      if(sd){ sd.attachments = sd.attachments || []; sd.attachments.push(...op.attachments); }
      break;
    }
    case 'removeSafetyDocAttachment': {
      const sd = s.safetyDocs.find(x=>x.id===op.id);
      if(sd && sd.attachments) sd.attachments.splice(op.index, 1);
      break;
    }
    case 'addWeldingProcedure': s.weldingProcedures.push(op.entry); break;
    case 'deleteWeldingProcedure': s.weldingProcedures = s.weldingProcedures.filter(x=>x.id!==op.id); break;
    case 'addWeldingAttachments': {
      const w = s.weldingProcedures.find(x=>x.id===op.id);
      if(w){ w.attachments = w.attachments || []; w.attachments.push(...op.attachments); }
      break;
    }
    case 'removeWeldingAttachment': {
      const w = s.weldingProcedures.find(x=>x.id===op.id);
      if(w && w.attachments) w.attachments.splice(op.index, 1);
      break;
    }
    case 'addWaterTest': s.waterTests.push(op.entry); break;
    case 'updateWaterTest': {
      const wt = s.waterTests.find(x=>x.id===op.id);
      if(wt) Object.assign(wt, op.patch);
      break;
    }
    case 'deleteWaterTest': s.waterTests = s.waterTests.filter(x=>x.id!==op.id); break;
    case 'addElevationMarkups': s.elevationMarkups.push(...op.entries); break;
    case 'deleteElevationMarkup': s.elevationMarkups = s.elevationMarkups.filter(x=>x.id!==op.id); break;
    case 'addGreenSheetQuote': s.greenSheetQuotes.push(op.entry); break;
    case 'deleteGreenSheetQuote': s.greenSheetQuotes = s.greenSheetQuotes.filter(x=>x.id!==op.id); break;
    case 'addGreenSheetQuoteAttachments': {
      const q = s.greenSheetQuotes.find(x=>x.id===op.id);
      if(q){ q.attachments = q.attachments || []; q.attachments.push(...op.attachments); }
      break;
    }
    case 'removeGreenSheetQuoteAttachment': {
      const q = s.greenSheetQuotes.find(x=>x.id===op.id);
      if(q && q.attachments) q.attachments.splice(op.index, 1);
      break;
    }
    case 'addProcurement': s.procurement.push(op.entry); break;
    case 'updateProcurement': {
      const p = s.procurement.find(x=>x.id===op.id);
      if(p) Object.assign(p, op.patch);
      break;
    }
    case 'addProcurementAttachments': {
      const p = s.procurement.find(x=>x.id===op.id);
      if(p){ p.attachments = p.attachments || []; p.attachments.push(...op.attachments); }
      break;
    }
    case 'removeProcurementAttachment': {
      const p = s.procurement.find(x=>x.id===op.id);
      if(p && p.attachments) p.attachments.splice(op.index, 1);
      break;
    }
    case 'deleteProcurement': s.procurement = s.procurement.filter(x=>x.id!==op.id); break;
    /* ---- Feature D: Field Tool Kit — equipment on-site tracking and daily
       reports. Same shape as every other simple job-scoped log above
       (add/update/delete, attachments as their own sub-ops). ---- */
    case 'addEquipmentLog': s.equipmentLog.push(op.entry); break;
    case 'updateEquipmentLog': {
      const e = s.equipmentLog.find(x=>x.id===op.id);
      if(e) Object.assign(e, op.patch);
      break;
    }
    case 'deleteEquipmentLog': s.equipmentLog = s.equipmentLog.filter(x=>x.id!==op.id); break;
    case 'addDailyReport': s.dailyReports.push(op.entry); break;
    case 'deleteDailyReport': s.dailyReports = s.dailyReports.filter(x=>x.id!==op.id); break;
    case 'addDailyReportAttachments': {
      const d = s.dailyReports.find(x=>x.id===op.id);
      if(d){ d.attachments = d.attachments || []; d.attachments.push(...op.attachments); }
      break;
    }
    case 'removeDailyReportAttachment': {
      const d = s.dailyReports.find(x=>x.id===op.id);
      if(d && d.attachments) d.attachments.splice(op.index, 1);
      break;
    }
  }
  return s;
}

function commit(op){
  applyOp(op);
  pendingQueue.push(op);
  persistQueue();
  render();
  schedulePersist();
}

function schedulePersist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doPersist, 1200);
}

async function doPersist(){
  if(readOnly){ setSavePill('readonly', "Signed out — sign in again to keep editing"); return; }
  if(saveInFlight){ saveQueued = true; return; }
  if(stateBytes(state) > MAX_STATE_BYTES){
    setSavePill('error', 'Too much data to save — remove a large photo or PDF');
    return;
  }
  saveInFlight = true;
  setSavePill('saving', 'Saving…');
  try{
    const res = await authFetch('/api/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-State-Version': String(stateVersion) },
      body: JSON.stringify(state)
    });
    if(res.status === 401){
      readOnly = true;
      setAuthToken('');
      setSavePill('readonly', 'Signed out — sign in again to keep editing');
      showLoginGate('Your session expired — sign in again to keep editing. Nothing you entered is lost.');
      return;
    }
    if(res.status === 409){
      // Someone else saved first. Take their version, replay this tab's own
      // pending edits on top of it, and retry — so nobody's save silently
      // clobbers anybody else's.
      const server = await res.json();
      state = migratePostitTypes(migrateAssignedPMs(Object.assign(defaultState(), server.state || {})));
      migrateProjectedCosts();
      stateVersion = server.version;
      pendingQueue.forEach(op => applyOp(op));
      render();
      setSavePill('saving', 'Syncing…');
      schedulePersist();
      return;
    }
    if(!res.ok) throw new Error('save failed: ' + res.status);
    const out = await res.json();
    stateVersion = out.version;
    pendingQueue = [];
    persistQueue();
    setSavePill('saved', 'All changes saved');
  }catch(e){
    console.error('save failed', e);
    setSavePill('error', 'Save failed — retrying shortly');
    saveTimer = setTimeout(doPersist, 6000);
  } finally {
    saveInFlight = false;
    if(saveQueued){ saveQueued = false; schedulePersist(); }
  }
}

/* ---- Poll for changes made by other people on other devices. Nucleus's own
   edits still save instantly (schedulePersist above); this just picks up
   everyone else's, since there's no live connection between browsers. ---- */
function startPolling(){
  if(pollTimer) return;
  pollTimer = setInterval(async () => {
    if(saveInFlight || pendingQueue.length || readOnly) return;
    try{
      const res = await authFetch(STATE_FILE, { cache: 'no-store' });
      if(res.status === 401){ readOnly = true; showLoginGate('Your session expired — sign in again.'); return; }
      if(!res.ok) return;
      const v = Number(res.headers.get('X-State-Version')) || 0;
      if(v > stateVersion){
        const loaded = await res.json();
        state = migratePostitTypes(migrateAssignedPMs(Object.assign(defaultState(), loaded || {})));
        const projectedCostsMigrated = migrateProjectedCosts();
        stateVersion = v;
        render();
        if(projectedCostsMigrated && !readOnly) schedulePersist();
      }
    }catch(e){ /* offline for a moment — try again next tick */ }
  }, 15000);
}

/* ---- Manual backup — downloads a full JSON copy of everything entered, independent of autosave ---- */
async function downloadBackup(){
  try{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `nucleus-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){
    console.error('backup failed', e);
    alert("Couldn't save the backup right now — try again in a moment.");
  }
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function currentMonthStr(){ return new Date().toISOString().slice(0,7); }
function monthLabel(m){
  if(!m) return '—';
  const parts = m.split('-');
  const d = new Date(Number(parts[0]), Number(parts[1])-1, 1);
  return d.toLocaleString(undefined, {month:'short', year:'numeric'});
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function badge(status){
  const cls = STATUS_CLASS[status] || 'draft';
  return `<span class="badge ${cls}">${esc(status)}</span>`;
}
function openCount(arr, jobId, doneStates){
  return arr.filter(x=>x.jobId===jobId && !doneStates.includes(x.status)).length;
}
function disabledAttr(){ return readOnly ? 'disabled title="Read-only view — ask the owner for edit access"' : ''; }
function fmtMoney(n){ return '$' + (n||0).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }
function hoursPctClass(used, bid){
  if(!bid) return '';
  const pct = used/bid;
  return pct>1 ? 'over' : (pct>=0.9 ? 'warn' : 'ok');
}
function hoursGauge(label, used, bid){
  const cls = hoursPctClass(used, bid);
  const pct = bid ? Math.round((used/bid)*100) : null;
  const barPct = bid ? Math.min(100, (used/bid)*100) : 0;
  return `<div class="hrs-card">
    <div class="hrs-card-head"><span>${label}</span><span class="hrs-pct ${cls}">${bid ? pct+'%' : 'No bid hours set'}</span></div>
    <div class="hrs-bar"><div class="hrs-bar-fill ${cls}" style="width:${barPct}%"></div></div>
    <div class="hrs-card-foot">${(used||0).toLocaleString()} of ${bid?Number(bid).toLocaleString():'—'} hrs${bid && used>bid ? ' · '+(used-bid).toLocaleString()+' over bid' : ''}</div>
  </div>`;
}

    return `<div class="section-title">${esc(cat)}</div>${cards}`;
  }).join('');
  const uncategorized = items.filter(s=>!s.category);
  const uncatHtml = uncategorized.length ? `<div class="section-title">Uncategorized</div>${uncategorized.map(s=>`
    <div class="log-entry"><div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
      <div style="font-weight:700; font-size:13.5px;">${esc(s.title)}</div>
      <div style="display:flex; gap:6px;"><button class="btn sm secondary" onclick="openStandardDetail('${s.id}')">${icon('fileText')} Open</button>
      <button class="btn sm secondary" ${disabledAttr()} onclick="deleteStandard('${s.id}')">${icon('trash')}</button></div>
    </div></div>`).join('')}` : '';
  return `
    <div class="panel-head"><h3>Standards / Procedures</h3></div>
    <div class="issue-meta" style="margin-bottom:12px;">Company standards for how different tasks get done — Waterproofing, and whatever gets added after it. Visible to everyone so the whole team stays aligned to the same standard, no matter which job they're on.</div>
    ${readOnly ? '' : `
    <div class="co-summary" style="margin-bottom:14px;">
      <div class="field-row">
        <div class="field"><label>Task / category</label><input id="std-category" list="std-category-list" placeholder="e.g. Waterproofing">
          <datalist id="std-category-list">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
        </div>
        <div class="field"><label>Title</label><input id="std-title" placeholder="e.g. C/S Erectors Waterproofing Plan"></div>
      </div>
      <div class="field"><label>Description (optional)</label><textarea id="std-desc" placeholder="What this standard covers"></textarea></div>
      <button class="btn sm safety" onclick="submitStandard()">${icon('plus')} Add standard</button>
    </div>`}
    ${items.length===0 ? emptyBlock('fileText','No standards added yet — add the first one, then attach its document(s) from the Open button.') : grouped + uncatHtml}`;
}
function submitStandard(){
  const title = document.getElementById('std-title').value.trim();
  if(!title) return;
  const entry = {
    id: nextStandardId(),
    category: document.getElementById('std-category').value.trim(),
    title,
    description: document.getElementById('std-desc').value.trim(),
    date: todayStr(),
    attachments: []
  };
  commit({type:'addStandard', entry});
}
function deleteStandard(id){
  if(!confirm("Delete this standard? This can't be undone.")) return;
  commit({type:'deleteStandard', id});
  closeModal();
}
function openStandardDetail(id){
  const s = state.standards.find(x=>x.id===id);
  if(!s) return;
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.dataset.stdId = id;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  overlay.innerHTML = standardDetailHTML(s);
  document.body.appendChild(overlay);
  const input = document.getElementById('std-detail-doc-input');
  if(input) input.addEventListener('change', (e)=>handleStandardDocSelect(e, s.id));
}
function standardDetailHTML(s){
  return `<div class="modal" style="max-width:600px;">
    <h3>${esc(s.title)}</h3><p class="sub">${s.category?esc(s.category):'Uncategorized'}${s.date?` · ${s.date}`:''}</p>
    ${s.description?`<div class="log-entry" style="margin-bottom:14px;">${esc(s.description)}</div>`:''}
    <div class="field"><label>Documents</label>
      <div id="std-detail-attach-list">${(s.attachments&&s.attachments.length) ? s.attachments.map((a,i)=>`
        <div class="attach-chip"><a href="${a.dataUrl}" target="_blank" rel="noopener">${icon('fileTypePdf')} ${esc(a.name)}</a>
        <button type="button" class="attach-remove" onclick="removeStandardAttachment(event, ${i})" aria-label="Remove attachment">&times;</button></div>`).join('') : `<div class="issue-meta">No documents attached.</div>`}</div>
      ${readOnly ? '' : `<div class="photo-drop" onclick="document.getElementById('std-detail-doc-input').click()" style="margin-top:8px;">${icon('fileUpload')}Attach the standard document</div>
      <input type="file" id="std-detail-doc-input" multiple style="display:none;">`}
    </div>
    <div class="modal-actions">
      <button class="btn sm secondary" style="margin-right:auto;" ${disabledAttr()} onclick="deleteStandard('${s.id}')">${icon('trash')} Delete</button>
      <button class="btn secondary" onclick="closeModal()">Close</button>
    </div>
  </div>`;
}
async function handleStandardDocSelect(e, id){
  const files = Array.from(e.target.files);
  const newAttachments = [];
  for(const file of files){
    const dataUrl = await readFileAsDataURL(file);
    if(stateBytes(state) + newAttachments.reduce((n,a)=>n+a.dataUrl.length,0) + dataUrl.length > MAX_STATE_BYTES){
      alert(`"${file.name}" would push this app's stored data over the limit. Try a smaller file.`);
      continue;
    }
    newAttachments.push({name:file.name, dataUrl, size:file.size});
  }
  e.target.value = '';
  if(newAttachments.length){
    commit({type:'addStandardAttachments', id, attachments:newAttachments});
    const s = state.standards.find(x=>x.id===id);
    renderAttachList('std-detail-attach-list', s ? s.attachments : [], false);
  }
}
function removeStandardAttachment(event, idx){
  const overlay = document.querySelector('.modal-overlay');
  const id = overlay ? overlay.dataset.stdId : null;
  if(!id) return;
  commit({type:'removeStandardAttachment', id, index: idx});
  const s = state.standards.find(x=>x.id===id);
  renderAttachList('std-detail-attach-list', s ? s.attachments : [], false);
}

/* ===================== POST IT BOARD (Feature I) =====================
   A standalone top-bar page, same "not a per-job tab" pattern as Standards
   (openStandardsPage above) — reached from its own button in the top bar.
   Personal per-identity board: each team-member identity gets their own set
   of columns and post-its, keyed by state.postItBoards[].ownerId === the
   REAL signed-in identity's id (getCurrentTeamMember, NOT the "View As"
   preview — a personal board is about who's actually signed in and saving,
   same "writes use the real identity" rule everywhere else in this app
   follows; see the comment above getEffectiveTeamMember). When nobody's
   signed in, everybody lands on one shared board (ownerId 'shared') — the
   same "no identity selected -> shared/ungated view" degradation this app
   already uses elsewhere (e.g. Budget and Costs staying visible with no
   identity picked) rather than hiding the page.
   Judgment call: a brand new board starts completely BLANK (no default
   column) — the empty state prompts "add your first column" rather than
   silently creating one, so state.postItBoards never accumulates an empty
   board doc just from opening the page; a board (and its first column) is
   only ever written to state the moment someone actually adds a column.
   Shape:
     state.postItBoards = [{
       ownerId: 'TM-003' | 'shared',
       columns: [ {id, name} ],                 // user-defined, any order/count
       notes: [ {id, columnId, text, color, type, jobId, author, date, dueDate} ]
     }]
   `type` is a color-coded category — Call/Reminder/Discuss/Order (see
   POSTIT_TYPES/POSTIT_TYPE_COLOR below) — shown and editable on every
   note for every role; it drives the note's background color (postit-note
   pcol-N class), replacing the old purely-decorative position-based
   rotation. This used to be a 5-option field (Discuss/Call/Order/
   Important/General) gated to Operations Manager only; Greg's "Color
   Code post its. Drop down on the card will be Call, Reminder, Discuss,
   Order" was — like the created/due-date request below — about the board
   in general, not one role's workflow, so it was opened up to everyone
   and the option set narrowed to match. Old values are remapped on load
   (see the POSTIT_TYPE_MIGRATE step in boot()) so nothing shows blank or
   an option that no longer exists. `jobId` stays Operations-Manager-gated
   exactly as before — that part genuinely is Ops-Manager-specific
   (tagging a note to a job for cost/contract follow-up), unrelated to
   the color-coding change. Drag-and-drop between columns reuses the exact
   same ondragstart/ondragover/ondrop mechanics as the Engineering and
   Schedule Kanban boards (see onEngCardDragStart / onEngColumnDrop above)
   rather than new drag logic.
   `date` (set once, at creation, to todayStr()) and `dueDate` (blank until
   set) are likewise not gated to any one role — Greg: "add a time
   stamp on when created and an option to add a due date" was a request
   about the board in general, so every note on every identity's board
   gets both. `date` is editable after the fact via an inline
   <input type=date>, same pattern as the per-job Notes list's own date
   field (see renderNotes/updateNoteDate) — post-its can sit around for a
   while before being filled in, same reasoning. `dueDate` is optional and
   clearable (an empty value just removes it, unlike `date` which a note
   must always carry); when set, the note shows a Look-Ahead-style
   days-out/overdue badge (see renderLookAhead's dueCls for the identical
   ok/warn/over threshold logic, reused rather than redefined). ---- */
const POSTIT_TYPES = ['Call','Reminder','Discuss','Order'];
// Category -> background color class, reusing the existing pcol-N palette
// (see the .postit-note.pcol-N rules in <style>) rather than inventing new
// colors: Call=amber (needs action), Reminder=safety/red (don't lose
// track), Discuss=gc/teal (neutral conversation), Order=proc/purple
// (matches the app's existing procurement/equipment color elsewhere).
const POSTIT_TYPE_COLOR = { Call:'pcol-0', Reminder:'pcol-4', Discuss:'pcol-2', Order:'pcol-3' };
function openPostitPage(){ ui.view='postit'; render(); }
function renderPostitPage(){
  const app = document.getElementById('app');
  const banner = readOnly ? `<div class="readonly-banner">${icon('helpCircle')} You have a read-only view of this command center — changes here won't be saved.</div>` : '';
  app.innerHTML = `
    ${banner}
    <span class="breadcrumb" onclick="goHome()">${icon('arrowLeft')} All jobs</span>
    ${renderPostitBoardSection()}`;
}
function postitOwnerId(){ const m = getCurrentTeamMember(); return m ? m.id : 'shared'; }
function postitOwnerLabel(){ const m = getCurrentTeamMember(); return m ? `${m.name}'s` : 'Shared'; }
function getPostitBoard(ownerId){ return state.postItBoards.find(b=>b.ownerId===ownerId) || {ownerId, columns:[], notes:[]}; }
let postitIdSeq = 0;
function nextPostitId(prefix){ postitIdSeq++; return `${prefix}-${Date.now().toString(36)}-${postitIdSeq}`; }
function addPostitColumn(){
  const input = document.getElementById('postit-new-col');
  const name = input ? input.value.trim() : '';
  if(!name) return;
  if(input) input.value = '';
  commit({type:'addPostitColumn', ownerId: postitOwnerId(), column:{id: nextPostitId('PCOL'), name}});
}
function renamePostitColumn(colId, name){
  const trimmed = (name||'').trim();
  if(!trimmed) return;
  commit({type:'renamePostitColumn', ownerId: postitOwnerId(), colId, name: trimmed});
}
function deletePostitColumn(colId){
  const board = getPostitBoard(postitOwnerId());
  const count = board.notes.filter(n=>n.columnId===colId).length;
  const col = board.columns.find(c=>c.id===colId);
  const msg = count>0
    ? `Delete "${col?col.name:'this column'}" and the ${count} post-it${count>1?'s':''} in it? This can't be undone.`
    : `Delete "${col?col.name:'this column'}"?`;
  if(!confirm(msg)) return;
  commit({type:'deletePostitColumn', ownerId: postitOwnerId(), colId});
}
function addPostitNote(colId){
  const me = getEffectiveTeamMember();
  const note = {
    id: nextPostitId('PNOTE'), columnId: colId, text: 'New note',
    type: 'Discuss', jobId: '',
    author: currentUserName || (me && me.name) || '', date: todayStr(), dueDate: ''
  };
  commit({type:'addPostitNote', ownerId: postitOwnerId(), note});
}
function updatePostitNoteText(noteId, value){
  commit({type:'updatePostitNote', ownerId: postitOwnerId(), noteId, patch:{text: value}});
}
function updatePostitNoteType(noteId, value){
  commit({type:'updatePostitNote', ownerId: postitOwnerId(), noteId, patch:{type: value}});
}
function updatePostitNoteJob(noteId, value){
  commit({type:'updatePostitNote', ownerId: postitOwnerId(), noteId, patch:{jobId: value}});
}
// Created-date is editable after the fact (see the big comment above) but a
// note must always carry one, same rule updateNoteDate already enforces for
// the per-job Notes list.
function updatePostitNoteDate(noteId, value){
  if(!value) return;
  commit({type:'updatePostitNote', ownerId: postitOwnerId(), noteId, patch:{date: value}});
}
// Due date is optional — an empty value is a valid, meaningful patch here
// (it clears the due date), unlike updatePostitNoteDate above.
function updatePostitNoteDueDate(noteId, value){
  commit({type:'updatePostitNote', ownerId: postitOwnerId(), noteId, patch:{dueDate: value||''}});
}
function deletePostitNote(noteId){
  commit({type:'deletePostitNote', ownerId: postitOwnerId(), noteId});
}
let dragPostitNoteId = null;
function onPostitNoteDragStart(event, noteId){
  if(readOnly) return;
  dragPostitNoteId = noteId;
  event.dataTransfer.effectAllowed = 'move';
  try{ event.dataTransfer.setData('text/plain', noteId); }catch(err){}
}
function onPostitColumnDrop(event, colId){
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  if(readOnly || !dragPostitNoteId){ dragPostitNoteId = null; return; }
  const board = getPostitBoard(postitOwnerId());
  const n = board.notes.find(x=>x.id===dragPostitNoteId);
  if(n && n.columnId!==colId){
    commit({type:'updatePostitNote', ownerId: postitOwnerId(), noteId: dragPostitNoteId, patch:{columnId: colId}});
  }
  dragPostitNoteId = null;
}
// Same ok/warn/over day-count classing renderLookAhead uses for its dueLabel
// (see that function above) — reused as-is rather than reimplemented, so a
// post-it's due badge means the same colors the rest of the app already does.
function postitDueBadge(dueDate){
  if(!dueDate) return '';
  const days = daysBetweenStr(todayStr(), dueDate);
  let label, cls;
  if(days<0){ label = `${Math.abs(days)}d overdue`; cls='over'; }
  else if(days===0){ label = 'Due today'; cls='warn'; }
  else if(days<=7){ label = `${days}d out`; cls='warn'; }
  else { label = `${days}d out`; cls='ok'; }
  return `<span class="hrs-pct ${cls}" style="font-size:10.5px;">${label}</span>`;
}
function postitNoteHTML(n){
  const me = getEffectiveTeamMember();
  const isOpsMgr = !!(me && me.role==='Operations Manager');
  const job = n.jobId ? getJob(n.jobId) : null;
  const metaBits = [];
  if(n.type) metaBits.push(esc(n.type));
  if(job) metaBits.push(esc(job.id));
  const colorClass = POSTIT_TYPE_COLOR[n.type] || 'pcol-2';
  return `
    <div class="postit-note ${colorClass}" draggable="${readOnly?'false':'true'}" ondragstart="onPostitNoteDragStart(event,'${n.id}')">
      ${readOnly ? '' : `<button type="button" class="postit-remove" onclick="deletePostitNote('${n.id}')" aria-label="Delete post-it">&times;</button>`}
      ${metaBits.length ? `<div class="postit-meta">${metaBits.join(' · ')}</div>` : ''}
      <textarea ${disabledAttr()} onchange="updatePostitNoteText('${n.id}', this.value)">${esc(n.text)}</textarea>
      <div style="margin-top:6px; display:flex; flex-direction:column; gap:4px;">
        <select ${disabledAttr()} style="font-size:11px; padding:2px 4px;" onchange="updatePostitNoteType('${n.id}', this.value)">
          ${POSTIT_TYPES.map(t=>`<option ${(n.type||'Discuss')===t?'selected':''}>${t}</option>`).join('')}
        </select>
        ${(!readOnly && isOpsMgr) ? `
        <select style="font-size:11px; padding:2px 4px;" onchange="updatePostitNoteJob('${n.id}', this.value)">
          <option value="">No job</option>
          ${visibleJobs().slice().sort((a,b)=>a.id.localeCompare(b.id)).map(j=>`<option value="${j.id}" ${n.jobId===j.id?'selected':''}>${j.id} — ${esc(j.name)}</option>`).join('')}
        </select>` : ''}
      </div>
      <div style="margin-top:8px; padding-top:6px; border-top:1px dashed rgba(18,24,31,.18); display:flex; flex-direction:column; gap:3px; font-size:10.5px; opacity:.85;">
        <label style="display:flex; align-items:center; gap:4px;">Created
          <input type="date" value="${esc(n.date||'')}" ${disabledAttr()} style="font:inherit; font-size:10.5px; padding:1px 3px; border:1px solid rgba(18,24,31,.25); border-radius:3px; background:rgba(255,255,255,.5); color:inherit;" onchange="updatePostitNoteDate('${n.id}', this.value)">
        </label>
        <label style="display:flex; align-items:center; gap:4px; flex-wrap:wrap;">Due
          <input type="date" value="${esc(n.dueDate||'')}" ${disabledAttr()} style="font:inherit; font-size:10.5px; padding:1px 3px; border:1px solid rgba(18,24,31,.25); border-radius:3px; background:rgba(255,255,255,.5); color:inherit;" onchange="updatePostitNoteDueDate('${n.id}', this.value)">
          ${postitDueBadge(n.dueDate)}
        </label>
      </div>
    </div>`;
}
function renderPostitBoardSection(){
  const ownerId = postitOwnerId();
  const board = getPostitBoard(ownerId);
  const cols = board.columns.map(col=>{
    const notes = board.notes.filter(n=>n.columnId===col.id);
    return `
    <div class="postit-col" ondragover="event.preventDefault(); this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="onPostitColumnDrop(event,'${col.id}')">
      <div class="postit-col-head">
        <input value="${esc(col.name)}" ${disabledAttr()} onchange="renamePostitColumn('${col.id}', this.value)">
        ${readOnly ? '' : `<button type="button" class="attach-remove" onclick="deletePostitColumn('${col.id}')" title="Delete column" aria-label="Delete column">&times;</button>`}
      </div>
      ${readOnly ? '' : `<button class="btn sm secondary" style="width:100%; margin-bottom:10px;" onclick="addPostitNote('${col.id}')">${icon('plus')} Add post-it</button>`}
      ${notes.length===0 ? `<div class="issue-meta" style="padding:2px 0 8px;">Nothing here.</div>` : notes.map(n=>postitNoteHTML(n)).join('')}
    </div>`;
  }).join('');
  return `
    <div class="panel-head"><h3>Post it Board — ${esc(postitOwnerLabel())}</h3></div>
    <div class="issue-meta" style="margin-bottom:12px;">Your own personal board — not shared with anyone else, not tied to any job. Build whatever columns make sense to you and drag post-its between them.${!getCurrentTeamMember() ? ' No identity is picked right now, so this is the shared board everyone without an identity sees — pick who you are (top bar, far right) to get your own.' : ''}</div>
    ${readOnly ? '' : `
    <div style="display:flex; gap:8px; margin-bottom:14px; max-width:360px;">
      <input id="postit-new-col" placeholder="New column name, e.g. To Discuss" onkeydown="if(event.key==='Enter'){event.preventDefault();addPostitColumn();}">
      <button class="btn sm safety" onclick="addPostitColumn()">${icon('plus')} Add column</button>
    </div>`}
    ${board.columns.length===0 ? emptyBlock('notebook','No columns yet — add your first one above to start dropping post-its onto it.') : `<div class="postit-board">${cols}</div>`}`;
}

/* ---- Safety Docs: per-job safety reference library — site safety plans, JHAs,
   SDS sheets, fall protection plans, emergency action plans, etc. Same "store the
   source document, don't retype it" pattern as Standards/Procedures, but scoped to
   this job since site-specific safety plans vary job to job. Visible to every
   identity including Foreman — safety information should never be gated. Add +
   delete only. ---- */
function safetyDocCategories(jobId){
  return Array.from(new Set(state.safetyDocs.filter(x=>x.jobId===jobId).map(s=>s.category).filter(Boolean))).sort((a,b)=>a.localeCompare(b));
}
function renderSafetyDocs(job, items){
  const cats = safetyDocCategories(job.id);
  // Feature D: Field Tool Kit's JHA quick-add hands this a one-time category
  // prefill (see quickAddJHA below) instead of forking Safety Docs' own add
  // flow — consumed once here, then cleared so it doesn't stick on a normal
  // visit to this tab.
  const categoryPrefill = ui.safetyCategoryPrefill || '';
  ui.safetyCategoryPrefill = '';
  const cardHTML = s => {
    const docCount = (s.attachments||[]).length;
    return `
      <div class="log-entry">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
          <div style="flex:1; min-width:0;">
            <div style="font-weight:700; font-size:13.5px;">${esc(s.title)}</div>
            ${s.description?`<div style="font-size:13px; margin-top:4px;">${esc(s.description)}</div>`:''}
            <div class="issue-meta" style="margin-top:4px;">${s.date||''}${docCount?` · ${icon('paperclip')} ${docCount} document${docCount>1?'s':''}`:' · No documents attached yet'}</div>
          </div>
          <div style="display:flex; gap:6px; flex-shrink:0;">
            <button class="btn sm secondary" onclick="openSafetyDocDetail('${s.id}')">${icon('fileText')} Open</button>
            <button class="btn sm secondary" ${disabledAttr()} onclick="deleteSafetyDoc('${s.id}')">${icon('trash')}</button>
          </div>
        </div>
      </div>`;
  };
  const grouped = cats.map(cat=>{
    const list = items.filter(s=>s.category===cat).sort((a,b)=>a.title.localeCompare(b.title));
    return `<div class="section-title">${esc(cat)}</div>${list.map(cardHTML).join('')}`;
  }).join('');
  const uncategorized = items.filter(s=>!s.category);
  const uncatHtml = uncategorized.length ? `<div class="section-title">Uncategorized</div>${uncategorized.map(cardHTML).join('')}` : '';
  return `
    <div class="panel-head"><h3>Safety Docs</h3></div>
    <div class="issue-meta" style="margin-bottom:12px;">Site-specific safety documents for this job — safety plans, JHAs, SDS sheets, fall protection plans, emergency action plans. Visible to everyone on the job, including Foreman.</div>
    ${readOnly ? '' : `
    <div class="co-summary" style="margin-bottom:14px;">
      <div class="field-row">
        <div class="field"><label>Category</label><input id="safe-category" list="safe-category-list" placeholder="e.g. Site Safety Plan, JHA, SDS" value="${esc(categoryPrefill)}">
          <datalist id="safe-category-list">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
        </div>
        <div class="field"><label>Title</label><input id="safe-title" placeholder="e.g. Job Hazard Analysis — Glass Install"></div>
      </div>
      <div class="field"><label>Description (optional)</label><textarea id="safe-desc" placeholder="What this document covers"></textarea></div>
      <button class="btn sm safety" onclick="submitSafetyDoc('${job.id}')">${icon('plus')} Add safety doc</button>
    </div>`}
    ${items.length===0 ? emptyBlock('shield','No safety docs added yet — add the first one, then attach its document from the Open button.') : grouped + uncatHtml}`;
}
function submitSafetyDoc(jobId){
  const titleEl = document.getElementById('safe-title');
  const title = titleEl.value.trim();
  if(!title) return;
  const entry = {
    id: nextId('safetyDocs', jobId, 'SAFE'), jobId,
    category: document.getElementById('safe-category').value.trim(),
    title,
    description: document.getElementById('safe-desc').value.trim(),
    date: todayStr(),
    attachments: []
  };
  commit({type:'addSafetyDoc', entry});
}
function deleteSafetyDoc(id){
  if(!confirm("Delete this safety doc? This can't be undone.")) return;
  commit({type:'deleteSafetyDoc', id});
  closeModal();
}
function openSafetyDocDetail(id){
  const s = state.safetyDocs.find(x=>x.id===id);
  if(!s) return;
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.dataset.safeId = id;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  overlay.innerHTML = safetyDocDetailHTML(s);
  document.body.appendChild(overlay);
  const input = document.getElementById('safe-detail-doc-input');
  if(input) input.addEventListener('change', (e)=>handleSafetyDocSelect(e, s.id));
}
function safetyDocDetailHTML(s){
  return `<div class="modal" style="max-width:600px;">
    <h3>${esc(s.title)}</h3><p class="sub">${s.category?esc(s.category):'Uncategorized'}${s.date?` · ${s.date}`:''}</p>

function refreshSafetyDocDetail(id){

async function handleSafetyDocSelect(e, id){

    if(stateBytes(state) + newAttachments.reduce((n,a)=>n+a.dataUrl.length,0) + dataUrl.length > MAX_STATE_BYTES){

/* ---- Welding Procedures: per-job WPS/PQR reference log — structured fields

   base material, thickness range, and qualified position(s), plus the actual

const WELDING_PROCESSES = ['GMAW (MIG)','FCAW','SMAW (Stick)','GTAW (TIG)','SAW','Other'];
const WELDING_POSITIONS = ['Flat','Horizontal','Vertical','Overhead'];
function renderWelding(job, items){
  const rows = items.slice().sort((a,b)=>(a.wpsNumber||'').localeCompare(b.wpsNumber||'')).map(w=>{

    return `

          <div style="flex:1; min-width:0;">
            <div style="font-weight:700; font-size:13.5px;">${esc(w.wpsNumber||'(no WPS #)')}${w.pqrNumber?` <span class="issue-meta">· PQR ${esc(w.pqrNumber)}</span>`:''}</div>
            <div class="issue-meta" style="margin-top:2px;">${esc(w.process||'—')} · ${esc(w.baseMaterial||'—')}${w.thicknessRange?` · ${esc(w.thicknessRange)}`:''} · Positions: ${esc(positions)}</div>

          </div>
          <div style="display:flex; gap:6px; flex-shrink:0;">
            <button class="btn sm secondary" onclick="openWeldingDetail('${w.id}')">${icon('fileText')} Open</button>
            <button class="btn sm secondary" ${disabledAttr()} onclick="deleteWeldingProcedure('${w.id}')">${icon('trash')}</button>
          </div>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="panel-head"><h3>Welding Procedures</h3></div>
    <div class="issue-meta" style="margin-bottom:12px;">WPS/PQR reference log for this job — process, base material, thickness range, and qualified position(s), with the actual procedure document attached. Visible to everyone on the job, including Foreman.</div>
    ${readOnly ? '' : `
    <div class="co-summary" style="margin-bottom:14px;">
      <div class="field-row">
        <div class="field"><label>WPS #</label><input id="wps-number" placeholder="e.g. WPS-101"></div>
        <div class="field"><label>PQR # (optional)</label><input id="wps-pqr" placeholder="e.g. PQR-14"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Welding process</label><select id="wps-process">${WELDING_PROCESSES.map(p=>`<option>${p}</option>`).join('')}</select></div>
        <div class="field"><label>Base material</label><input id="wps-material" placeholder="e.g. A36 steel, 6063-T6 aluminum"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Thickness range</label><input id="wps-thickness" placeholder="e.g. 1/8&quot; – 1/2&quot;"></div>
        <div class="field"><label>Position(s) qualified</label>
          <div style="display:flex; gap:12px; flex-wrap:wrap; padding-top:6px;">
            ${WELDING_POSITIONS.map(p=>`<label style="display:flex; align-items:center; gap:5px; font-size:13px; font-weight:400;"><input type="checkbox" class="wps-position-cb" value="${p}"> ${p}</label>`).join('')}
          </div>
        </div>
      </div>
      <div class="field"><label>Notes (optional)</label><textarea id="wps-notes" placeholder="Anything else worth flagging about this procedure"></textarea></div>
      <button class="btn sm safety" onclick="submitWeldingProcedure('${job.id}')">${icon('plus')} Add welding procedure</button>
    </div>`}
    ${items.length===0 ? emptyBlock('flame','No welding procedures added yet — add the first WPS, then attach its document from the Open button.') : rows}`;

function submitWeldingProcedure(jobId){
  const wpsNumber = document.getElementById('wps-number').value.trim();
  const baseMaterial = document.getElementById('wps-material').value.trim();
  if(!wpsNumber && !baseMaterial) return;
  const positions = Array.from(document.querySelectorAll('.wps-position-cb:checked')).map(el=>el.value);
  const entry = {
    id: nextId('weldingProcedures', jobId, 'WPS'), jobId,
    wpsNumber,
    pqrNumber: document.getElementById('wps-pqr').value.trim(),
    process: document.getElementById('wps-process').value,
    baseMaterial,
    thicknessRange: document.getElementById('wps-thickness').value.trim(),
    positions,
    notes: document.getElementById('wps-notes').value.trim(),
    date: todayStr(),
    attachments: []
  };
  commit({type:'addWeldingProcedure', entry});
}
function deleteWeldingProcedure(id){
  if(!confirm("Delete this welding procedure? This can't be undone.")) return;
  commit({type:'deleteWeldingProcedure', id});
  closeModal();
}
function openWeldingDetail(id){
  const w = state.weldingProcedures.find(x=>x.id===id);

/* ---- Water Testing: glazing-specific water test schedule/log, plus a place to
   upload marked-up elevation drawings showing test locations. Each test entry
   records the test method/type, the location on the building, a date, and a
   status. Visible to everyone on the job, including Foreman. ---- */
const WATER_TEST_TYPES = ['AAMA 501.2 — Water Spray Test','ASTM E1105 — Field Water Penetration (static)','ASTM E2128 — Field Water Leakage','AAMA 511 — Field Check-Up Procedure','Hose Test (unofficial)','Chamber / Mock-Up Test','Other'];
function renderWaterTesting(job, tests, markups){
  const rows = tests.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(w=>`
    <tr>
      <td data-label="Test type">${esc(w.testType||'—')}</td>
      <td data-label="Location">${esc(w.location||'—')}</td>
      <td data-label="Date">${w.date||'—'}</td>
      <td data-label="Status">
        <select ${disabledAttr()} onchange="updateWaterTestStatus('${w.id}', this.value)">
          ${['Scheduled','Passed','Failed','Retest Needed','Cancelled'].map(s=>`<option ${w.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td data-label="Notes">${esc(w.notes||'—')}</td>
      <td data-label=""><button class="btn sm secondary" ${disabledAttr()} onclick="deleteWaterTest('${w.id}')">${icon('trash')}</button></td>
    </tr>`).join('');
  const markupRows = markups.map(m=>`
    <div class="attach-chip"><a href="${m.dataUrl}" target="_blank" rel="noopener">${icon('fileTypePdf')} ${esc(m.name)}</a>
    <span class="issue-meta">${m.uploadedDate||''}</span>
    ${readOnly ? '' : `<button type="button" class="attach-remove" onclick="deleteElevationMarkup('${m.id}')" aria-label="Remove">&times;</button>`}</div>`).join('');
  return `
    <div class="panel-head"><h3>Water Testing</h3></div>
    <div class="issue-meta" style="margin-bottom:14px;">Glazing-specific water testing for this job — log each test by type and location, track it through to pass/fail, and keep the marked-up elevation drawings showing where tests were performed.</div>

    <div class="section-title">Test schedule</div>
    ${readOnly ? '' : `
    <div class="co-summary" style="margin-bottom:14px;">
      <div class="field-row">
        <div class="field"><label>Test type</label><select id="wt-type">${WATER_TEST_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
        <div class="field"><label>Location</label><input id="wt-location" placeholder="e.g. Elevation A, Bay 3 — storefront"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Date</label><input type="date" id="wt-date" value="${todayStr()}"></div>
        <div class="field"><label>Notes (optional)</label><input id="wt-notes" placeholder="Witnessed by, weather, etc."></div>
      </div>
      <button class="btn sm safety" onclick="submitWaterTest('${job.id}')">${icon('plus')} Add water test</button>
    </div>`}
    ${tests.length===0 ? emptyBlock('droplet',"No water tests logged yet — add each test by type and location as it's scheduled or performed.") : `
    <table><thead><tr><th>Test type</th><th>Location</th><th>Date</th><th>Status</th><th>Notes</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`}

    <div class="section-title" style="margin-top:22px;">Elevation markup drawings</div>
    <div class="issue-meta" style="margin-bottom:8px;">Upload marked-up elevation drawings showing where tests were performed — any file type.</div>
    ${markups.length ? `<div>${markupRows}</div>` : `<div class="issue-meta" style="margin-bottom:8px;">No markup drawings uploaded yet.</div>`}
    ${readOnly ? '' : `
    <div class="photo-drop" style="margin-top:8px;" onclick="document.getElementById('wt-markup-input').click()">${icon('fileUpload')}Upload a marked-up elevation drawing</div>
    <input type="file" id="wt-markup-input" multiple style="display:none;" onchange="handleElevationMarkupSelect(event,'${job.id}')">`}`;
}
function submitWaterTest(jobId){
  const location = document.getElementById('wt-location').value.trim();
  if(!location) return;
  const entry = {
    id: nextId('waterTests', jobId, 'WTR'), jobId,
    testType: document.getElementById('wt-type').value,
    location,
    date: document.getElementById('wt-date').value || todayStr(),
    status: 'Scheduled',
    notes: document.getElementById('wt-notes').value.trim()
  };
  commit({type:'addWaterTest', entry});
}
function updateWaterTestStatus(id, status){
  commit({type:'updateWaterTest', id, patch:{status}});
}
function deleteWaterTest(id){
  if(!confirm('Delete this water test entry?')) return;
  commit({type:'deleteWaterTest', id});
}
async function handleElevationMarkupSelect(e, jobId){
  const files = Array.from(e.target.files);
  const newEntries = [];
  let n = state.elevationMarkups.filter(x=>x.jobId===jobId).length;
  for(const file of files){
    const isImage = file.type.startsWith('image/');
    const dataUrl = isImage ? await compressImageFile(file) : await readFileAsDataURL(file);
    if(stateBytes(state) + newEntries.reduce((n,a)=>n+a.dataUrl.length,0) + dataUrl.length > MAX_STATE_BYTES){
      alert(`"${file.name}" would push this job's stored data over the limit. Try a smaller file.`);
      continue;
    }
    n += 1;
    newEntries.push({ id: `${jobId}-MKUP-${String(n).padStart(3,'0')}`, jobId, name: file.name, dataUrl, uploadedBy: currentUserName||'', uploadedDate: todayStr() });
  }
  e.target.value = '';
  if(newEntries.length) commit({type:'addElevationMarkups', entries:newEntries});
}
function deleteElevationMarkup(id){
  if(!confirm('Remove this markup drawing?')) return;
  commit({type:'deleteElevationMarkup', id});
}

function renderTeamSection(){
  const members = state.team.slice();
  // Only an App Manager can create or reset someone's login — matches the
  // server-side check on /api/accounts/set-password. Hiding the button for
  // everyone else avoids showing a control that would just come back as a
  // 403; the server enforces this regardless of what the client shows, so
  // this is a UI courtesy, not the real access control.
  const canManageLogins = !!(verifiedIdentity && verifiedIdentity.role === 'App Manager');
  // Adding/removing team members isn't server-enforced the way logins are
  // (roster edits ride along with the rest of /api/state, same trust level
  // as everything else non-financial) — but it's still gated to App Manager
  // here so "who's allowed to touch the roster" reads the same everywhere.
  // Exception: when the roster is completely empty, ANYONE signed in can
  // add the first member — otherwise nobody could ever become the first
  // App Manager (the same chicken-and-egg problem NUCLEUS_ADMIN_EMAIL/
  // PASSWORD solves for logins themselves; see README.md, "Setting up your
  // first login"). The moment one member exists, this exception closes.
  const canManageTeam = canManageLogins || members.length === 0;
  // A distinct, wider check than canManageTeam above — App Manager OR
  // Operations Manager — for the new per-person tab-visibility settings
  // panel (see canManageTabOverrides/openTabOverridesPanel). Does not loosen
  // canManageTeam/canManageLogins in any way.
  const canManageOverrides = canManageTabOverrides();
  // Same wider App-Manager-OR-Operations-Manager check as canManageOverrides
  // above, for the new per-person job-visibility settings panel (see
  // canManageJobOverrides/openJobOverridesPanel). Does not loosen
  // canManageTeam/canManageLogins in any way.
  const canManageJobAccess = canManageJobOverrides();
  const memberRow = (m)=>{
    if(ui.editingTeamMemberId === m.id){
      return `
      <div class="log-entry" style="display:flex; flex-direction:column; gap:8px;">
        <div class="field-row">
          <div class="field"><label>Name</label><input id="team-edit-name-${m.id}" value="${esc(m.name)}"></div>
          <div class="field"><label>Role</label>
            <select id="team-edit-role-${m.id}">${TEAM_ROLES.map(r=>`<option ${r===m.role?'selected':''}>${r}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Work email</label><input id="team-edit-email-${m.id}" type="email" value="${esc(m.email||'')}"></div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn sm safety" onclick="submitEditTeamMember('${m.id}')">Save</button>
          <button class="btn sm secondary" onclick="cancelEditTeamMember()">Cancel</button>
        </div>
      </div>`;
    }
    return `
      <div class="log-entry" style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
        <span style="font-weight:700; font-size:13.5px;">${esc(m.name)}${m.email ? ` <span style="font-weight:500; color:var(--text-muted);">— ${esc(m.email)}</span>` : ` <span style="font-weight:500; color:var(--safety);">— no email (can't sign in)</span>`}</span>
        <span style="display:flex; gap:6px;">
          ${(m.email && !ssoMode && canManageLogins) ? `<button class="btn sm secondary" ${disabledAttr()} onclick="openSetPasswordModal('${m.id}')" title="Set or reset this person's login password">${icon('lock')||''} Set login</button>` : ''}
          ${canManageOverrides ? `<button class="btn sm secondary" ${disabledAttr()} onclick="openTabOverridesPanel('${m.id}')" title="Section visibility — turn tabs on/off just for this person">${icon('sliders')}</button>` : ''}
          ${canManageJobAccess ? `<button class="btn sm secondary" ${disabledAttr()} onclick="openJobOverridesPanel('${m.id}')" title="Job access — control which jobs this person can review">${icon('buildingSkyscraper')}</button>` : ''}
          ${canManageTeam ? `<button class="btn sm secondary" ${disabledAttr()} onclick="startEditTeamMember('${m.id}')" title="Edit">${icon('edit')}</button>` : ''}
          ${canManageTeam ? `<button class="btn sm secondary" ${disabledAttr()} onclick="deleteTeamMember('${m.id}')">${icon('trash')}</button>` : ''}
        </span>
      </div>`;
  };
  const tiersHtml = TEAM_ROLES.map(role=>{
    const roleMembers = members.filter(m=>m.role===role).sort((a,b)=>a.name.localeCompare(b.name));
    if(roleMembers.length===0) return '';
    return `
    <div class="team-tier">
      <div class="team-tier-head">
        <span class="role-badge ${roleClass(role)}" style="cursor:default;">${esc(role)}</span>
        <span class="team-tier-count">${roleMembers.length}</span>
      </div>
      <div class="job-grid">${roleMembers.map(memberRow).join('')}</div>
    </div>`;
  }).join('');
  // Any member whose role isn't in TEAM_ROLES (shouldn't normally happen — the add-member
  // form only offers those roles) still gets shown, in its own tier, so nobody's silently dropped.
  const otherMembers = members.filter(m=>!TEAM_ROLES.includes(m.role)).sort((a,b)=> a.role.localeCompare(b.role) || a.name.localeCompare(b.name));
  const otherTierHtml = otherMembers.length ? `
    <div class="team-tier">
      <div class="team-tier-head"><span class="role-badge" style="cursor:default;">Other</span><span class="team-tier-count">${otherMembers.length}</span></div>
      <div class="job-grid">${otherMembers.map(memberRow).join('')}</div>
    </div>` : '';
  return `
    <div class="panel-head"><h3>Team</h3></div>
    <div class="issue-meta" style="margin-bottom:12px;">${canManageTeam ? `Add everyone using Nucleus and their role, with their work email. ${ssoMode ? 'Sign-in is by Microsoft 365 account — the email here has to match their Microsoft 365 email exactly.' : (canManageLogins ? 'After adding someone, click "Set login" to give them an initial password — they can change it themselves after signing in (top bar → Change password).' : 'Once someone is added, an App Manager can click "Set login" to give them an initial password.')}` : `Only an App Manager can add or remove team members and create or reset logins — ask yours. You can change your own password anytime (top bar → Change password).`} An Operations Manager creates jobs, sets bid hours, and assigns a Project Manager to each one — that job then shows up on that PM's own dashboard; an App Manager adds/removes team members and manages their logins. Grouped below by role, top to bottom.</div>
    ${(readOnly || !canManageTeam) ? '' : `
    <div class="co-summary" style="margin-bottom:14px;">
      <div class="field-row">
        <div class="field"><label>Name</label><input id="team-name" placeholder="Full name"></div>
        <div class="field"><label>Role</label>
          <select id="team-role">${TEAM_ROLES.map(r=>`<option>${r}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Work email${ssoMode ? ' (required to sign in)' : ' (needed to set a login)'}</label><input id="team-email" type="email" placeholder="name@cserectors.com"></div>
      </div>
      <button class="btn sm safety" onclick="submitTeamMember()">${icon('plus')} Add to team</button>
    </div>`}
    ${members.length===0 ? `<div class="issue-meta" style="padding:6px 0;">No team members added yet.</div>` : tiersHtml + otherTierHtml}`;
}

/* ---- Home: combined look-ahead across all jobs ---- */
function collectLookAhead(){
  const items = [];
  state.schedule.forEach(t=>{
    if(t.status==='Complete') return;
    items.push({type:'Task', jobId:t.jobId, label:t.name, date:t.currentStart, status:t.status, tab:'schedule'});
  });
  state.procurement.forEach(p=>{
    if(p.status==='Delivered') return;
    items.push({type:'Material', jobId:p.jobId, label:p.item, date:p.neededBy, status:p.status, tab:'procurement'});
  });
  state.requests.forEach(r=>{
    if(r.status==='Closed') return;
    items.push({type:'PM Request', jobId:r.jobId, label:r.title, date:r.dueDate, status:r.status, tab:'requests'});
  });
  state.engineering.forEach(e=>{
    if(e.status==='Done') return;
    items.push({type:'Drafting', jobId:e.jobId, label:e.title, date:e.dateNeeded, status:e.status, tab:'engineering'});
  });
  const visible = items.filter(it=>isJobVisible(it.jobId));
  visible.sort((a,b)=>(a.date||'9999-99-99').localeCompare(b.date||'9999-99-99'));
  return visible;
}
function renderLookAhead(){
  // Engineering Manager's home screen is engineering-focused (see renderHome)
  // — the general Look Ahead narrows to just drafting requests for them,
  // with the header updated so it's clear why it looks different from other
  // roles' full four-type view. Operations Manager's home screen replaces
  // this section entirely with renderOpsContractCostOverview() (see its call
  // site in renderHome, right next to this one) — Greg: "Operations Manager
  // does not necessarily need to see look ahead information for all jobs. He
  // is more of the contract and cost person" — so this returns nothing for
  // that role, same self-gating pattern every other role-specific home
  // section here already uses (e.g. renderOpsCalendarSection below).
  const me = getEffectiveTeamMember();
  if(me && me.role==='Operations Manager') return '';
  const engOnly = !!(me && me.role==='Engineering Manager');
  const items = engOnly ? collectLookAhead().filter(it=>it.type==='Drafting') : collectLookAhead();
  if(!items.length) return '';
  const today = todayStr();
  const rows = items.slice(0,25).map(it=>{
    const job = getJob(it.jobId);
    const days = it.date ? daysBetweenStr(today, it.date) : null;
    let dueLabel = '', dueCls = '';
    if(days!=null){
      if(days<0){ dueLabel = `${Math.abs(days)}d overdue`; dueCls='over'; }
      else if(days===0){ dueLabel = 'Due today'; dueCls='warn'; }
      else if(days<=7){ dueLabel = `${days}d out`; dueCls='warn'; }
      else { dueLabel = `${days}d out`; dueCls='ok'; }
    }
    return `<div class="log-entry" style="cursor:pointer;" onclick="openJob('${it.jobId}','${it.tab}')">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
        <div style="flex:1; min-width:0;">
          <div class="issue-meta">${job?job.id:it.jobId}${job?' — '+esc(job.name):''} · ${it.type}</div>
          <div style="font-weight:700; font-size:13.5px;">${esc(it.label)}</div>
        </div>
        <div style="text-align:right; flex-shrink:0;">
          ${badge(it.status)}
          ${dueLabel?`<div class="hrs-pct ${dueCls}" style="margin-top:4px;">${dueLabel}</div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
  return `
    <div class="section-title" style="margin-top:28px;">${engOnly ? 'Look ahead — engineering items only' : 'Look ahead — tasks needing to get done, all jobs'}</div>
    ${rows}`;
}

/* ---- Home: Operations Manager contract/cost overview ----
   Greg: "Operations Manager does not necessarily need to see look ahead
   information for all jobs. He is more of the contract and cost person."
   Replaces the generic Look Ahead digest for this role only (see
   renderLookAhead's Operations Manager gate just above, and this function's
   call site in renderHome right next to it) — the toggle-able all-jobs/
   single-job schedule calendar (renderOpsCalendarSection) and every other
   home section are untouched; this only swaps out Look Ahead and, since
   Operations Manager isn't a PM-briefing audience either, renderBriefing
   (see its own gate).
   Pulls together three EXISTING data sources rather than inventing new
   state, across every job this Operations Manager can currently see
   (isJobVisible/visibleJobs() — so the per-person job-visibility overrides
   above apply here automatically, same as the rest of the home screen):
   open Cost Impacts (state.issues, same "open" = not Converted definition
   the job cards already use via openCount), a budget-vs-actual flag per job
   reusing the EXACT Green-Sheet-vs-Invoice math renderBudgetCosts already
   does (spent = invoices matching a budget line's Green Sheet cost code,
   summed; hoursPctClass's over/warn thresholds), and open Change Orders
   (state.cos, same CO_OPEN_DONE_STATES the job cards already use). A
   home-screen digest, not a full report — each row links straight into the
   relevant job/tab, same click-through convention as renderLookAhead. */
function renderOpsContractCostOverview(){
  const me = getEffectiveTeamMember();
  if(!me || me.role!=='Operations Manager') return '';
  const jobs = visibleJobs().slice().sort((a,b)=>a.id.localeCompare(b.id));
  if(jobs.length===0) return '';

  const impactRows = jobs.map(job=>{
    const open = state.issues.filter(i=>i.jobId===job.id && i.status!=='Converted');
    if(!open.length) return null;
    const pending = open.filter(i=>i.status==='Pending Review').length;
    return `<div class="log-entry" style="cursor:pointer;" onclick="ui.costSubTab='impacts'; openJob('${job.id}','costs')">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
        <div style="min-width:0;"><div class="issue-meta">${job.id} — ${esc(job.name)}</div>
        <div style="font-weight:700; font-size:13.5px;">${open.length} open cost impact${open.length>1?'s':''}${pending?` · ${pending} awaiting pricing`:''}</div></div>
        <div class="hrs-pct ${pending?'warn':'ok'}">${open.length}</div>
      </div>
    </div>`;
  }).filter(Boolean).join('');

  const budgetRows = jobs.map(job=>{
    const greenSheets = state.greenSheets.filter(g=>g.jobId===job.id);
    const invoices = state.invoices.filter(i=>i.jobId===job.id);
    const flagged = greenSheets.filter(g=>!!g.costCode).map(g=>{
      const spent = invoices.filter(i=>i.costCode===g.costCode).reduce((s,i)=>s+Number(i.amount||0),0);
      return { g, spent, cls: hoursPctClass(spent, g.budget) };
    }).filter(f=>f.cls==='over' || f.cls==='warn');
    if(!flagged.length) return null;
    const worst = flagged.some(f=>f.cls==='over') ? 'over' : 'warn';
    const lines = flagged.map(f=>`${esc(f.g.system||f.g.scope||f.g.costCode)} (${fmtMoney(f.spent)} of ${fmtMoney(f.g.budget)})`).join(', ');
    return `<div class="log-entry" style="cursor:pointer;" onclick="openJob('${job.id}','budgetcosts')">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
        <div style="min-width:0;"><div class="issue-meta">${job.id} — ${esc(job.name)}</div>
        <div style="font-weight:700; font-size:13.5px;">${worst==='over'?'Over budget':'Near budget'} — ${lines}</div></div>
        <div class="hrs-pct ${worst}">${worst==='over'?'Over':'Near'}</div>
      </div>
    </div>`;
  }).filter(Boolean).join('');

  const coRows = jobs.map(job=>{
    const cos = state.cos.filter(c=>c.jobId===job.id);
    const open = cos.filter(c=>!CO_OPEN_DONE_STATES.includes(c.status));
    if(!open.length) return null;
    const total = open.reduce((s,c)=>s+(c.cost!=null?Number(c.cost):0),0);
    return `<div class="log-entry" style="cursor:pointer;" onclick="openJob('${job.id}','costs'); ui.costSubTab='changeorders'; render();">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
        <div style="min-width:0;"><div class="issue-meta">${job.id} — ${esc(job.name)}</div>
        <div style="font-weight:700; font-size:13.5px;">${open.length} open change order${open.length>1?'s':''}${total?` · ${fmtMoney(total)} pending`:''}</div></div>
        <div class="hrs-pct warn">${open.length}</div>
      </div>
    </div>`;
  }).filter(Boolean).join('');

  if(!impactRows && !budgetRows && !coRows){
    return `
    <div class="section-title" style="margin-top:28px;">Contract &amp; cost overview</div>
    <div class="issue-meta">Nothing flagged right now — no open cost impacts, no jobs over or near budget, and no open change orders across your jobs.</div>`;
  }
  return `
    <div class="section-title" style="margin-top:28px;">Contract &amp; cost overview</div>
    <div class="issue-meta" style="margin-bottom:10px;">Cost impacts, budget-vs-actual, and change orders across your jobs — tap a row to jump straight to that job's tab.</div>
    ${impactRows ? `<div class="section-title" style="margin-top:0; font-size:12px;">Open cost impacts</div>${impactRows}` : ''}
    ${budgetRows ? `<div class="section-title" style="margin-top:14px; font-size:12px;">Budget vs actual</div>${budgetRows}` : ''}
    ${coRows ? `<div class="section-title" style="margin-top:14px; font-size:12px;">Open change orders</div>${coRows}` : ''}`;
}

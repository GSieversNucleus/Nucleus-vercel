  *{box-sizing:border-box;}
  body{
    margin:0; color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    background:
      linear-gradient(rgba(247,246,242,.93), rgba(247,246,242,.93)),
      var(--logo-url) center 120px / 560px no-repeat,
      var(--paper);
    background-attachment: fixed, fixed, fixed;
  }
  ::selection{ background: var(--safety); color:#fff; }

  .icon{ width:1em; height:1em; display:inline-block; vertical-align:-0.15em; flex-shrink:0; }
  .icon.spin{ animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--ink); color:#F1EFE8; display:flex; align-items:center;
    justify-content:space-between; padding:14px 20px; gap:16px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-logo{
    width:38px; height:38px; object-fit:contain; flex-shrink:0;
  }
  /* Feature R: "Nucleus" made significantly bigger/bolder (still the same
     --disp/Archivo Expanded display font already used for every heading in
     this app, at its one loaded weight — 700 — rather than pulling in a new
     font or an unloaded weight) plus a tagline in place of the old plain
     "Central Command Center" subtitle. */
  .brand-text h1{ font-family:var(--disp); font-weight:700; font-size:28px; line-height:1.05; margin:0; letter-spacing:.01em; color:#fff;}
  .brand-text p{ margin:2px 0 0; font-size:11.5px; font-weight:500; color:#9AA3AC; letter-spacing:.03em; }
  .top-controls{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .role-toggle{
    display:flex; background:#1D2530; border-radius:8px; padding:3px; gap:2px;
  }
  .role-toggle button{
    border:none; background:transparent; color:#9AA3AC; font-family:var(--sans);
    font-weight:600; font-size:12.5px; padding:7px 14px; border-radius:6px; cursor:pointer;
    letter-spacing:.02em;
  }
  .role-toggle button.active{ background:var(--safety); color:#fff; }
  /* Persistent search row — a second full-width dark bar under the main top
     bar, replacing the old click-to-open Search button/modal (Greg: "add a
     second row for buttons up top, but make that a search bar" — the old
     purely-cosmetic Foreman/PM view toggle that used to sit next to the
     Search button was removed in the same round, since real per-identity
     tab visibility now makes it redundant.
     Reuses the exact same search logic and scope toggle as before
     (searchApp/renderSearchResultsHTML, both untouched) — only the entry
     point changed, from a modal opened by a button to an always-visible
     input with a live results dropdown. */
  .search-row{
    position:relative; background:var(--ink); border-top:1px solid #232B36;
    padding:10px 20px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .search-row-field{ position:relative; flex:1 1 320px; min-width:180px; display:flex; align-items:center; }
  .search-row-field .icon{ position:absolute; left:12px; color:#8993A0; pointer-events:none; }
  .search-row-field input{
    width:100%; background:#1D2530; border:1px solid #384250; color:#fff;
    border-radius:8px; padding:9px 12px 9px 34px; font-family:var(--sans); font-size:13px;
  }
  .search-row-field input::placeholder{ color:#8993A0; }
  .search-row-field input:focus{ outline:none; border-color:var(--steel-dim); }
  .search-row-scope{ display:flex; background:#1D2530; border-radius:8px; padding:3px; gap:2px; flex-shrink:0; }
  .search-row-scope button{
    border:none; background:transparent; color:#9AA3AC; font-family:var(--sans);
    font-weight:600; font-size:11.5px; padding:7px 11px; border-radius:6px; cursor:pointer;
    white-space:nowrap;
  }
  .search-row-scope button.active{ background:var(--safety); color:#fff; }
  .search-row-results{
    position:absolute; top:100%; left:20px; right:20px; z-index:56;
    background:var(--card); color:var(--ink); border:1.5px solid var(--line-strong);
    border-top:none; border-radius:0 0 var(--radius) var(--radius); box-shadow:0 12px 32px rgba(0,0,0,.28);
    padding:10px 14px; max-height:60vh; overflow-y:auto;
  }
  .search-row-results[hidden]{ display:none; }
  .home-btn{
    border:1px solid #384250; background:transparent; color:#E7E5DF; padding:8px 12px;
    border-radius:8px; font-family:var(--sans); font-weight:600; font-size:12.5px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
  }
  .home-btn:hover{ border-color:var(--steel-dim); }
  /* Team dropdown: the Team roster + add-member form used to sit inline at
     the top of the home screen, pushing the job cards down. Moved into a
     small panel anchored under a top-bar button instead — still grouped by
     role tier inside, still has the add-member form, just out of the way
     until you need it. A transparent full-page backdrop behind the panel
     closes it on an outside click, same as Escape. */
  .team-dd-wrap{ position:relative; display:inline-block; }
  .team-dropdown{
    position:absolute; top:calc(100% + 6px); left:0; z-index:60;
    width:380px; max-width:min(90vw,380px); max-height:72vh; overflow-y:auto;
    background:var(--card); color:var(--ink); border:1.5px solid var(--line-strong);
    border-radius:var(--radius); box-shadow:0 12px 32px rgba(0,0,0,.28); padding:16px;
  }
  .team-dropdown-backdrop{ position:fixed; inset:0; z-index:59; background:transparent; }
  @media (max-width:640px){ .team-dropdown{ position:fixed; top:64px; left:12px; right:12px; width:auto; max-width:none; } }
  /* Feature O: in-app notifications bell — same anchored-panel/backdrop
     pattern as the Team dropdown right above, just narrower and right-
     aligned since it hangs off a button further along the top-controls
     row (right-aligned so it doesn't run off the right edge of the page). */
  .notif-dd-wrap{ position:relative; display:inline-block; }
  .notif-bell-btn{ position:relative; }
  .notif-badge{
    position:absolute; top:-6px; right:-6px; min-width:17px; height:17px; padding:0 4px;
    border-radius:20px; background:var(--safety); color:#fff; font-family:var(--mono);
    font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--ink);
  }
  .notif-dropdown{
    position:absolute; top:calc(100% + 6px); right:0; z-index:60;
    width:360px; max-width:min(92vw,360px); max-height:72vh; overflow-y:auto;
    background:var(--card); color:var(--ink); border:1.5px solid var(--line-strong);
    border-radius:var(--radius); box-shadow:0 12px 32px rgba(0,0,0,.28); padding:14px;
  }
  @media (max-width:640px){ .notif-dropdown{ position:fixed; top:64px; left:12px; right:12px; width:auto; max-width:none; } }
  .notif-item{ padding:10px 8px; border-bottom:1px solid var(--line); cursor:pointer; }
  .notif-item:last-child{ border-bottom:none; }
  .notif-item:hover{ background:var(--paper); }
  .notif-item.unread{ background:var(--steel-dim); background:color-mix(in srgb, var(--steel-dim) 28%, var(--card)); border-left:3px solid var(--steel); padding-left:6px; }
  .notif-item .n-msg{ font-size:13px; font-weight:600; }
  .notif-item .n-meta{ font-size:11px; color:var(--text-muted); margin-top:3px; }
  .role-badge{
    border:1px solid #384250; background:#1D2530; color:#fff; padding:7px 13px 7px 11px;
    border-radius:8px; font-family:var(--sans); font-weight:700; font-size:12.5px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; letter-spacing:.01em;
    border-left:4px solid var(--steel-dim);
  }
  .role-badge.role-ops{ border-left-color:var(--safety); }
  .role-badge.role-pm{ border-left-color:var(--steel-dim); }
  .role-badge.role-foreman{ border-left-color:var(--good); }
  .role-badge.role-super{ border-left-color:var(--amber); }
  .role-badge.role-eng{ border-left-color:var(--steel-dark); }
  .role-badge.role-appmgr{ border-left-color:var(--proc); }
  .role-badge:hover{ border-color:var(--steel-dim); }
  .identity-select{
    border:1px solid #384250; background:#1D2530; color:#fff; padding:8px 10px;
    border-radius:8px; font-family:var(--sans); font-weight:600; font-size:12.5px; cursor:pointer;
    max-width:220px;
  }
  /* Feature A — View As: an App-Manager-only client-side preview of another
     role's tab/home-screen visibility. viewas-wrap stays hidden unless the
     REAL signed-in identity is App Manager (see updateViewAsControl) — this
     is look-only, never a real account switch, and never affects what gets
     saved (see getEffectiveTeamMember vs getCurrentTeamMember). */
  .viewas-wrap{ display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .viewas-select{ border-color:var(--proc); background:#20242c; }
  /* Bug fix support: inline message shown instead of the member picker when
     a Foreman/Project-Manager preview has no specific person chosen yet, or
     none of that role exists — see updateViewAsControl/renderHome. */
  .viewas-msg{ color:#F0B429; font-size:11.5px; font-weight:700; max-width:240px; line-height:1.3; }
  .preview-banner{
    position:sticky; top:0; z-index:80; background:var(--safety); color:#fff;
    padding:9px 16px; display:flex; align-items:center; justify-content:center;
    gap:16px; font-weight:700; font-size:13px; flex-wrap:wrap; text-align:center;
  }
  /* Bug fix: the class rule above sets display:flex unconditionally, which — at
     equal CSS specificity — beats the browser's own [hidden]{display:none} default
     stylesheet rule, since author styles win ties over user-agent styles. Net effect:
     the hidden attribute was never actually hiding this element, so "Exit preview"
     correctly cleared the preview state but the red banner itself stayed on screen
     forever with stale text. This rule's higher specificity (class + attribute)
     restores the intended hide behavior. */
  .preview-banner[hidden]{ display:none; }
  .preview-banner .btn{ background:#fff; color:var(--safety); border:none; }
  .preview-banner .btn:hover{ background:#F1EFE8; }

  .save-pill{
    display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:600; color:#B7BFC7;
    padding:6px 11px; border-radius:20px; border:1px solid #384250; font-family:var(--mono);
    letter-spacing:.01em;
  }
  .save-pill .dot{ width:7px; height:7px; border-radius:50%; background:#6B7280; flex-shrink:0; }
  .save-pill.saved .dot{ background:var(--good); }
  .save-pill.saving .dot{ background:var(--steel-dim); animation:pulse 1s ease-in-out infinite; }
  .save-pill.error .dot{ background:var(--safety); }
  .save-pill.readonly .dot{ background:var(--amber); }
  .save-pill.offline .dot{ background:#6B7280; }

  /* ---------- Layout ---------- */
  .wrap{ max-width:1180px; margin:0 auto; padding:24px 20px 60px; }
  .empty{
    text-align:center; padding:60px 20px; color:var(--text-muted); display:flex; flex-direction:column;
    align-items:center; gap:10px;
  }
  .empty .icon{ font-size:34px; color:var(--line-strong); }
  .readonly-banner{
    background:var(--amber-dim); color:var(--amber-dark); border:1px solid #E2C989; border-radius:8px;
    padding:10px 14px; font-size:12.5px; font-weight:600; margin-bottom:16px; display:flex; align-items:center; gap:8px;
  }

  /* ---------- Job cards (home) ---------- */
  .home-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .home-head h2{ font-family:var(--disp); font-size:20px; margin:0; }
  .home-head p{ margin:2px 0 0; color:var(--text-muted); font-size:13px; }
  .btn{
    font-family:var(--sans); font-weight:700; font-size:13px; border-radius:8px; cursor:pointer;
    padding:10px 16px; border:1.5px solid var(--ink); background:var(--ink); color:#fff;
    display:inline-flex; align-items:center; gap:7px; letter-spacing:.01em;
  }
  .btn:hover{ background:var(--ink-2); }
  .btn.secondary{ background:transparent; color:var(--ink); border-color:var(--line-strong); }
  .btn.secondary:hover{ border-color:var(--ink); }
  .btn.safety{ background:var(--safety); border-color:var(--safety); }
  .btn.safety:hover{ background:#A50D26; }
  .btn.sm{ padding:7px 12px; font-size:12px; }
  .btn:disabled, .btn[disabled]{ opacity:.4; cursor:not-allowed; }
  .btn:disabled:hover, .btn[disabled]:hover{ background:var(--ink); }
  .btn.secondary:disabled:hover{ background:transparent; border-color:var(--line-strong); }

  .job-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .job-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 16px 14px; cursor:pointer; transition:border-color .12s, transform .12s;
    position:relative; overflow:hidden;
  }
  .job-card:hover{ border-color:var(--steel); transform:translateY(-1px); }
  .job-card::before{
    content:''; position:absolute; top:0; left:0; width:5px; height:100%; background:var(--steel);
  }
  .job-tag{
    font-family:var(--mono); font-weight:700; font-size:13px; background:var(--ink);
    color:#F1EFE8; padding:3px 9px; border-radius:5px; letter-spacing:.06em; display:inline-block;
  }
  .job-card h3{ font-family:var(--disp); font-size:16px; margin:10px 0 2px; }
  .job-card .job-meta{ font-size:12px; color:var(--text-muted); margin-bottom:10px; }
  .job-card-assign{ display:flex; flex-direction:column; gap:6px; background:#F1EFE8; border-radius:8px; padding:8px 9px; margin-bottom:12px; cursor:default; }
  .job-card-assign-row{ display:flex; align-items:flex-start; gap:8px; }
  .job-card-assign-row .l{ font-size:9.5px; text-transform:uppercase; color:var(--text-muted); letter-spacing:.05em; font-weight:700; width:46px; flex-shrink:0; padding-top:5px; }
  .job-card-assign select{
    flex:1; min-width:0; border:1px solid var(--line-strong); border-radius:6px; padding:5px 6px;
    font-size:11.5px; font-family:var(--sans); background:#fff; color:var(--ink); cursor:pointer;
  }
  .job-card-assign select:disabled{ opacity:.5; cursor:not-allowed; }
  .chip-row{ display:flex; flex-wrap:wrap; align-items:center; gap:5px; flex:1; min-width:0; }
  .foreman-chip{
    display:inline-flex; align-items:center; gap:3px; background:#fff; border:1px solid var(--line-strong);
    border-radius:20px; padding:3px 4px 3px 9px; font-size:11px; font-weight:600; white-space:nowrap;
  }
  .foreman-chip button{
    display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; font-size:15px;
    border:none; background:transparent; color:var(--text-muted); cursor:pointer; padding:0; border-radius:50%;
  }
  .foreman-chip button:hover{ color:var(--safety); background:#F1EFE8; }
  .job-card-assign-empty{ font-size:11px; color:var(--text-muted); font-style:italic; }
  .job-card-edit-btn{
    position:absolute; top:14px; right:14px; width:26px; height:26px; display:inline-flex;
    align-items:center; justify-content:center; border:1px solid var(--line-strong); border-radius:7px;
    background:#fff; color:var(--text-muted); cursor:pointer; padding:0;
  }
  .job-card-edit-btn:hover{ color:var(--ink); border-color:var(--steel); background:#F1EFE8; }
  .job-card-edit-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .job-card-edit-btn .icon{ width:14px; height:14px; }
  /* Feature D: Field Tool Kit quick-launch cards reuse .job-card, just with a
     bigger icon up top instead of the job-stats grid. */
  .fieldkit-card-icon{ color:var(--steel-dark); }
  .fieldkit-card-icon .icon{ width:26px; height:26px; }
  .job-hours-mini{ display:flex; gap:8px; margin-bottom:12px; }
  .jhm{ flex:1; background:#F1EFE8; border-radius:6px; padding:6px 8px; }
  .jhm .l{ font-size:9.5px; text-transform:uppercase; color:var(--text-muted); letter-spacing:.05em; font-weight:700; }
  .jhm .n{ font-family:var(--mono); font-weight:700; font-size:12.5px; }
  .jhm .n.ok{ color:var(--good); }
  .jhm .n.warn{ color:var(--amber); }
  .jhm .n.over{ color:var(--safety); }
  .job-stats{ display:flex; gap:14px; border-top:1px solid var(--line); padding-top:10px; margin-top:2px;}
  .job-stat{ text-align:left; }
  .job-stat .n{ font-family:var(--mono); font-weight:700; font-size:17px; }
  .job-stat .n.warn{ color:var(--safety); }
  .job-stat .l{ font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; }

  /* ---------- Job header / tabs ---------- */
  .job-header{ margin-bottom:18px; }
  .breadcrumb{ font-size:12px; color:var(--text-muted); cursor:pointer; margin-bottom:8px; display:inline-flex; align-items:center; gap:5px;}
  .breadcrumb:hover{ color:var(--ink); }
  .job-title-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .job-title-row h2{ font-family:var(--disp); font-size:22px; margin:0; }
  .job-title-row .spacer{ flex:1 1 auto; }
  .job-layout{ display:flex; align-items:flex-start; gap:22px; }
  .tabs{ display:flex; flex-direction:column; gap:2px; margin-top:16px; flex:0 0 196px; border-right:1.5px solid var(--line); padding-right:2px; }
  .tab{
    padding:10px 14px; font-size:13px; font-weight:600; color:var(--text-muted); cursor:pointer;
    border-right:2.5px solid transparent; margin-right:-1.5px; white-space:nowrap; border-radius:6px 0 0 6px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .tab:hover{ background:var(--gray-dim); color:var(--ink); }
  .tab.active{ color:var(--ink); border-color:var(--safety); background:var(--card); box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .tab .count{ font-family:var(--mono); font-size:11px; background:var(--gray-dim); padding:1px 6px; border-radius:20px; margin-left:5px;}
  .job-body{ flex:1 1 auto; min-width:0; }

  .panel-head{ display:flex; justify-content:space-between; align-items:center; margin:20px 0 12px; flex-wrap:wrap; gap:8px;}
  .panel-head h3{ font-family:var(--disp); font-size:15px; margin:0; }

  .subtabs{ display:inline-flex; background:#F1EFE8; border-radius:8px; padding:3px; gap:2px; margin:4px 0 18px; flex-wrap:wrap; }
  .subtab{ padding:8px 14px; font-size:12.5px; font-weight:700; color:var(--text-muted); border-radius:6px; cursor:pointer; white-space:nowrap; }
  .subtab.active{ background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }

  /* ---------- Hours gauges ---------- */
  .hrs-summary{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin:14px 0; }
  .hrs-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; }
  .hrs-card-head{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:700; margin-bottom:9px; }
  .hrs-pct{ font-family:var(--mono); font-size:13px; }
  .hrs-pct.ok{ color:var(--good); }
  .hrs-pct.warn{ color:var(--amber); }
  .hrs-pct.over{ color:var(--safety); }
  .hrs-bar{ height:8px; border-radius:6px; background:var(--gray-dim); overflow:hidden; }
  .hrs-bar-fill{ height:100%; border-radius:6px; background:var(--steel); }
  .hrs-bar-fill.ok{ background:var(--good); }
  .hrs-bar-fill.warn{ background:var(--amber); }
  .hrs-bar-fill.over{ background:var(--safety); }
  .hrs-card-foot{ font-size:11px; color:var(--text-muted); margin-top:7px; font-family:var(--mono); }

  /* ---------- Specifications / submittals ---------- */
  .spec-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px; }
  .spec-card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .spec-section{ font-family:var(--mono); font-weight:700; font-size:13px; color:var(--steel-dark); letter-spacing:.03em; }
  .spec-title{ font-family:var(--disp); font-size:15px; margin:2px 0 0; }

  /* ---------- Table ---------- */
  table{ width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted);
    padding:10px 12px; border-bottom:1px solid var(--line); background:#F1EFE8; font-weight:700;
  }
  tbody td{ padding:11px 12px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:top; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#FBFAF7; }
  .idcell{ font-family:var(--mono); font-weight:700; font-size:12px; color:var(--steel); white-space:nowrap;}

  .badge{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.02em; white-space:nowrap;}
  .badge.pending{ background:var(--safety-dim); color:var(--safety-dark); }
  .badge.open{ background:var(--safety-dim); color:var(--safety-dark); }
  .badge.progress{ background:var(--gray-dim); color:var(--steel-dark); }
  .badge.closed, .badge.approved, .badge.costed{ background:#DCEBF6; color:var(--steel-dark); }
  .badge.converted{ background:var(--gray-dim); color:var(--gray-dark); }
  .badge.draft, .badge.rejected{ background:var(--gray-dim); color:var(--gray-dark); }
  .badge.sco{ background:var(--good-dim); color:var(--good-dark); }
  .badge.cat-note{ background:var(--gray-dim); color:var(--gray-dark); }
  .badge.cat-ineff{ background:var(--amber-dim); color:var(--amber-dark); }
  .badge.cat-hiccup{ background:var(--amber-dim); color:var(--amber-dark); }
  .badge.cat-delay{ background:var(--safety-dim); color:var(--safety-dark); }
  .badge.cat-equip{ background:var(--proc-dim); color:var(--proc-dark); }
  .badge.cat-coord{ background:var(--steel-dim); color:var(--steel-dark); }

  /* ---------- Forms / modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(18,24,31,.55); display:flex; align-items:flex-start;
    justify-content:center; padding:40px 16px; z-index:50; overflow-y:auto;
  }
  #topsearch-results mark{ background:var(--amber-dim); color:var(--ink); padding:0 1px; border-radius:2px; }
  #topsearch-results .section-title:first-child{ margin-top:0; }
  .modal{
    background:var(--card); border-radius:14px; width:100%; max-width:560px; padding:22px 24px 24px;
    border:1px solid var(--line);
  }
  .modal h3{ font-family:var(--disp); font-size:17px; margin:0 0 4px; }
  .modal .sub{ font-size:12.5px; color:var(--text-muted); margin:0 0 18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; border:1.5px solid var(--line); border-radius:8px; padding:9px 10px; font-size:13.5px;
    font-family:var(--sans); background:#fff; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--steel); }
  .field textarea{ resize:vertical; min-height:64px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field-row.three{ grid-template-columns:1fr 1fr 1fr; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
  .err{ color:var(--safety); font-size:12px; margin-top:4px; display:none; }
  .photo-drop{
    border:2px dashed var(--line-strong); border-radius:10px; padding:16px; text-align:center;
    cursor:pointer; font-size:12.5px; color:var(--text-muted); background:#FBFAF7;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .photo-drop:hover{ border-color:var(--steel); }
  .photo-drop.drag-over{ border-color:var(--steel); background:rgba(75,156,211,0.12); }
  .photo-drop .icon{ font-size:20px; }
  .photo-preview{ max-width:100%; max-height:180px; border-radius:8px; margin-top:10px; display:none; }

  .issue-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px;
    display:grid; grid-template-columns:76px 1fr auto; gap:14px; align-items:start; margin-bottom:10px;
  }
  .issue-card img.thumb{ width:76px; height:76px; object-fit:cover; border-radius:6px; border:1px solid var(--line); cursor:pointer;}
  .issue-card .noimg{
    width:76px; height:76px; border-radius:6px; background:var(--gray-dim); display:flex;
    align-items:center; justify-content:center; color:var(--text-muted); font-size:22px;
  }
  .issue-meta{ font-size:11.5px; color:var(--text-muted); margin-top:3px; }
  .issue-desc{ font-size:13.5px; margin:4px 0 6px; }
  .issue-actions{ display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  .cost-inline{ display:flex; gap:6px; align-items:center; }
  .cost-inline input{ width:100px; border:1.5px solid var(--line); border-radius:6px; padding:6px 8px; font-family:var(--mono); font-size:13px;}

  .log-entry{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px;}
  .log-entry .lmeta{ font-size:11px; color:var(--text-muted); font-family:var(--mono); margin-bottom:4px;}

  .kanban-board{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; align-items:start; }
  .kanban-col{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:10px; min-height:64px; transition:box-shadow .12s ease; }
  .kanban-col.drag-over{ box-shadow:inset 0 0 0 2px var(--steel); }
  .kanban-col-head{ font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--steel-dark); margin-bottom:8px; display:flex; justify-content:space-between; }
  .kanban-card{ background:var(--card); border:1.5px solid var(--line); border-left:4px solid var(--line-strong); border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
  .kanban-card:active{ cursor:grabbing; }
  .kanban-card.pri-low{ background:var(--good-dim); border-color:var(--good); }
  .kanban-card.pri-medium{ background:var(--amber-dim); border-color:var(--amber); }
  .kanban-card.pri-high{ background:var(--safety-dim); border-color:var(--safety); }
  /* ---- Post it Board (Feature I) — reuses the kanban drag/column mechanics
     above, but a horizontally-scrolling row of user-defined columns instead
     of a fixed 3-up grid, and real sticky-note styling on the cards. ---- */
  .postit-board{ display:flex; gap:14px; align-items:flex-start; overflow-x:auto; padding-bottom:6px; }
  .postit-col{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:10px; min-height:120px; width:250px; flex:0 0 250px; transition:box-shadow .12s ease; }
  .postit-col.drag-over{ box-shadow:inset 0 0 0 2px var(--steel); }
  .postit-col-head{ display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  .postit-col-head input{ font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--steel-dark); border:none; background:transparent; padding:2px 4px; flex:1; min-width:0; border-radius:4px; }
  .postit-col-head input:focus{ background:var(--card); outline:1.5px solid var(--steel-dim); }
  .postit-note{ border-radius:3px; padding:12px 12px 10px; margin-bottom:14px; font-family:var(--sans); font-size:13px; line-height:1.35; box-shadow:2px 4px 8px rgba(18,24,31,.16); cursor:grab; position:relative; word-break:break-word; }
  .postit-note:active{ cursor:grabbing; }
  .postit-note textarea{ width:100%; border:none; background:transparent; resize:vertical; font:inherit; color:inherit; min-height:52px; padding:0; }
  .postit-note textarea:focus{ outline:1px dashed rgba(18,24,31,.35); }
  .postit-note .postit-meta{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; opacity:.65; margin-bottom:4px; }
  .postit-note .postit-remove{ position:absolute; top:4px; right:6px; background:none; border:none; cursor:pointer; font-size:15px; line-height:1; opacity:.45; color:inherit; padding:2px; }
  .postit-note .postit-remove:hover{ opacity:.9; }
  /* Rotating pastels drawn straight from this app's own badge/priority
     palette (the same --*-dim tokens used everywhere else), not new colors,
     just cycled per note so the board doesn't look like one flat color. */
  .postit-note.pcol-0{ background:var(--amber-dim); transform:rotate(-2deg); }
  .postit-note.pcol-1{ background:var(--good-dim); transform:rotate(1.5deg); }
  .postit-note.pcol-2{ background:var(--gc-dim); transform:rotate(-1deg); }
  .postit-note.pcol-3{ background:var(--proc-dim); transform:rotate(2deg); }
  .postit-note.pcol-4{ background:var(--safety-dim); transform:rotate(-1.5deg); }
  .postit-note.pcol-5{ background:var(--gray-dim); transform:rotate(1deg); }
  .postit-note:hover{ transform:rotate(0deg) scale(1.02); box-shadow:3px 6px 14px rgba(18,24,31,.22); }
  .priority-chip{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; padding:2px 7px; border-radius:20px; flex-shrink:0; white-space:nowrap; }
  .priority-chip.pri-low{ background:var(--good); color:#fff; }
  .priority-chip.pri-medium{ background:var(--amber); color:#fff; }
  .priority-chip.pri-high{ background:var(--safety); color:#fff; }
  .eng-count-chip{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; background:var(--gray-dim); color:var(--gray-dark); display:inline-flex; align-items:center; gap:3px; }
  .eng-count-chip .icon{ width:.9em; height:.9em; flex-shrink:0; }
  .eng-count-chip.doing{ background:var(--amber-dim); color:var(--amber-dark); }
  .eng-count-chip.done{ background:var(--good-dim); color:var(--good-dark); }
  .eng-count-chip.delayed{ background:var(--safety-dim); color:var(--safety-dark); }
  .eng-count-chip.proc{ background:var(--proc-dim); color:var(--proc-dark); }
  .eng-job-card-active, .sched-job-card-active{ box-shadow:inset 0 0 0 2px var(--steel); }

  /* ---------- Team roster: tiered by role ---------- */
  .team-tier{ margin-bottom:18px; }
  .team-tier:last-child{ margin-bottom:0; }
  .team-tier-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .team-tier-count{ font-family:var(--mono); font-size:11px; color:var(--text-muted); background:var(--gray-dim); padding:2px 8px; border-radius:20px; }

  /* ---------- Calendar legend ---------- */
  .cal-legend{ margin:6px 0 4px; }
  .legend-row{ display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; }
  .legend-item{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; color:var(--text-muted); }
  .legend-swatch{ width:12px; height:12px; border-radius:3px; flex-shrink:0; display:inline-block; }

  .lightbox{ position:fixed; inset:0; background:rgba(18,24,31,.85); display:flex; align-items:center; justify-content:center; z-index:60; padding:24px; cursor:zoom-out;}
  .lightbox img{ max-width:100%; max-height:100%; border-radius:8px; }

  .section-title{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--steel-dark); margin:18px 0 6px; }
  .li-table{ width:100%; border-collapse:collapse; margin-bottom:6px; }
  .li-table th{ font-size:10px; text-transform:uppercase; color:var(--text-muted); text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); }

  .co-summary{ background:#F1EFE8; border-radius:8px; padding:12px 14px; margin-top:8px; }

  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin:14px 0; }

};
function icon(name, cls){
  return `<svg class="icon ${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]||''}</svg>`;
}

/* ===================== STATE ===================== */
/* `state` holds only the data every viewer shares (saved to data/state.json).
   `ui` holds this viewer's own navigation — never saved, never shared. */
let state = defaultState();
// previewRole (Feature A, "View as") is UI-only, like everything else on `ui` —
// never saved, never sent anywhere, always starts unset on a fresh load. See
// getEffectiveTeamMember/setPreviewRole/exitPreview near Team & identity below.
let ui = { view: 'home', jobId: null, tab: 'overview', costSubTab: 'impacts', coView: 'cards', specsView: 'cards', scheduleMonth: currentMonthStr(), homeMonth: currentMonthStr(), overviewCalMonth: currentMonthStr(), overviewCalMode: 'field', searchScope: 'all', engFilterJobId: '', schedFilterJobId: '', mpHoursPerDay: 8, opsCalJobId: '', opsCalMonth: currentMonthStr(), opsCalMode: 'field', superSchedMonth: currentMonthStr(), jobLogAuthor: '', jobLogBucket: '', previewRole: null,
  // Bug fix (View As): Foreman/Project Manager preview needs a SPECIFIC real
  // person picked, since their visibility is id-based — see
  // getEffectiveTeamMember/setPreviewMemberId. Reset alongside previewRole
  // any time the role changes or preview exits (setPreviewRole/exitPreview/
  // setCurrentTeamMember) so a stale pick never carries into a new preview.
  previewMemberId: null,
  // Superintendent's consolidated home calendar (scope + type toggle, shares
  // renderRoleCalendarSection with Operations' calendar above) — month reuses
  // superSchedMonth above rather than a redundant key. jobId '' means "all jobs".
  superCalJobId: '', superCalMode: 'field',
  // Engineering Manager's home-screen drafting-only calendar (all jobs, no
  // scope/type toggle needed — it only ever shows engineering dates).
  engCalMonth: currentMonthStr(),
  // Team roster inline edit — which member row (by id) is currently showing
  // the edit form in place of its normal row, or null when none is.
  editingTeamMemberId: null,
  // Feature F: Procurement tab's own compact calendar, and the Project
  // Manager home-screen large calendar (mirrors opsCal* above, but scoped
  // to the PM's own assigned jobs — see renderPMCalendarSection).
  procCalMonth: currentMonthStr(), pmCalJobId: '', pmCalMonth: currentMonthStr(), pmCalMode: 'field',
  // Feature D: Field Tool Kit's JHA quick-add hands the Safety Docs category
  // field a one-time prefill, consumed and cleared the first time it renders.
  safetyCategoryPrefill: '',
  // Feature G: Notes category filter added to the Log & Notes page, purely
  // additive alongside the existing author/bucket filters.
  jobLogCategory: '',
  // Feature P: PM's cross-job Notes overview (home screen) — search text and
  // group/sort mode, mirroring the Log & Notes page's own filter pattern.
  pmNotesSearch: '', pmNotesSort: 'date' };
// A Project Manager's home screen only shows jobs they're assigned to
// (job.assignedPMs — a job can have more than one PM, mirroring Foremen),
// and a Foreman's only shows jobs they're assigned to (job.assignedForemen —
// a job can have more than one Foreman). Every other role, and no identity
// selected at all, sees every job — unless a per-person job-visibility
// override says otherwise (see "Per-person job-visibility overrides" near
// canManageTabOverrides below). roleDefaultJobVisible holds the pure
// role-based rule with no override applied — kept as its own function, same
// reason roleDefaultTabAllowed is: so the job-visibility settings panel can
// show "what would this person see with no override" next to what they
// actually see now. isJobVisible layers the per-person override on top,
// mirroring roleDefaultTabAllowed/tabAllowedForCurrentUser exactly.
function roleDefaultJobVisible(jobId, member){
  const job = getJob(jobId);
  if(!job) return false;
  if(member.role==='Project Manager') return (job.assignedPMs||[]).includes(member.id);
  if(member.role==='Foreman') return (job.assignedForemen||[]).includes(member.id);
  return true;
}
function isJobVisible(jobId){
  const me = getEffectiveTeamMember();
  if(!me) return true;
  const roleDefault = roleDefaultJobVisible(jobId, me);
  if(me.__isPreview) return roleDefault; // never apply personal overrides to a preview clone — same guard as tabAllowedForCurrentUser
  if(me.jobOverrides && Object.prototype.hasOwnProperty.call(me.jobOverrides, jobId)) return !!me.jobOverrides[jobId];
  return roleDefault;
}
function visibleJobs(){ return state.jobs.filter(j=>isJobVisible(j.id)); }

/* ---- Per-job color coding: a stable, distinct color per job (by job ID, sorted)
   so multi-job views — the combined calendar, and the Engineering/Schedule "all
   jobs" overviews — are easy to tell apart at a glance. Cycles through the palette
   if there are more jobs than swatches. Purely a visual aid, not stored data. */
const JOB_COLOR_PALETTE = ['#2E7DD1','#D1562E','#3FA34D','#9B59B6','#C7A62E','#2EA3A3','#D14E8C','#6B7FD1','#A3762E','#5FA82E','#D12E4E','#4E7A9E','#8C4EA8','#2E9E7A','#C77B2E','#7A5FD1'];
function jobColor(jobId){
  const ids = state.jobs.slice().sort((a,b)=>a.id.localeCompare(b.id)).map(j=>j.id);
  let idx = ids.indexOf(jobId);
  if(idx<0) idx = 0;
  return JOB_COLOR_PALETTE[idx % JOB_COLOR_PALETTE.length];
}

// Nucleus has no roster or login — anyone with the link has full access, PM or
// foreman alike. To make repeated field entries less tedious without reintroducing
// a login system, this device remembers the last name typed into any "Your name"
// field (localStorage, per-device only — never synced or shown to anyone else) and
// pre-fills it next time. rememberName() is called from each submit function that
// reads one of those fields.
const NAME_STORAGE_KEY = 'nucleus-your-name';
let currentUserName = '';
try{ currentUserName = localStorage.getItem(NAME_STORAGE_KEY) || ''; }catch(e){ /* private mode, etc. */ }
function rememberName(name){
  if(!name || name===currentUserName) return;
  currentUserName = name;
  try{ localStorage.setItem(NAME_STORAGE_KEY, name); }catch(e){ /* private mode, etc. */ }
}

/* ---- Team & identity ----
   The Team section (top of the home screen) is the actual roster: name + role.
   Each device picks "who you are" from the top-bar dropdown — this is still not a
   login (no password, nothing stops anyone from picking someone else), but it's a
   real identity for two things: (1) auto-filling "Your name" fields, same as before,
   and (2) a Project Manager's dashboard only shows jobs assigned to them. Every
   other role sees every job, same as always. */
const TEAM_ROLES = ['Operations Manager','App Manager','Project Manager','Engineering Manager','Superintendent','Foreman'];
function roleClass(role){
  if(role==='Operations Manager') return 'role-ops';
  if(role==='App Manager') return 'role-appmgr';
  if(role==='Project Manager') return 'role-pm';
  if(role==='Foreman') return 'role-foreman';
  if(role==='Superintendent') return 'role-super';
  if(role==='Engineering Manager') return 'role-eng';
  return 'role-pm';
}
const TEAM_ID_STORAGE_KEY = 'nucleus-current-team-member';
let currentTeamMemberId = '';
try{ currentTeamMemberId = localStorage.getItem(TEAM_ID_STORAGE_KEY) || ''; }catch(e){ /* private mode, etc. */ }
function getCurrentTeamMember(){
  return state.team.find(m=>m.id===currentTeamMemberId) || null;
}
function setCurrentTeamMember(id){
  currentTeamMemberId = id || '';
  try{ localStorage.setItem(TEAM_ID_STORAGE_KEY, currentTeamMemberId); }catch(e){ /* private mode, etc. */ }
  const m = getCurrentTeamMember();
  if(m && m.name) rememberName(m.name);
  // Switching who's actually signed in always drops any active preview — a
  // preview is only ever meaningful relative to the App Manager who started
  // it (see getEffectiveTeamMember), and it must never survive an identity
  // change and silently apply to someone else.
  ui.previewRole = null;
  ui.previewMemberId = null;
  if(ui.view==='job' && ui.jobId && !isJobVisible(ui.jobId)) goHome();
  else render();
}
/* ---- Feature A: "View as" role preview, App Manager only ----
   A pure client-side, look-only simulation of what another role's tab
   visibility and home-screen filtering looks like — never a real account
   switch, never persisted (ui.previewRole lives only on the never-saved
   `ui` object), and never allowed to affect what a write records as its
   author or what passes a write-permission check (client or server side).
   getEffectiveTeamMember() is what every VISIBILITY/FILTERING check should
   call from here on (isJobVisible, tabAllowedForCurrentUser, renderJob's
   isForeman flag, the Operations-Manager/Superintendent-only home calendar
   sections) — anything that WRITES data keeps calling getCurrentTeamMember()
   (the real, server-verified identity) directly, unchanged. Note: on this
   self-hosted build, Costs/Contract/Budget-and-Costs data is also filtered
   SERVER-SIDE by role (see server/roles.js) before it ever reaches the
   browser — previewing as another role correctly shows/hides the right
   TABS, but if the real signed-in App Manager's own account has no
   Costs/Contract visibility server-side, the dollar figures inside those
   tabs may already be stripped from the state this browser received, and
   no client-side preview can bring back data the server never sent. That's
   expected, not a bug — it's exactly what makes the server-side filtering
   real enforcement instead of a UI suggestion. */
function getEffectiveTeamMember(){
  const real = getCurrentTeamMember();
  if(real && real.role==='App Manager' && ui.previewRole){
    if(ui.previewRole==='none') return null; // previewing "no role selected"
    // Bug fix: Foreman and Project Manager visibility is ID-based
    // (job.assignedForemen/assignedPMs — see roleDefaultJobVisible), not
    // role-based. A role-only preview clone always kept the App Manager's
    // OWN id, and no job's assignedForemen/assignedPMs will ever contain
    // that id, so previewing either of these two roles ALWAYS showed zero
    // jobs regardless of real data — this is exactly what confused Greg
    // ("View as -> Foreman" showed nothing even though Rye Vierra, a real
    // Foreman, is genuinely assigned to three jobs). Fix: for these two
    // roles, require picking a SPECIFIC real team member of that role
    // (ui.previewMemberId, set via the second "View as" select — see
    // updateViewAsControl/setPreviewMemberId) and clone THEIR real id, so
    // the id-based check resolves against real assignment data — while
    // still forcing role to the previewed role, dropping tabOverrides, and
    // marking __isPreview, exactly like the plain role-preview clone below.
    // This stays a "role default" look, not a full impersonation of that
    // person's own tabOverrides/jobOverrides — deliberate, unchanged design,
    // see "Per-person tab overrides" and "Per-person job-visibility
    // overrides" for why previews never pick up anyone's personal overrides.
    if(ui.previewRole==='Foreman' || ui.previewRole==='Project Manager'){
      const picked = ui.previewMemberId ? state.team.find(m=>m.id===ui.previewMemberId && m.role===ui.previewRole) : null;
      if(!picked){
        // No specific person chosen yet (or none exist with this role): an
        // unresolved preview. id stays null on purpose — every id-based
        // visibility check then correctly resolves to "sees nothing"
        // instead of silently matching the App Manager's own id, and
        // __previewUnresolved lets renderHome show an explicit "pick
        // someone" message for this state instead of a silent empty jobs
        // list (see renderHome's jobs.length===0 branch) — that silent-empty
        // behavior is exactly what confused Greg in the first place.
        return { id: null, role: ui.previewRole, tabOverrides: null, jobOverrides: null, __isPreview: true, __previewUnresolved: true };
      }
      return Object.assign({}, picked, { role: ui.previewRole, tabOverrides: null, __isPreview: true });
    }
    // Role-preview clone: a role swap only, not a specific real person — so it
    // deliberately drops tabOverrides (the real App Manager's own personal
    // per-tab overrides must never leak into a preview of another role) and
    // carries __isPreview so every visibility check below can branch on it
    // explicitly rather than relying only on the missing field.
    return Object.assign({}, real, { role: ui.previewRole, tabOverrides: null, __isPreview: true });
  }
  return real;
}

  ui.previewRole = role || null;

function updateViewAsControl(){

  const sel = document.getElementById('viewas-select');
  if(sel) sel.value = ui.previewRole || '';
  // Bug fix: Foreman/Project Manager previews need a specific real person

  // only for those two roles, and show an explicit inline message instead
  // of silence when nobody's on the team with that role yet, or nobody's

  const memberSel = document.getElementById('viewas-member-select');

      if(msg){
        if(!candidates.length){ msg.hidden = false; msg.textContent = `No ${plural} on the team yet to preview.`; }
        else if(!ui.previewMemberId){ msg.hidden = false; msg.textContent = `Pick a ${ui.previewRole} to preview their job visibility.`; }
        else msg.hidden = true;

  }
  const banner = document.getElementById('preview-banner');

  }
}
/* Once someone's signed in with their own account (or SSO), their identity is
   REAL and verified — not something to let them casually swap in a dropdown.
   verifiedIdentity (set at login, and re-confirmed on every boot() via
   /api/me) drives this: matched to a Team roster entry -> lock the select to
   just that one, disabled; signed in but not yet on the roster -> show that
   plainly instead of a picker, so it's obvious what to fix rather than
   silently showing "Not signed in". The open picker only remains as a
   fallback for the (should-be-rare) case of no verified identity at all. */
function updateIdentitySelect(){
  const sel = document.getElementById('identity-select');
  if(!sel) return;
  const members = state.team.slice().sort((a,b)=>a.name.localeCompare(b.name));
  if(verifiedIdentity && verifiedIdentity.matched && verifiedIdentity.teamMemberId){
    sel.innerHTML = `<option value="${verifiedIdentity.teamMemberId}">${esc(verifiedIdentity.name)} — ${esc(verifiedIdentity.role)}</option>`;
    sel.value = verifiedIdentity.teamMemberId;
    sel.disabled = true;
    sel.title = 'Signed in as ' + verifiedIdentity.email + ' — identity comes from your login now, not a picker.';
    return;
  }
  if(verifiedIdentity && !verifiedIdentity.matched){
    sel.innerHTML = `<option value="">${esc(verifiedIdentity.email)} — no role assigned yet</option>`;
    sel.value = '';
    sel.disabled = true;
    sel.title = 'Signed in as ' + verifiedIdentity.email + ' but not yet on the Team roster below — add this exact email there to get a role.';
    return;
  }
  sel.disabled = false;
  sel.title = 'Choose who you are. A Project Manager\'s dashboard then only shows jobs assigned to them, and a Foreman only sees Scope, Specs, Elevations, Contacts, RFIs, PM Requests For Field, Schedule, Procurement, Notes, and After Action Report. Add people on the Team section on the home screen.';
  sel.innerHTML = `<option value="">Not signed in</option>` + members.map(m=>`<option value="${m.id}">${esc(m.name)} — ${esc(m.role)}</option>`).join('');
  sel.value = (currentTeamMemberId && members.some(m=>m.id===currentTeamMemberId)) ? currentTeamMemberId : '';
}

   above: nothing stops someone from switching identity in the dropdown, there's

   selected) still sees every tab, same as before. */
// 'logs' was removed from this order — Field Logs moved into the "Log &
// Notes" reference page (see renderAllLogsPage below), reached via its own
// button in the job header rather than as a tab, so it's not a candidate
// for the "first allowed tab" redirect either. 'cos' (Change orders) was
// removed too — it's now a sub-tab of Costs, not a top-level tab (see
// renderCosts/renderCos below and the Feature E comment there).

// firstAllowedTab() below walks this array in order and lands on the first
// tab a Foreman is allowed into, so putting it first makes it the tab a
// Foreman opens into by default — matching Greg's ask to make fast field
// navigation the landing spot, since that's the whole point of this tab.

// tries 'overview' first — see openJob/renderJob — and only Foreman is ever

const JOB_TAB_ORDER = ['fieldkit','overview','scope','specs','elevations','contacts','rfis','costs','budgetcosts','contract','hours','requests','engineering','schedule','procurement','safety','welding','watertest','notes','meetingminutes','aar'];
// 'elevations' and 'costs' were REMOVED from this list per Greg's request:
// "Take away costs and elevations on the side bar for Foreman. They should
// have everything in their Field Tool Kit section." A Foreman no longer gets
// either as a standalone sidebar tab — but loses nothing, because Field Tool
// Kit now renders the full Elevation tracker and the full (no-dollar-amounts)
// Cost Impacts view directly inline using the exact same render functions
// (renderElevations/renderIssues) instead of linking out to these tab ids —
// see renderFieldToolKit and fieldKitEmbedAllowed below. Both keys stay
// meaningful even though they're off by default here: an App Manager/
// Operations Manager can still grant either back to one specific Foreman as a
// real standalone tab via that person's tabOverrides (see "Per-person tab

const FOREMAN_ALLOWED_TABS = ['fieldkit','scope','specs','contacts','rfis','requests','schedule','procurement','safety','welding','watertest','notes','meetingminutes','aar','alllogs'];
// "Contract" (contract + Green Sheet documents, and the budget-by-system table keyed

// as everywhere else in Team & roles: this is a device-level filter, not real security.
const CONTRACT_TAB_ALLOWED_ROLES = ['Operations Manager','Project Manager'];
// Every tab a per-person override can target — JOB_TAB_ORDER plus 'alllogs'
// (the "Log & Notes" job-header button, gated through this exact same
// tabAllowedForCurrentUser() machinery even though it isn't one of the
// tab-bar entries). Labels match the tab bar / job header exactly.
const OVERRIDABLE_TABS = [
  {key:'fieldkit', label:'Field Tool Kit'},

  {key:'scope', label:'Scope'},
  {key:'specs', label:'Specs'},
  {key:'elevations', label:'Elevations'},
  {key:'contacts', label:'Contacts'},
  {key:'rfis', label:'RFIs'},
  {key:'costs', label:'Costs'},
  {key:'budgetcosts', label:'Budget and Costs'},
  {key:'contract', label:'Contract'},
  {key:'hours', label:'Hours'},
  {key:'requests', label:'PM Requests For Field'},
  {key:'engineering', label:'Engineering'},
  {key:'schedule', label:'Schedule'},
  {key:'procurement', label:'Procurement'},
  {key:'safety', label:'Safety Docs'},

// The role-based default for a tab, with no per-person override applied.
// Kept as its own function so the tab-overrides settings panel can show
// "what would this person see with no override" next to what they see now.
function roleDefaultTabAllowed(tabKey, role){
  if(tabKey==='contract' || tabKey==='budgetcosts') return !!role && CONTRACT_TAB_ALLOWED_ROLES.includes(role);
  if(role==='Foreman') return FOREMAN_ALLOWED_TABS.includes(tabKey);

/* ---- Per-person tab overrides (App Manager / Operations Manager only) ----
   Greg: "for App manager and Operations manager put a settings option to
   turn on or off sections for each individual to make it easier for what
   each person can view." Each team member can carry a `tabOverrides` map,
   e.g. {costs:false, engineering:true} — a key PRESENT forces that tab ON or
   OFF for that specific person regardless of their role's default; a key
   ABSENT means "use the role default," unchanged from before this feature.
   This is a true two-way override tied to a specific person's team-member
   id, not to a role in the abstract.
   Critical interaction with "View as": a View-As role-preview clone from
   getEffectiveTeamMember() is a shallow clone of the REAL signed-in App
   Manager with just the role swapped — no specific real person is being
   simulated, so it must NEVER pick up the real App Manager's own personal
   tabOverrides. getEffectiveTeamMember() marks that clone with __isPreview
   and strips tabOverrides from it; tabAllowedForCurrentUser below branches on
   __isPreview so a preview clone always resolves to a pure role-default
   view, and only a real, specific signed-in person's own overrides are ever
   applied. Persisted the normal way this app persists team member data —
   through the same updateTeamMember reducer/commit path already used for
   name/role/email edits, so it round-trips through /api/state exactly like
   everything else (see the `updateTeamMember` case in applyOp). */
function openSetPasswordModal(memberId){
  if(readOnly) return;
  const m = state.team.find(x=>x.id===memberId);
  if(!m) return;
  if(!m.email){ alert("This person needs a work email on their Team entry before you can set a login for them."); return; }
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.dataset.teamMemberId = memberId;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  overlay.innerHTML = setPasswordModalHTML(m);
  document.body.appendChild(overlay);
  const input = document.getElementById('set-password-input');
  if(input) input.focus();
}
function setPasswordModalHTML(m){
  return `<div class="modal" style="max-width:420px;">
    <h3>Set login for ${esc(m.name)}</h3>
    <p class="sub" style="margin-top:0;">Sets or resets the password for <strong>${esc(m.email)}</strong>. Share it with them directly — they can change it themselves afterward (top bar → Change password).</p>
    <div class="field"><label>New password</label>
      <input type="password" id="set-password-input" placeholder="At least 8 characters" autocomplete="new-password">
    </div>
    <div class="err" id="set-password-err"></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
      <button class="btn safety" id="set-password-submit" onclick="submitSetPassword()">Save password</button>
    </div>
  </div>`;
}
async function submitSetPassword(){
  const overlay = document.querySelector('.modal-overlay');
  const memberId = overlay ? overlay.dataset.teamMemberId : null;
  const m = memberId ? state.team.find(x=>x.id===memberId) : null;
  const input = document.getElementById('set-password-input');
  const errEl = document.getElementById('set-password-err');
  const btn = document.getElementById('set-password-submit');
  if(!m || !m.email) return;
  const password = input ? input.value : '';
  if(password.length < 8){ if(errEl){ errEl.textContent = 'Password must be at least 8 characters.'; errEl.style.display='block'; } return; }
  if(btn) btn.disabled = true;
  try{
    const res = await authFetch('/api/accounts/set-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email:m.email, password}) });
    if(!res.ok){
      const data = await res.json().catch(()=>({}));
      if(errEl){ errEl.textContent = data.message || "Couldn't set that password — try again."; errEl.style.display='block'; }
      if(btn) btn.disabled = false;
      return;
    }
    closeModal();
  }catch(e){
    if(errEl){ errEl.textContent = "Couldn't reach the server — check your connection and try again."; errEl.style.display='block'; }
    if(btn) btn.disabled = false;
  }
}

function tabAllowedForCurrentUser(tabKey){
  const me = getEffectiveTeamMember();
  const role = me ? me.role : null;
  const roleDefault = roleDefaultTabAllowed(tabKey, role);
  if(!me || me.__isPreview) return roleDefault; // no identity, or a View-As preview clone: role default only, never personal overrides
  if(me.tabOverrides && Object.prototype.hasOwnProperty.call(me.tabOverrides, tabKey)) return !!me.tabOverrides[tabKey];
  return roleDefault;
}
function firstAllowedTab(){
  return JOB_TAB_ORDER.find(t=>tabAllowedForCurrentUser(t)) || 'scope';
}
// Who can open the per-person tab-visibility settings panel — App Manager or
// Operations Manager, checked against verifiedIdentity (the real,
// server-verified signed-in identity — the same source canManageLogins/
// canManageTeam already use in renderTeamSection), so a View-As preview can
// never grant this ability to anyone previewing as one of those roles — only
// actually BEING one, for real (and actually signed in as them), opens it.
// Deliberately a wider check than canManageTeam (App-Manager-only, plus the
// empty-roster bootstrap exception) right next to it in the roster row — not
// a loosening of that gate, a distinct, broader one for a distinct ability.
function canManageTabOverrides(){
  return !!(verifiedIdentity && verifiedIdentity.matched && (verifiedIdentity.role==='App Manager' || verifiedIdentity.role==='Operations Manager'));
}

   Manager only) ----

   each individual can review" — particularly useful for roles like
   Operations Manager, Superintendent, and Engineering Manager, which
   currently see every job with no filtering at all (unlike Project Manager/
   Foreman, whose visibility is already scoped by job.assignedPMs/
   assignedForemen — see roleDefaultJobVisible up near isJobVisible). Each

   getEffectiveTeamMember above) — is always marked __isPreview and never

function canManageJobOverrides(){

/* ---- Global keyword search — across the whole app or just the open job.
   Read-only: it only searches text fields (never $ amounts), so it needs no
   extra permission gating beyond the job-visibility every tab already respects. ---- */
function searchHighlight(text, q){
  const t = text || '';
  if(!q) return esc(t);
  const idx = t.toLowerCase().indexOf(q.toLowerCase());
  if(idx===-1) return esc(t);
  return esc(t.slice(0,idx)) + '<mark>' + esc(t.slice(idx, idx+q.length)) + '</mark>' + esc(t.slice(idx+q.length));
}
function searchApp(query){
  const q = query.trim().toLowerCase();
  const scopedToJob = (ui.searchScope==='job' && ui.jobId);
  const scopeJobIds = scopedToJob ? [ui.jobId] : visibleJobs().map(j=>j.id);
  const inScope = jobId => scopeJobIds.includes(jobId);
  const matches = (...vals) => vals.filter(Boolean).some(v=>String(v).toLowerCase().includes(q));
  const jobLabel = jobId => { const j=getJob(jobId); return j ? `${j.id} — ${j.name}` : jobId; };
  const groups = [];
  function pushGroup(label, items){ if(items.length) groups.push({label, items: items.slice(0,8)}); }

  if(!scopedToJob){
    pushGroup('Jobs', visibleJobs().filter(j=>matches(j.id,j.name,j.gc,j.address))
      .map(j=>({jobId:j.id, tab:'overview', title:`${j.id} — ${j.name}`, snippet:[j.gc,j.address].filter(Boolean).join(' · ')})));
  }
  pushGroup('RFIs', state.rfis.filter(r=>inScope(r.jobId) && matches(r.id,r.subject,r.submittedTo,r.gcRfiNumber))
    .map(r=>({jobId:r.jobId, tab:'rfis', title:`${r.id} — ${r.subject}`, snippet:jobLabel(r.jobId)})));
  pushGroup('Change orders', state.cos.filter(c=>inScope(c.jobId) && matches(coNumber(c),c.id,c.description,c.notes,c.gcNumber,c.scoNumber))
    .map(c=>({jobId:c.jobId, tab:'cos', title:`${c.id} — ${c.description}`, snippet:jobLabel(c.jobId)})));
  pushGroup('Cost impacts', state.issues.filter(i=>inScope(i.jobId) && matches(i.id,i.description,i.category,i.reportedBy))
    .map(i=>({jobId:i.jobId, tab:'costs', title:`${i.id} — ${i.description}`, snippet:jobLabel(i.jobId)})));
  pushGroup('PM Requests For Field', state.requests.filter(r=>inScope(r.jobId) && matches(r.id,r.title,r.description,r.requestedBy))
    .map(r=>({jobId:r.jobId, tab:'requests', title:`${r.id} — ${r.title}`, snippet:jobLabel(r.jobId)})));
  pushGroup('Notes', state.notes.filter(n=>inScope(n.jobId) && matches(n.text,n.author,n.category))
    .map(n=>({jobId:n.jobId, tab:'notes', title:n.text, snippet:jobLabel(n.jobId)+(n.author?` · ${n.author}`:'')+(n.category?` · ${n.category}`:'')})));
  pushGroup('Logs', state.logs.filter(l=>inScope(l.jobId) && matches(l.note,l.author))
    .map(l=>({jobId:l.jobId, tab:'alllogs', title:l.note, snippet:jobLabel(l.jobId)+(l.author?` · ${l.author}`:'')})));
  pushGroup('Elevations', state.elevations.filter(el=>inScope(el.jobId) && (matches(el.id,el.name,el.drawingRef,el.notes) || (el.foremanNotes||[]).some(n=>matches(n.text))))
    .map(el=>({jobId:el.jobId, tab:'elevations', title:`${el.id} — ${el.name}`, snippet:jobLabel(el.jobId)})));
  pushGroup('Contacts', state.contacts.filter(c=>inScope(c.jobId) && matches(c.name,c.company,c.role))
    .map(c=>({jobId:c.jobId, tab:'contacts', title:`${c.name}${c.company?' — '+c.company:''}`, snippet:jobLabel(c.jobId)+(c.role?` · ${c.role}`:'')})));

      .map(d=>({jobId:j.id, tab:'budgetcosts', title:d.name, snippet:jobLabel(j.id)+' · Green Sheet document'})))));

  return groups;
}
function renderSearchResultsHTML(query, q){
  const trimmed = query.trim();
  if(trimmed.length < 2) return `<div class="issue-meta" style="padding:8px 2px;">Type at least 2 characters…</div>`;
  const groups = searchApp(trimmed);
  if(groups.length===0) return `<div class="empty" style="padding:24px;">${icon('helpCircle')}No matches for "${esc(trimmed)}".</div>`;
  return groups.map(g=>`
    <div class="section-title">${esc(g.label)}</div>
    ${g.items.map(it=>`
      <div class="log-entry" style="cursor:pointer;" onclick="goToSearchResult('${it.jobId}','${it.tab}')">
        <div style="font-weight:700; font-size:13.5px;">${searchHighlight(it.title, q)}</div>
        ${it.snippet ? `<div class="issue-meta">${esc(it.snippet)}</div>` : ''}
      </div>`).join('')}
  `).join('');
}
/* ---- Persistent search row ----
   Used to be a "Search" button in the top bar that opened a modal
   (searchModalHTML/openSearch/closeSearch). Per Greg's request, the entry
   point is now a second, always-visible row under the top bar with a real
   text input — no button/modal to open first. The actual search logic
   (searchApp above) and its results rendering (renderSearchResultsHTML
   above) are reused completely unchanged; only what drives them and where
   the results appear is new. Results show as a live dropdown anchored under
   the row, shown while the input has anything typed in it and hidden again
   on Escape, on picking a result, or on clicking/tabbing away. */
function searchScopeControlHTML(){
  const job = (ui.view==='job' && ui.jobId) ? getJob(ui.jobId) : null;
  if(!job) return '';
  return `<button type="button" class="${ui.searchScope==='job'?'active':''}" onclick="setTopSearchScope('job')">This job (${esc(job.id)})</button>
    <button type="button" class="${ui.searchScope==='all'?'active':''}" onclick="setTopSearchScope('all')">All jobs</button>`;
}
function renderSearchScopeButtons(){
  const wrap = document.getElementById('search-row-scope');
  if(wrap) wrap.innerHTML = searchScopeControlHTML();
}
// Called from render() (so it's always current) — keeps the scope toggle in
// sync with whatever job (if any) is currently open, and forces scope back
// to "all" once there's no job left to scope to (can't stay "This job" with
// no job open). Deliberately does NOT reset scope to "job" just because a
// job is open — that would fight a deliberate "All jobs" pick every time
// something elsewhere on the page triggers a re-render. That reset instead
// happens once, on a fresh focus of the input (see onTopSearchFocus) — the
// same moment the old Search button's modal used to recompute its default
// scope every time it was opened.
function updateSearchScopeControl(){
  const wrap = document.getElementById('search-row-scope');
  if(!wrap) return;
  const job = (ui.view==='job' && ui.jobId) ? getJob(ui.jobId) : null;
  if(!job) ui.searchScope = 'all';
  renderSearchScopeButtons();
  const inp = document.getElementById('topsearch-input');
  if(inp && inp.value.trim()) onTopSearchInput(inp.value);
}
function setTopSearchScope(scope){
  ui.searchScope = scope;
  renderSearchScopeButtons();
  const inp = document.getElementById('topsearch-input');
  if(inp){ inp.value ? onTopSearchInput(inp.value) : null; inp.focus(); }
}
function showTopSearchResults(){
  const wrap = document.getElementById('topsearch-results-wrap');
  if(wrap) wrap.hidden = false;
}
function hideTopSearchResults(){
  const wrap = document.getElementById('topsearch-results-wrap');
  if(wrap) wrap.hidden = true;
}
function onTopSearchFocus(){
  const wrap = document.getElementById('topsearch-results-wrap');
  const freshOpen = !wrap || wrap.hidden;
  if(freshOpen){
    // Same default the old Search button's modal picked every time it was
    // opened: scoped to the current job if you're on one, all jobs otherwise.
    const job = (ui.view==='job' && ui.jobId) ? getJob(ui.jobId) : null;
    ui.searchScope = job ? 'job' : 'all';
    renderSearchScopeButtons();
  }
  const inp = document.getElementById('topsearch-input');
  if(inp && inp.value) onTopSearchInput(inp.value);
}
function onTopSearchBlur(){
  // Clicking a result (or the scope toggle) blurs the input too — delay
  // the hide just long enough for that click's own handler to run first
  // (setTopSearchScope/goToSearchResult), and skip hiding entirely if
  // focus already landed back on the input (setTopSearchScope refocuses it).
  setTimeout(()=>{
    if(document.activeElement !== document.getElementById('topsearch-input')) hideTopSearchResults();
  }, 150);
}
function topSearchKeydown(e){
  if(e.key==='Escape'){ hideTopSearchResults(); e.target.blur(); }
}
function onTopSearchInput(val){
  const results = document.getElementById('topsearch-results');
  if(results) results.innerHTML = renderSearchResultsHTML(val, val.trim());
  if(val) showTopSearchResults(); else hideTopSearchResults();
}
function goToSearchResult(jobId, tab){
  hideTopSearchResults();
  const inp = document.getElementById('topsearch-input');
  if(inp) inp.value = '';
  // Feature E: 'cos' (Change orders) is a search-result tab id inherited
  // from when it was a top-level tab — it now lives as the "changeorders"
  // sub-tab of Costs, so route it there instead of a dead top-level tab id.
  if(tab==='cos'){ openJob(jobId, 'costs'); ui.costSubTab = 'changeorders'; render(); return; }
  openJob(jobId, tab || 'overview');
}

/* This build talks to a small server (server/index.js) instead of Claude's
   Artifact runtime — GET/POST /data/state.json and /api/state, guarded by a
   bearer token from /api/login. See AUTH below for the sign-in gate. */
const STATE_FILE = '/data/state.json';
const MAX_STATE_BYTES = 15 * 1024 * 1024; // headroom under the server's 20MB request cap
let saveTimer = null;
let saveInFlight = false;
let saveQueued = false;
let readOnly = false;
let stateVersion = 0;
let pollTimer = null;

function defaultState(){ return { jobs: [], rfis: [], cos: [], issues: [], logs: [], hours: [], contacts: [], scope: [], specs: [], submittals: [], invoices: [], projectedCosts: [], schedule: [], notes: [], requests: [], elevations: [], procurement: [], ganttLogs: [], scheduleUpdates: [], engineering: [], scheduleFieldNotes: [], team: [], aar: [], gcCommLog: [], greenSheets: [], materials: [], greenSheetQuotes: [], standards: [], safetyDocs: [], weldingProcedures: [], waterTests: [], elevationMarkups: [], equipmentLog: [], dailyReports: [], postItBoards: [], meetingMinutes: [], notifications: [] }; }
// Migration: legacy single-PM assignment (job.assignedPM, one team-member
// id) -> multi-PM array (job.assignedPMs), mirroring how assignedForemen has
// always worked. Called everywhere `state` gets reassigned from a fresh
// server load (initial boot, a 409-conflict reload, and the background
// poll) so a legacy job gets normalized the moment it's seen, however it
// arrives. Idempotent, so harmless to call more than once.
function migrateAssignedPMs(s){
  (s.jobs||[]).forEach(j=>{
    if(!Array.isArray(j.assignedPMs)) j.assignedPMs = j.assignedPM ? [j.assignedPM] : [];
    if('assignedPM' in j) delete j.assignedPM;
  });
  return s;
}
// Migration: Post-it category dropdown changed from Discuss/Call/Order/
// Important/General (Operations-Manager-only) to Call/Reminder/Discuss/
// Order (every role, now also driving the note's color — see
// POSTIT_TYPES/POSTIT_TYPE_COLOR and postitNoteHTML further down). Remap
// old values onto the new set so nothing shows blank or an option the
// <select> no longer offers: General, and blank (every non-Ops-Manager
// note before this change), fold into Discuss; Important -> Reminder as
// the closest match ("don't lose track of this"); Call/Discuss/Order
// carry straight over since they're unchanged. Called right after `state`
// is (re)assigned at the same three points as migrateAssignedPMs above —
// same simple-rename pattern, harmless to call more than once, no forced
// save needed since re-running it against an already-migrated value is a
// no-op.
function migratePostitTypes(s){
  const POSTIT_TYPE_MIGRATE = { General:'Discuss', Important:'Reminder' };
  (s.postItBoards||[]).forEach(b=>{
    (b.notes||[]).forEach(n=>{
      if(!POSTIT_TYPES.includes(n.type)) n.type = POSTIT_TYPE_MIGRATE[n.type] || 'Discuss';
    });
  });
  return s;
}
// Migration: the old "Projected Costs" sub-tab (state.projectedCosts) was a
// leftover duplicate of what "Budget and Costs" (state.greenSheets) does
// better — same budget-vs-invoiced-by-cost-code idea, just older, and it
// never got removed after Budget and Costs shipped. Now that the sub-tab and
// all its UI/reducer code are gone, fold any legacy rows into greenSheets so
// nothing already keyed in is lost: each old entry becomes one Green Sheet
// budget line (system defaults to its description/cost-code label, budget
// and cost code carried over, supplier noted in `notes` since Green Sheet
// rows have no supplier field of their own), and any attachments move onto
// that job's contractDocs as "Green Sheet" documents (no longer tied to one
// specific budget row, just filed under the job). Called right after `state`
// is (re)assigned at the same three points as migrateAssignedPMs above —
// initial boot, a 409-conflict reload, and the background poll — so it
// always runs against the current global `state` (nextId below reads off
// that), not a not-yet-assigned local copy. state.projectedCosts is cleared
// at the end so re-running it is harmless. Unlike the assignedPMs rename,
// this one actually moves data between arrays rather than just renaming a
// field, so it must reach the server or the next load would just see the
// old unmigrated projectedCosts again and redo it — it returns true when it
// migrated anything so each call site can make sure a save actually happens
// (boot forces one; the 409 handler already schedules one; the poll
// schedules one only when it just did real migration work).
function migrateProjectedCosts(){
  const legacy = state.projectedCosts || [];
  if(!legacy.length) return false;
  legacy.forEach(entry=>{
    const greenSheetEntry = {
      id: nextId('greenSheets', entry.jobId, 'GRN'), jobId: entry.jobId,
      system: entry.description || costCodeLabel(entry.costCode) || entry.costCode || 'Migrated budget line',
      scope: '',
      budget: entry.budget,
      costCode: entry.costCode || '',
      notes: (entry.supplier ? `Supplier: ${entry.supplier}. ` : '') + `Migrated from the old Projected Costs section (was ${entry.id}).`
    };
    state.greenSheets.push(greenSheetEntry);
    if(entry.attachments && entry.attachments.length){
      const j = state.jobs.find(x=>x.id===entry.jobId);
      if(j){
        j.contractDocs = j.contractDocs || [];
        entry.attachments.forEach(a=>{
          j.contractDocs.push({ name: a.name, dataUrl: a.dataUrl, docType: 'Green Sheet', uploadedBy: '', uploadedDate: todayStr() });
        });
      }
    }
  });
  state.projectedCosts = [];
  return true;
}
function stateBytes(s){ return new Blob([JSON.stringify(s)]).size; }

/* ===================== AUTH (shared team passcode, optional Microsoft 365 SSO) =====================
   Nucleus is gated behind one shared team passcode by default (NUCLEUS_PASSCODE
   on the server) — not a per-person login. The server hands back a bearer
   token on successful login; it's kept in localStorage (not a cookie), sent
   back as `Authorization: Bearer <token>` on every request.
   Real per-person sign-in via Microsoft 365 (Entra ID) is available as an
   opt-in upgrade — see server/README.md — without changing anything here;
   the app just asks /api/auth-mode which flow is active. */
const AUTH_TOKEN_KEY = 'nucleus_auth_token';
function getAuthToken(){ try{ return localStorage.getItem(AUTH_TOKEN_KEY) || ''; }catch(e){ return ''; } }
function setAuthToken(token){ try{ if(token) localStorage.setItem(AUTH_TOKEN_KEY, token); else localStorage.removeItem(AUTH_TOKEN_KEY); }catch(e){} }
function authFetch(url, opts){
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {});
  const token = getAuthToken();
  if(token) headers['Authorization'] = 'Bearer ' + token;
  return fetch(url, Object.assign({}, opts, { headers }));
}

let ssoMode = false;
// {email, name, role, teamMemberId, matched} once signed in — set right after
// login, and re-confirmed fresh from the server on every boot() via /api/me,
// so a returning tab (not just a fresh sign-in) knows who's really signed in.
let verifiedIdentity = null;
async function checkAuthMode(){
  try{
    const res = await fetch('/api/auth-mode', {cache:'no-store'});
    const data = await res.json();
    ssoMode = !!(data && data.sso);
  }catch(e){ ssoMode = false; }
  const cpBtn = document.getElementById('change-password-btn');
  if(cpBtn) cpBtn.style.display = ssoMode ? 'none' : '';
}
function onSsoMessage(event){
  if(event.origin !== window.location.origin) return;
  const data = event.data;
  if(!data || data.type !== 'nucleus-auth') return;
  window.removeEventListener('message', onSsoMessage);
  if(data.error){ showLoginGate(data.error); return; }
  setAuthToken(data.token);
  verifiedIdentity = data.identity || null;
  boot();
}
function signInWithMicrosoft(){
  const w = 520, h = 650;
  const left = Math.max(0, (screen.width - w) / 2), top = Math.max(0, (screen.height - h) / 2);
  const popup = window.open('/auth/start', 'nucleus-sso', `width=${w},height=${h},left=${left},top=${top}`);
  if(!popup){
    const el = document.getElementById('gate-err');
    if(el){ el.textContent = 'Your browser blocked the sign-in pop-up — allow pop-ups for this site and try again.'; el.style.display='block'; }
    return;
  }
  window.addEventListener('message', onSsoMessage);
}

async function submitLogin(){
  const emailEl = document.getElementById('gate-email');
  const passwordEl = document.getElementById('gate-password');
  const errEl = document.getElementById('gate-err');
  const btn = document.getElementById('gate-submit');
  const email = emailEl ? emailEl.value.trim() : '';
  const password = passwordEl ? passwordEl.value : '';
  if(!email || !password){ if(errEl){ errEl.textContent = 'Enter your email and password.'; errEl.style.display='block'; } return; }
  if(btn) btn.disabled = true;
  try{
    const res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, password}) });
    if(!res.ok){
      const msg = res.status === 429
        ? "Too many attempts — wait a few minutes before trying again."
        : "That email and password didn't match — check with whoever manages Nucleus.";
      if(errEl){ errEl.textContent = msg; errEl.style.display='block'; }
      if(btn) btn.disabled = false;
      return;
    }
    const data = await res.json();
    setAuthToken(data.token);
    verifiedIdentity = data.identity || null;
    boot();
  }catch(e){
    if(errEl){ errEl.textContent = "Couldn't reach the server — check your connection and try again."; errEl.style.display='block'; }
    if(btn) btn.disabled = false;
  }
}

        <div class="err" id="gate-err"></div>
        <button class="btn safety" id="gate-submit" style="width:100%;" onclick="signInWithMicrosoft()">Sign in with Microsoft 365</button>
      </div>`;

  }
  app.innerHTML = `
    <div style="max-width:360px; margin:60px auto; padding:28px 26px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 2px 10px rgba(0,0,0,.06);">
      <h2 style="margin:0 0 4px; font-family:var(--disp);">Nucleus</h2>
      <p class="sub" style="margin-top:0;">Sign in with your email and password to continue.</p>
      ${message ? `<div class="issue-meta" style="margin-bottom:10px;">${esc(message)}</div>` : ''}
      <div class="field"><label>Email</label>
        <input type="email" id="gate-email" placeholder="name@cserectors.com" autocomplete="username" onkeydown="if(event.key==='Enter') document.getElementById('gate-password').focus()">
      </div>

        <input type="password" id="gate-password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter') submitLogin()">
      </div>

    </div>`;
  const input = document.getElementById('gate-email');

async function signOut(){
  try{ await authFetch('/api/logout', {method:'POST'}); }catch(e){}
  setAuthToken('');
  verifiedIdentity = null;
  location.reload();
}

function openChangePasswordModal(){
  if(ssoMode){ alert('Your password is managed by Microsoft 365 — sign in there to change it.'); return; }
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  overlay.innerHTML = changePasswordModalHTML();
  document.body.appendChild(overlay);
  const input = document.getElementById('change-password-current');

}
function changePasswordModalHTML(){
  return `<div class="modal" style="max-width:420px;">
    <h3>Change your password</h3>
    <div class="field"><label>Current password</label>
      <input type="password" id="change-password-current" autocomplete="current-password">
    </div>
    <div class="field"><label>New password</label>
      <input type="password" id="change-password-new" placeholder="At least 8 characters" autocomplete="new-password">
    </div>
    <div class="err" id="change-password-err"></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
      <button class="btn safety" id="change-password-submit" onclick="submitChangePassword()">Save</button>
    </div>
  </div>`;
}
async function submitChangePassword(){
  const currentEl = document.getElementById('change-password-current');
  const newEl = document.getElementById('change-password-new');
  const errEl = document.getElementById('change-password-err');
  const btn = document.getElementById('change-password-submit');
  const currentPassword = currentEl ? currentEl.value : '';
  const newPassword = newEl ? newEl.value : '';
  if(newPassword.length < 8){ if(errEl){ errEl.textContent = 'New password must be at least 8 characters.'; errEl.style.display='block'; } return; }
  if(btn) btn.disabled = true;
  try{
    const res = await authFetch('/api/accounts/change-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({currentPassword, newPassword}) });
    if(!res.ok){
      const data = await res.json().catch(()=>({}));
      if(errEl){ errEl.textContent = data.message || "That didn't work — check your current password and try again."; errEl.style.display='block'; }
      if(btn) btn.disabled = false;
      return;
    }
    closeModal();
    alert('Password changed.');
  }catch(e){
    if(errEl){ errEl.textContent = "Couldn't reach the server — check your connection and try again."; errEl.style.display='block'; }
    if(btn) btn.disabled = false;
  }
}

function loadQueue(){

}

  try{ sessionStorage.setItem('nucleus_pending', JSON.stringify(pendingQueue)); }catch(e){}
